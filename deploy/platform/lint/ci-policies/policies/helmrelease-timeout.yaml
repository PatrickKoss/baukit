apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: helmrelease-timeout
  annotations:
    policies.kyverno.io/title: HelmRelease explicit timeout
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: [v2]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  validations:
    - expression: object.spec.?timeout.orValue("") != ""
      messageExpression: >-
        "HelmRelease " + object.metadata.name + " must set spec.timeout to about three times its " +
        "measured install time, rounded up to whole minutes and at least 5m."

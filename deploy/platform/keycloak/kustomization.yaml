apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - database.yaml
  - statefulset.yaml
  - service.yaml
  - servicemonitor.yaml
  - network-policy.yaml
  - realm-import-job.yaml
components:
  - ../components/network-policy/default-deny
  - ../components/network-policy/dns-egress
configMapGenerator:
  - name: keycloak-realms
    namespace: keycloak
    options:
      labels:
        app.kubernetes.io/name: keycloak-realm-import
        app.kubernetes.io/part-of: baukit-platform
        baukit.dev/component: identity
# The shared components carry no namespace, and a namespace transformer would also move the
# DatabaseRole and Database out of postgres.
patches:
  - target:
      kind: NetworkPolicy
      name: default-deny|allow-dns-egress
    patch: |-
      - op: add
        path: /metadata/namespace
        value: keycloak

apiVersion: v1
kind: Service
metadata:
  name: cluster-ip
  namespace: shop
spec:
  type: ClusterIP
  selector:
    app: shop
  ports:
    - name: http
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: LoadBalancer
  selector:
    app: shop
  ports:
    - name: http
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svclb
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app: shop
  ports:
    - name: http
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-lb
  namespace: shop
spec:
  type: LoadBalancer
  selector:
    app: shop
  ports:
    - name: http
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-nodeport
  namespace: shop
spec:
  type: NodePort
  selector:
    app: shop
  ports:
    - name: http
      port: 80

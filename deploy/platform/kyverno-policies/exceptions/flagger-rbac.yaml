apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: flagger-rbac
  namespace: kyverno
  labels:
    app.kubernetes.io/part-of: baukit-platform
  annotations:
    baukit.dev/reason: >-
      Flagger reads whatever external metric a Canary names, so the chart grants get, list and watch on every resource of external.metrics.k8s.io; it writes nothing there.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: restrict-wildcard-rbac
  matchConditions:
    - name: workload
      expression: >-
        object.kind == "ClusterRole" && object.metadata.name == "flagger"

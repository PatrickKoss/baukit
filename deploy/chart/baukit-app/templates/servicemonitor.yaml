{{- if and .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "baukit-app.fullname" . }}-api
  labels:
    {{- include "baukit-app.processLabels" (dict "root" . "process" "api") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "baukit-app.processSelectorLabels" (dict "root" . "process" "api") | nindent 6 }}
      baukit.dev/endpoint: ops
  endpoints:
    - port: metrics
      path: /metrics
      honorLabels: true
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      relabelings:
        # Metrics deliberately omit deployment identity dimensions. Attach the
        # bounded platform labels during target discovery, as required by the
        # shared observability contract.
        - action: replace
          targetLabel: product
          replacement: {{ include "baukit-app.labelValue" .Values.product | quote }}
        - action: replace
          targetLabel: service
          replacement: {{ printf "%s-api" (include "baukit-app.labelValue" .Values.product) | quote }}
        - action: replace
          targetLabel: environment
          replacement: {{ .Values.deploymentEnvironment | quote }}
{{- if and .Values.worker.enabled .Values.worker.ops.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "baukit-app.fullname" . }}-worker
  labels:
    {{- include "baukit-app.processLabels" (dict "root" . "process" "worker") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "baukit-app.processSelectorLabels" (dict "root" . "process" "worker") | nindent 6 }}
      baukit.dev/endpoint: ops
  endpoints:
    - port: metrics
      path: /metrics
      honorLabels: true
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      relabelings:
        - action: replace
          targetLabel: product
          replacement: {{ include "baukit-app.labelValue" .Values.product | quote }}
        - action: replace
          targetLabel: service
          replacement: {{ printf "%s-worker" (include "baukit-app.labelValue" .Values.product) | quote }}
        - action: replace
          targetLabel: environment
          replacement: {{ .Values.deploymentEnvironment | quote }}
{{- end }}
{{- end }}

apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kustomization-wait
  annotations:
    policies.kyverno.io/title: Kustomization wait
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [kustomizations]
  validations:
    - expression: object.spec.?wait.orValue(false) == true
      messageExpression: >-
        "Kustomization " + object.metadata.name + " must set spec.wait: true, so it turns Ready only " +
        "after every object it applied is ready."

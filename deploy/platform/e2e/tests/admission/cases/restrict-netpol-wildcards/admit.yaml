apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admission-traefik
  namespace: e2e-tenant
spec:
  podSelector:
    matchLabels:
      app: admission
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik

url = "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv{version}/kustomize_v{version}_{os}_{arch}.tar.gz"
member = "kustomize"
version_args = ["version"]
sha256 = { linux-amd64 = "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61", linux-arm64 = "9867b76482cfc6d25b546abc1d2b5a32bd137505aba640649b4b378f64f6d68f", darwin-arm64 = "4cbb08e209d8fff47cd60bfb6407daaf5ee699f9b9295849a1065024fac2d1ef" }

[tools.helm]

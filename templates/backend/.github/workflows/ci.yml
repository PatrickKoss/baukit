name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - run: cargo fmt --manifest-path backend/Cargo.toml --all --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml
      - run: cargo test --manifest-path backend/Cargo.toml -p {{ context.app_name }}-bin --test openapi_drift

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Flux v2.9.4 controller images by multi-arch index digest. flux_lockdown_images in
# flux-lockdown.sh lists the same references.
images:
  - name: ghcr.io/fluxcd/source-controller
    newTag: v1.9.4
    digest: sha256:8a8ed0a57b8b86f561d5a4309a69f65e62f0cebe4de8801593c5ff35a3bc3c23
  - name: ghcr.io/fluxcd/kustomize-controller
    newTag: v1.9.4
    digest: sha256:2b8bec54ffb6caf421bd2a6c005d27f567d5dd4db7feb55794fb51fcabd69b8f
  - name: ghcr.io/fluxcd/helm-controller
    newTag: v1.6.3
    digest: sha256:16ada99456385100698a5d7adf90aba8a2089d987ab541c9566b6d7b0e897038
  - name: ghcr.io/fluxcd/notification-controller
    newTag: v1.9.3
    digest: sha256:071c351a0fb163eeb6a2bb82f1e894f51b6b0734216d2e97d3d99c9ab9d710b9
patches:
  - target:
      kind: Deployment
      name: (kustomize-controller|helm-controller)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --no-cross-namespace-refs=true
  - target:
      kind: Deployment
      name: kustomize-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --no-remote-bases=true
  - target:
      kind: Deployment
      name: kustomize-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --default-service-account=default
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: flux-system
      namespace: flux-system
    patch: |-
      - op: add
        path: /spec/serviceAccountName
        value: kustomize-controller

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - oci-repository.yaml
  - helm-release.yaml
  - network-policy.yaml
namespace: cert-manager
components:
  - ../components/network-policy/default-deny
  - ../components/network-policy/dns-egress
  - ../components/network-policy/apiserver-egress
  - ../components/network-policy/prometheus-scrape
  - ../components/network-policy/internet-https
patches:
  - target:
      kind: NetworkPolicy
      name: allow-prometheus-scrape
    patch: |-
      - op: replace
        path: /spec/ingress/0/ports
        value:
          - protocol: TCP
            port: 9402
  - target:
      kind: NetworkPolicy
      name: allow-internet-https
    patch: |-
      - op: replace
        path: /spec/podSelector
        value:
          matchLabels:
            app.kubernetes.io/name: cert-manager
            app.kubernetes.io/component: controller

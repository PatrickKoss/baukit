[advisories]
ignore = [
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained with no successor release; reached only through serde_yaml_ng 0.10.0, which the CLI uses to parse its own templates and product config; remove when the CLI moves to a maintained YAML parser" },
]

[licenses]
confidence-threshold = 0.8
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

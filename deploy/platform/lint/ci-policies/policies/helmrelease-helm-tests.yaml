apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: helmrelease-helm-tests
  annotations:
    policies.kyverno.io/title: HelmRelease Helm tests
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: [v2]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  variables:
    - name: chartsWithTests
      expression: '["falco", "kyverno"]'
    - name: chart
      expression: object.spec.?chart.?spec.?chart.orValue("")
  validations:
    - expression: >-
        !(variables.chart in variables.chartsWithTests) ||
        object.spec.?test.?enable.orValue(false) == true
      messageExpression: >-
        "HelmRelease " + object.metadata.name + " installs chart " + variables.chart + ", which renders Helm test hooks. " +
        "Set spec.test.enable: true, so Flux runs them after every install and upgrade."

apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: identity
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-management
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: identity
    baukit.dev/service: management
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: management
      port: 9000
      targetPort: management
      protocol: TCP

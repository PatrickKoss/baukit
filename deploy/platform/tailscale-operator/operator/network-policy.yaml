# Coordination server, DERP relays and STUN, and direct WireGuard to peers, which may sit on a LAN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailnet-egress
  labels:
    app.kubernetes.io/part-of: baukit-platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 3478
        - protocol: UDP
          port: 41641
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-egress
  labels:
    app.kubernetes.io/part-of: baukit-platform
spec:
  podSelector:
    matchLabels:
      tailscale.com/managed: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443

target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PL"]
ignore = [
  # ruff format owns wrapping; the long lines left are expected-output string literals.
  "E501",
  # Gate scripts run fixed tool commands built from repo paths, never from untrusted input.
  "S603",
  "S607",
  # Scripts compare against literal exit codes, ports, HTTP statuses and versions.
  "PLR2004",
  # Keyword-only flags count as arguments; PLR0917 still caps positional ones.
  "PLR0913",
]

[lint.per-file-ignores]
# unittest suites narrow importlib specs with assert and use fake API keys as inputs.
"**/test_*.py" = ["S101", "S105"]
# urlopen targets are http://localhost endpoints of the smoke stack; the password belongs
# to the generated Keycloak realm's local "test" user.
"scripts/mcp-remote-smoke.py" = ["S106", "S310"]
# urlopen targets are built from the https API_BASE constant.
"scripts/generate-jingle.py" = ["S310"]

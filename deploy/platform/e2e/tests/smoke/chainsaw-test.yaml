# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke
spec:
  description: >-
    Every Flux object is Ready and no pod restarted more than once. Namespaces named chainsaw-* belong
    to the suites running beside this one, and flux-tenancy's are Not Ready on purpose, so both checks
    skip them.
  steps:
    - name: flux-objects-ready
      try:
        - script:
            timeout: 4m
            content: |
              set -eu
              # A periodic reconcile sets Ready to Unknown for a few seconds, so only a lasting state fails.
              deadline=$(($(date +%s) + 180))
              while :; do
                not_ready=$(kubectl get gitrepositories,helmrepositories,kustomizations,helmreleases -A --no-headers \
                  -o 'custom-columns=KIND:.kind,NAMESPACE:.metadata.namespace,NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status' |
                  awk '$2 !~ /^chainsaw-/ && $4 != "True"')
                [ -n "$not_ready" ] || exit 0
                [ "$(date +%s)" -lt "$deadline" ] || break
                sleep 5
              done
              printf 'Flux objects not Ready after 180s:\n%s\n' "$not_ready" >&2
              exit 1
    - name: pods-restarted-at-most-once
      try:
        - script:
            content: |
              set -eu
              restarted=$(kubectl get pods -A --no-headers \
                -o 'custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,INIT:.status.initContainerStatuses[*].restartCount,MAIN:.status.containerStatuses[*].restartCount' |
                awk '$1 !~ /^chainsaw-/ { split($3 "," $4, counts, ","); for (i in counts) if (counts[i] + 0 > 1) { print; break } }')
              if [ -n "$restarted" ]; then
                printf 'Pods with a container restarted more than once:\n%s\n' "$restarted" >&2
                exit 1
              fi

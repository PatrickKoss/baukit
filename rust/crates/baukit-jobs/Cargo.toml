[package]
name = "baukit-jobs"
description = "Durable PostgreSQL outbox storage and supervised worker execution for Baukit services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Maps `baukit_egress::EgressError` to `JobError` with `egress_job_error`.
egress = ["dep:baukit-egress"]

[dependencies]
baukit-egress = { workspace = true, optional = true }
baukit-resilience.workspace = true
baukit-runtime.workspace = true
baukit-telemetry.workspace = true
jiff.workspace = true
jiff-sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
baukit-test = { path = "../baukit-test", features = ["sqlx-postgres"] }
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# CNPG deprecates Cluster.spec.monitoring.enablePodMonitor and asks for a manual PodMonitor.
# The instance endpoint also serves the barman-cloud plugin's backup metrics.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-cluster
  labels:
    app.kubernetes.io/part-of: baukit-platform
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-cluster
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics

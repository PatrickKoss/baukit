apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: identity
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: baukit-platform
        baukit.dev/component: identity
        baukit.dev/postgres-client: "true"
    spec:
      priorityClassName: platform-standard
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The Database and DatabaseRole apply with this StatefulSet, so CNPG may not have created them yet.
        - name: wait-for-database
          image: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:c437b7c6c00aa7e66f5d6de1dd83602391fdebd4ff776ffb1ab7aaba5e7351ad
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              deadline=$(( $(date +%s) + WAIT_SECONDS ))
              until psql -XtAq -v ON_ERROR_STOP=1 -c 'select 1' >/dev/null; do
                [ "$(date +%s)" -lt "${deadline}" ] || { printf 'database %s not reachable as %s after %ss\n' "${PGDATABASE}" "${PGUSER}" "${WAIT_SECONDS}" >&2; exit 1; }
                sleep 2
              done
          env:
            - name: WAIT_SECONDS
              value: "300"
            - name: PGHOST
              value: postgres-cluster-rw.postgres.svc.cluster.local
            - name: PGDATABASE
              value: keycloak
            - name: PGCONNECT_TIMEOUT
              value: "3"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: password
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext: &container-security
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
        # kc.sh build rewrites lib/quarkus, so it gets a writable copy of the image's files.
        - name: seed
          image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c, cp -R /opt/keycloak/lib/quarkus/. /seed/]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext: *container-security
          volumeMounts:
            - name: quarkus
              mountPath: /seed
        - name: build
          image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
          imagePullPolicy: IfNotPresent
          args: [build]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_EVENT_METRICS_USER_ENABLED
              value: "true"
            - name: KC_CACHE
              value: local
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext: *container-security
          volumeMounts: &keycloak-mounts
            - name: quarkus
              mountPath: /opt/keycloak/lib/quarkus
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
          imagePullPolicy: IfNotPresent
          args: [start, --optimized]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_EVENT_METRICS_USER_ENABLED
              value: "true"
            - name: KC_CACHE
              value: local
            - name: KC_DB_URL_HOST
              value: postgres-cluster-rw.postgres.svc.cluster.local
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: password
            - name: KC_DB_POOL_MIN_SIZE
              value: "1"
            - name: KC_DB_POOL_MAX_SIZE
              value: "10"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-admin
                  key: password
            # The overlay replaces this with the public issuer origin.
            - name: KC_HOSTNAME
              value: https://keycloak.example.invalid
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_LOG_CONSOLE_OUTPUT
              value: json
            - name: JAVA_OPTS_KC_HEAP
              value: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext: *container-security
          volumeMounts: *keycloak-mounts
      volumes:
        - name: quarkus
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m
  timeout: 5m
  dependsOn:
    - name: kyverno
  chartRef:
    kind: OCIRepository
    name: kyverno-policies
    namespace: kyverno
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    podSecurityStandard: restricted
    podSecurityVersion: v1.37
    validationFailureAction: Audit
    failurePolicy: Ignore
    kyvernoVersion: "1.20.0"

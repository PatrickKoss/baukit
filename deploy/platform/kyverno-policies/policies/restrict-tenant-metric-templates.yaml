apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-tenant-metric-templates
  labels:
    app.kubernetes.io/part-of: baukit-platform
  annotations:
    policies.kyverno.io/title: Point tenant MetricTemplates at the tenant metrics proxy
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Flagger queries a MetricTemplate's provider from its own pod. A tenant MetricTemplate uses the
      prometheus provider at the tenant-metrics-proxy Service in its own namespace. The proxy, which
      components/tenant installs, writes namespace="<tenant>" into every selector of the query, so
      a bare metric name cannot read another namespace's series.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [flagger.app]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [metrictemplates]
    namespaceSelector:
      matchLabels:
        baukit.dev/tenant: "true"
  variables:
    - name: proxy
      expression: >-
        "http://tenant-metrics-proxy." + object.metadata.namespace + ".svc.cluster.local:8080"
    - name: provider
      expression: object.spec.?provider.orValue({})
  validations:
    - expression: >-
        variables.provider.?type.orValue("") == "prometheus" &&
        variables.provider.?address.orValue("") == variables.proxy &&
        !has(variables.provider.secretRef)
      messageExpression: >-
        "MetricTemplate " + object.metadata.name + " must use provider type prometheus with address " +
        variables.proxy + " and no secretRef."

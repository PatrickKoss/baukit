apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shop
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shop-db
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: empty-peer
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: any-namespace-egress
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-any-namespace
  namespace: platform
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}

{{- if .Values.ingress.enabled }}
{{- $annotations := deepCopy .Values.ingress.annotations }}
{{- with .Values.ingress.certManager.clusterIssuer }}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" . }}
{{- end }}
{{- $retry := .Values.ingress.retry }}
{{- $middlewares := list }}
{{- with .Values.ingress.rateLimitMiddleware }}
{{- $middlewares = append $middlewares . }}
{{- end }}
{{- if $retry.enabled }}
{{- $middlewares = append $middlewares (printf "%s-%s@kubernetescrd" .Release.Namespace (include "baukit-app.retryMiddlewareName" .)) }}
{{- end }}
{{- with $middlewares }}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" (join "," .) }}
{{- end }}
{{- if $retry.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "baukit-app.retryMiddlewareName" . }}
  labels:
    {{- include "baukit-app.processLabels" (dict "root" . "process" "api") | nindent 4 }}
spec:
  retry:
    attempts: {{ $retry.attempts }}
    initialInterval: {{ $retry.initialInterval | quote }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "baukit-app.fullname" . }}
  labels:
    {{- include "baukit-app.processLabels" (dict "root" . "process" "api") | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if $.Values.mcp.enabled }}
          {{- range list "/mcp" "/.well-known/oauth-protected-resource" "/.well-known/oauth-protected-resource/mcp" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ include "baukit-app.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "baukit-app.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}


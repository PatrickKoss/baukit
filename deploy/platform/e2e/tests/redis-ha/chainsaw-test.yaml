# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: redis-ha
spec:
  description: >-
    Killing the Redis master triggers a Sentinel failover. The restarted old master rejoins as a replica of
    the promoted pod instead of coming back as an empty master, and a key written before the kill survives on
    both. The e2e overlay composes components/redis-ha-acl: a tenant ACL user runs the rate-limit script
    under its own namespace and gets NOPERM for another tenant's keys and for FLUSHALL. A user added to
    Secret redis-ha-acl logs in on every pod without a restart, and a users.acl that Redis rejects keeps
    the previous users working.
  timeouts:
    exec: 5m
  steps:
    - name: tenant-acl
      try:
        - script:
            timeout: 3m
            content: |
              set -eu
              ns=platform-redis
              kubectl -n "$ns" rollout status statefulset/redis --timeout=180s
              master="$(kubectl -n "$ns" exec redis-0 -c sentinel -- \
                redis-cli -p 26379 --raw SENTINEL get-master-addr-by-name mymaster | head -n 1)"
              master="${master%%.*}"
              as_user() {
                user="$1"; shift
                kubectl -n "$ns" exec "$master" -c redis -- \
                  redis-cli --no-auth-warning --user "$user" --pass "e2e-$user-password" "$@" 2>&1
              }
              # TOKEN_BUCKET_SCRIPT from rust/crates/baukit-ratelimit/src/redis_store.rs.
              script="$(cat <<'LUA'
              local current = redis.call('TIME')
              local now_ms = (current[1] * 1000) + math.floor(current[2] / 1000)
              local capacity = tonumber(ARGV[1])
              local requests = tonumber(ARGV[2])
              local period_ms = tonumber(ARGV[3])
              local ttl_ms = tonumber(ARGV[4])
              local values = redis.call('HMGET', KEYS[1], 'tokens', 'last_refill_ms')
              local tokens = tonumber(values[1]) or capacity
              local last_refill_ms = tonumber(values[2]) or now_ms
              local elapsed_ms = math.max(0, now_ms - last_refill_ms)
              tokens = math.min(capacity, tokens + (elapsed_ms * requests / period_ms))
              local allowed = 0
              local retry_ms = 0
              if tokens >= 1 then
                allowed = 1
                tokens = tokens - 1
              else
                retry_ms = math.ceil((1 - tokens) * period_ms / requests)
              end
              redis.call('HSET', KEYS[1], 'tokens', tokens, 'last_refill_ms', now_ms)
              redis.call('PEXPIRE', KEYS[1], ttl_ms)
              return {allowed, math.floor(tokens), retry_ms}
              LUA
              )"
              expect_noperm() {
                printf '%s\n' "$2"
                case "$2" in
                  *NOPERM*) printf 'PASS: %s refused\n' "$1" ;;
                  *) printf 'FAIL: %s was not refused\n' "$1" >&2; exit 1 ;;
                esac
              }

              own="$(as_user tenant-a --raw EVAL "$script" 1 tenant-a:rl:id:e2e 5 5 60000 60000)"
              printf '%s\n' "$own"
              [ "$(printf '%s\n' "$own" | head -n 1)" = 1 ] || { printf 'FAIL: own namespace\n' >&2; exit 1; }
              printf 'PASS: tenant-a ran the rate-limit script on tenant-a:rl:id:e2e\n'
              [ "$(as_user tenant-a --raw HMGET tenant-a:rl:id:e2e tokens | head -n 1)" = 4 ]
              printf 'PASS: tenant-a read its bucket back\n'

              expect_noperm "tenant-a EVAL on tenant-b:rl:id:e2e" \
                "$(as_user tenant-a EVAL "$script" 1 tenant-b:rl:id:e2e 5 5 60000 60000)"
              expect_noperm "tenant-a FLUSHALL" "$(as_user tenant-a FLUSHALL)"
              expect_noperm "tenant-a CONFIG GET" "$(as_user tenant-a CONFIG GET maxmemory)"
              expect_noperm "tenant-a KEYS" "$(as_user tenant-a KEYS '*')"
              expect_noperm "default user GET" \
                "$(kubectl -n "$ns" exec "$master" -c redis -- redis-cli GET tenant-a:rl:id:e2e 2>&1)"
              [ "$(as_user tenant-b --raw EXISTS tenant-a:rl:id:e2e 2>&1 | grep -c NOPERM)" = 1 ]
              printf 'PASS: tenant-b cannot see tenant-a keys\n'

              for pod in redis-0 redis-1 redis-2; do
                kubectl -n "$ns" exec "$pod" -c redis -- \
                  wget -qO- http://127.0.0.1:9121/metrics | grep -qx 'redis_up 1'
              done
              printf 'PASS: exporter on every pod reports redis_up 1 as monitor\n'
    - name: acl-reload
      try:
        - script:
            timeout: 10m
            content: |
              set -eu
              ns=platform-redis
              pods="redis-0 redis-1 redis-2"
              kubectl -n "$ns" rollout status statefulset/redis --timeout=180s
              # Flux would put the fixture back while the test edits it.
              kubectl -n "$ns" annotate secret redis-ha-acl kustomize.toolkit.fluxcd.io/reconcile=disabled --overwrite
              original="$(kubectl -n "$ns" get secret redis-ha-acl -o jsonpath='{.data.users\.acl}')"
              tenant_line() {
                printf 'user %s on >e2e-%s-password resetkeys ~%s:* resetchannels -@all +get +set %s\n' \
                  "$1" "$1" "$1" "${2:-}"
              }
              set_users() {
                data="$(printf '%s' "$1" | base64 | tr -d '\n')"
                kubectl -n "$ns" patch secret redis-ha-acl --type merge \
                  -p "{\"data\":{\"users.acl\":\"$data\"}}" >/dev/null
              }
              restarts() {
                kubectl -n "$ns" get pods -l app.kubernetes.io/name=redis -o \
                  jsonpath='{range .items[*]}{.metadata.name} {.metadata.uid}{range .status.containerStatuses[*]} {.name}={.restartCount}{end}{"\n"}{end}'
              }
              answer() {
                kubectl -n "$ns" exec "$1" -c redis -- \
                  redis-cli --no-auth-warning --user "$2" --pass "e2e-$2-password" GET "$2:acl-reload" 2>&1
              }
              logs_in() {
                case "$(answer "$1" "$2")" in *WRONGPASS* | *ERR* | *NOPERM*) return 1 ;; esac
              }
              refused() { answer "$1" "$2" | grep -q WRONGPASS; }
              on_every_pod() {
                for pod in $pods; do "$@" "$pod" || return 1; done
              }
              wait_until() {
                deadline=$(($(date +%s) + $1)); shift
                while [ "$(date +%s)" -lt "$deadline" ]; do
                  if "$@"; then return 0; fi
                  sleep 3
                done
                return 1
              }
              tenant_c_logs_in() { logs_in "$1" tenant-c; }
              tenant_c_refused() { refused "$1" tenant-c; }
              rejected() {
                kubectl -n "$ns" logs "$1" -c acl-reload --since=10m | grep -q 'ACL LOAD rejected users.acl'
              }
              failed_loads() {
                kubectl -n "$ns" exec "$1" -c redis -- wget -qO- http://127.0.0.1:9121/metrics |
                  sed -n 's/^redis_commands_failed_calls_total{cmd="acl|load"} //p'
              }
              failed_count() { failed_loads "$1" | cut -d . -f 1; }
              failed_totals() {
                for pod in $pods; do printf '%s=%s\n' "$pod" "$(failed_count "$pod")"; done
              }
              acl_load_failed() {
                base="$(printf '%s\n' "$failed_before" | sed -n "s/^$1=//p")"
                [ "$(failed_count "$1")" -gt "${base:-0}" ] 2>/dev/null
              }
              master() {
                kubectl -n "$ns" exec redis-0 -c sentinel -- \
                  redis-cli -p 26379 --raw SENTINEL get-master-addr-by-name mymaster | head -n 1
              }

              before="$(restarts)"
              master_before="$(master)"
              printf 'restart counts before:\n%s\n' "$before"
              users="$(printf '%s' "$original" | base64 -d)"
              on_every_pod tenant_c_refused
              printf 'PASS: tenant-c is unknown on every pod\n'

              set_users "$users
              $(tenant_line tenant-c)"
              wait_until 240 on_every_pod tenant_c_logs_in ||
                { printf 'FAIL: tenant-c cannot log in on every pod within 240s\n' >&2; exit 1; }
              printf 'PASS: tenant-c logs in on every pod after the Secret changed\n'

              failed_before="$(failed_totals)"
              set_users "$users
              $(tenant_line tenant-c)
              $(tenant_line tenant-d +nosuchcommand)"
              wait_until 240 on_every_pod rejected ||
                { printf 'FAIL: acl-reload did not report the rejected file on every pod\n' >&2; exit 1; }
              for pod in $pods; do
                logs_in "$pod" tenant-c || { printf 'FAIL: tenant-c lost access on %s\n' "$pod" >&2; exit 1; }
                logs_in "$pod" tenant-a || { printf 'FAIL: tenant-a lost access on %s\n' "$pod" >&2; exit 1; }
                refused "$pod" tenant-d || { printf 'FAIL: tenant-d logs in on %s\n' "$pod" >&2; exit 1; }
                if kubectl -n "$ns" logs "$pod" -c acl-reload | grep -q 'e2e-tenant-d-password'; then
                  printf 'FAIL: %s acl-reload logged a password\n' "$pod" >&2; exit 1
                fi
              done
              printf 'PASS: the rejected file left tenant-a and tenant-c working and tenant-d out\n'
              kubectl -n "$ns" logs redis-0 -c acl-reload | grep 'ACL LOAD rejected' | tail -n 1
              wait_until 120 on_every_pod acl_load_failed ||
                { printf 'FAIL: redis_commands_failed_calls_total{cmd="acl|load"} did not rise\n' >&2; exit 1; }
              for pod in $pods; do
                printf '%s redis_commands_failed_calls_total{cmd="acl|load"} %s -> %s\n' "$pod" \
                  "$(printf '%s\n' "$failed_before" | sed -n "s/^$pod=//p")" "$(failed_loads "$pod")"
              done

              set_users "$users"
              wait_until 240 on_every_pod tenant_c_refused ||
                { printf 'FAIL: tenant-c still logs in after it was removed\n' >&2; exit 1; }
              printf 'PASS: removing tenant-c from the Secret logs it out on every pod\n'

              after="$(restarts)"
              printf 'restart counts after:\n%s\n' "$after"
              [ "$after" = "$before" ] || { printf 'FAIL: a container restarted or a pod was replaced\n' >&2; exit 1; }
              [ "$(master)" = "$master_before" ] || { printf 'FAIL: the master changed\n' >&2; exit 1; }
              printf 'PASS: no restart, no new pod and no failover\n'
      catch:
        - script:
            content: |
              for pod in redis-0 redis-1 redis-2; do
                printf '=== %s/acl-reload\n' "$pod"
                kubectl -n platform-redis logs "$pod" -c acl-reload --timestamps || true
              done
              kubectl -n platform-redis get pods -o wide || true
      finally:
        - script:
            timeout: 3m
            content: |
              set -eu
              kubectl -n platform-redis annotate secret redis-ha-acl kustomize.toolkit.fluxcd.io/reconcile-
              kubectl -n flux-system annotate kustomization e2e-redis \
                reconcile.fluxcd.io/requestedAt="$(date +%s)" --overwrite
              kubectl -n flux-system wait kustomization e2e-redis --for=condition=Ready --timeout=150s
    - name: failover-and-rejoin
      try:
        - script:
            timeout: 5m
            content: |
              set -eu
              ns=platform-redis
              key=baukit-e2e-redis-ha
              value="written-$(date +%s)"
              cli() {
                pod="$1"; shift
                kubectl -n "$ns" exec "$pod" -c redis -- \
                  redis-cli --no-auth-warning --user admin --pass e2e-admin-password "$@"
              }
              sentinel_master() {
                kubectl -n "$ns" exec "$1" -c sentinel -- \
                  redis-cli -p 26379 --raw SENTINEL get-master-addr-by-name mymaster | head -n 1
              }
              pod_of() { printf '%s' "${1%%.*}"; }
              role() { cli "$1" --raw ROLE | head -n 1; }
              wait_until() {
                deadline=$(($(date +%s) + $1)); shift
                while [ "$(date +%s)" -lt "$deadline" ]; do
                  if "$@"; then return 0; fi
                  sleep 2
                done
                return 1
              }

              kubectl -n "$ns" rollout status statefulset/redis --timeout=180s
              old_master="$(pod_of "$(sentinel_master redis-1)")"
              printf 'master before kill: %s\n' "$old_master"
              [ "$(role "$old_master")" = master ]
              survivor=redis-0
              [ "$old_master" != redis-0 ] || survivor=redis-1

              cli "$old_master" SET "$key" "$value"
              cli "$old_master" WAIT 2 5000

              kubectl -n "$ns" delete pod "$old_master" --grace-period=0 --force --wait=false

              promoted() {
                m="$(pod_of "$(sentinel_master "$survivor" 2>/dev/null || true)")"
                [ -n "$m" ] && [ "$m" != "$old_master" ] && [ "$(role "$m" 2>/dev/null)" = master ]
              }
              wait_until 120 promoted || { printf 'no replica was promoted within 120s\n' >&2; exit 1; }
              new_master="$(pod_of "$(sentinel_master "$survivor")")"
              printf 'promoted master: %s\n' "$new_master"

              kubectl -n "$ns" wait pod "$old_master" --for=condition=Ready --timeout=180s
              rejoined() {
                [ "$(role "$old_master" 2>/dev/null)" = slave ] &&
                  cli "$old_master" INFO replication |
                  grep -q '^master_link_status:up'
              }
              wait_until 120 rejoined || { printf '%s did not rejoin as a replica\n' "$old_master" >&2; exit 1; }
              printf '%s rejoined as a replica\n' "$old_master"

              [ "$(cli "$new_master" --raw GET "$key")" = "$value" ]
              [ "$(cli "$old_master" --raw GET "$key")" = "$value" ]
              printf 'key intact on %s and %s\n' "$new_master" "$old_master"
      catch:
        - script:
            content: |
              for pod in redis-0 redis-1 redis-2; do
                for container in redis sentinel; do
                  printf '=== %s/%s\n' "$pod" "$container"
                  kubectl -n platform-redis logs "$pod" -c "$container" --timestamps || true
                  printf '=== %s/%s previous\n' "$pod" "$container"
                  kubectl -n platform-redis logs "$pod" -c "$container" --timestamps --previous || true
                done
              done
              kubectl -n platform-redis get pods -o wide || true

apiVersion: cli.kyverno.io/v1alpha1
kind: ClusterResource
metadata:
  name: namespaces
spec:
  crds:
    - crds/ingressroute.yaml
    - crds/middleware.yaml
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: shop
        labels:
          baukit.dev/tenant: "true"
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: other
        labels:
          baukit.dev/tenant: "true"
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: platform
    - apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: other
        namespace: other
      spec:
        entryPoints: [websecure]
        routes:
          - kind: Rule
            match: Host(`other.example.test`) && PathPrefix(`/`)
            services:
              - name: other
                port: 80
    - apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: solo
        namespace: other
      spec:
        entryPoints: [websecure]
        routes:
          - kind: Rule
            match: Host(`solo.example.test`)
            services:
              - name: solo
                port: 80
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: legacy
        namespace: other
      spec:
        rules:
          - host: legacy.example.test

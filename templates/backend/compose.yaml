services:
  postgres:
    restart: unless-stopped
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_DB: {{ context.app_crate }}
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "{{ context.postgres_host_port }}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d {{ context.app_crate }}"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs only on an empty volume; `docker compose down -v` re-runs it.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro

{% if context.auth_enabled %}  keycloak:
    restart: unless-stopped
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0}
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:{{ context.keycloak_host_port }}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "{{ context.keycloak_host_port }}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/{{ context.app_name }}-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - keycloak-data:/opt/keycloak/data

{% endif %}{% if context.auth_enabled %}  redis:
    restart: unless-stopped
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    ports:
      - "127.0.0.1:{{ context.redis_host_port }}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

{% endif %}

{% if context.mcp %}  backend:
    profiles: [backend]
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
      args:
        CARGO_TARGET_CACHE_PREFIX: ${CARGO_TARGET_CACHE_PREFIX:-{{ context.app_name }}}
        BACKEND_CONTEXT: backend
        LIMITS_FILE: limits.json
    env_file:
      - path: .env
        required: false
    environment:
      {{ context.app_env }}__DATABASE__URL: postgres://app:app@postgres:5432/{{ context.app_crate }}
      {{ context.app_env }}__RATE_LIMIT__REDIS_URL: redis://redis:6379/
      {{ context.app_env }}__HTTP__BIND_ADDRESS: 0.0.0.0
      {{ context.app_env }}__OPS__BIND_ADDRESS: 0.0.0.0
{% if context.auth_enabled %}      {{ context.app_env }}__AUTH__JWKS_URI: ${ {{- context.app_env -}} __AUTH__JWKS_URI:-http://keycloak:8080/realms/{{ context.app_name }}/protocol/openid-connect/certs}
{% if context.auth_oidc %}      {{ context.app_env }}__AUTH__IDENTITY_ADMIN_BASE_URL: ${ {{- context.app_env -}} __AUTH__IDENTITY_ADMIN_BASE_URL:-http://keycloak:8080}
{% endif %}{% if context.web or context.pwa %}      {{ context.app_env }}__AUTH__BROWSER_SESSION__INTERNAL_ISSUER: ${ {{- context.app_env -}} __AUTH__BROWSER_SESSION__INTERNAL_ISSUER:-http://keycloak:8080/realms/{{ context.app_name }}}
{% endif %}      {{ context.app_env }}__MCP__ISSUER: ${ {{- context.app_env -}} __MCP__ISSUER:-http://localhost:{{ context.keycloak_host_port }}/realms/{{ context.app_name }}}
      {{ context.app_env }}__MCP__JWKS_URI: ${ {{- context.app_env -}} __MCP__JWKS_URI:-http://keycloak:8080/realms/{{ context.app_name }}/protocol/openid-connect/certs}
{% endif %}      {{ context.app_env }}__MCP__ENABLED: ${ {{- context.app_env -}} __MCP__ENABLED:-false}
      {{ context.app_env }}__MCP__RESOURCE_URL: ${ {{- context.app_env -}} __MCP__RESOURCE_URL:-http://localhost:{{ context.api_host_port }}/mcp}
      {{ context.app_env }}__MCP__ALLOWED_HOSTS: '["localhost:{{ context.api_host_port }}"]'
    ports:
      - "{{ context.api_host_port }}:8080"
      - "127.0.0.1:{{ context.ops_host_port }}:9090"
    healthcheck:
      # Distroless has no shell or curl; the binary probes its own /readyz.
      test: ["CMD", "/app/api", "--probe-readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
{% if context.auth_enabled %}      keycloak:
        condition: service_healthy
{% endif %}
{% endif %}volumes:
  postgres-data:
{% if context.auth_enabled %}  keycloak-data:
{% endif -%}

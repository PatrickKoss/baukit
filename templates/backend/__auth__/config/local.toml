[auth]
provider = "{{ context.auth_provider }}"
{% if context.auth_oidc %}
# Use a private key URL here when the public issuer is unreachable internally.
# jwks_uri = "https://keys.internal.example/jwks"
{% else %}
# The local Keycloak realm issues {{ context.auth_provider }}-shaped tokens for the production verifier.
issuer = "http://localhost:{{ context.keycloak_host_port }}/realms/{{ context.app_name }}"
jwks_uri = "http://localhost:{{ context.keycloak_host_port }}/realms/{{ context.app_name }}/protocol/openid-connect/certs"
{% if context.auth_clerk %}authorized_parties = [{% if context.web or context.pwa %}"{{ context.app_name }}-web", {% endif %}{% if context.mobile %}"{{ context.app_name }}-mobile", {% endif %}"{{ context.app_name }}-local"]
allow_missing_azp = {{ "true" if context.mobile else "false" }}
{% else %}client_id = "client_{{ context.app_crate }}_local"
{% endif %}{% endif %}{% if context.web or context.pwa %}
# Backend-for-frontend for the web client (ADR 0006). Safari refuses Secure
# cookies over plain http; set insecure_local_cookie = true to test there.
[auth.browser_session]
enabled = true
# Playwright suites sign in hundreds of times from one loopback address. These
# lift the ADR 0006 limits (30/min + 10 per IP, 12/min + 4 per session) for
# the local stack only; staging and production keep the defaults.
ip_rate_per_minute = 6000
ip_rate_burst = 1000
session_rate_per_minute = 1200
session_rate_burst = 200
{% endif %}{% if context.mcp %}
[mcp]
{% if context.auth_oidc %}# Keep issuer public. This override fetches keys without changing token checks.
# jwks_uri = "https://keys.internal.example/mcp-jwks"
{% else %}issuer = "http://localhost:{{ context.keycloak_host_port }}/realms/{{ context.app_name }}"
jwks_uri = "http://localhost:{{ context.keycloak_host_port }}/realms/{{ context.app_name }}/protocol/openid-connect/certs"
{% if context.auth_clerk %}required_scopes = ["items:read"]
{% endif %}{% endif %}{% endif %}{% if context.web or context.pwa %}
[http]
cors_allowed_origins = ["http://localhost:{{ context.web_port }}"]
{% endif %}
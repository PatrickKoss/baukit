name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-scripts:
    name: Generated repository scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/reconcile-env.test.py
      - run: python3 scripts/lockfiles.test.py
{% if context.quality_strict %}      - run: python3 scripts/check-markdown-links.test.py
      - run: python3 scripts/check-markdown-links.py README.md CLAUDE.md AGENTS.md docs
{% else %}      - name: Product steps from scripts/quality-gate.local.sh
        if: {% raw %}${{ hashFiles('scripts/quality-gate.local.sh') != '' }}{% endraw %}
        run: |
          set -eu
          . ./scripts/quality-gate.local.sh
          for step in $(local_steps | cut -d ' ' -f 1); do
            "step_$(printf %s "$step" | tr - _)"
          done
{% endif %}
{% if not context.quality_strict %}  repository-lint:
    name: Supply chain and script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.8.11
          cache: false
          install_args: >-
            aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:gitleaks/gitleaks
            aqua:google/osv-scanner aqua:astral-sh/ruff aqua:koalaman/shellcheck
            aqua:ast-grep/ast-grep{% if context.backend %} aqua:EmbarkStudios/cargo-deny{% endif %}
      - run: sh scripts/repo-lint.sh workflow-lint
      - run: sh scripts/repo-lint.sh secret-scan
      - run: sh scripts/repo-lint.sh osv
{% if context.backend %}      - run: sh scripts/repo-lint.sh deny
{% endif %}      - run: sh scripts/repo-lint.sh python-lint
      - run: sh scripts/repo-lint.sh shell-lint

  baukit-doctor:
    name: Baukit doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.8.11
          cache: false
          install_args: aqua:ast-grep/ast-grep
      - name: Check the product with baukit doctor
        run: |
          git clone --branch v{{ context.template_version }} --depth 1 https://github.com/PatrickKoss/baukit.git "$RUNNER_TEMP/baukit"
          cargo run --quiet --locked --manifest-path "$RUNNER_TEMP/baukit/cli/Cargo.toml" --bin baukit -- doctor
      - name: Check agent docs, file sizes, suppressions, lints, patterns, observability and template files with baukit check
        run: cargo run --quiet --locked --manifest-path "$RUNNER_TEMP/baukit/cli/Cargo.toml" --bin baukit -- check agent-docs file-size suppressions lints patterns observability template-files --root .

{% endif %}{% if context.quality_strict %}  strict-quality:
    name: Strict quality profile
    runs-on: ubuntu-latest
    timeout-minutes: {{ context.ci_timeout_minutes }}
{% if context.ci_env %}    env:
{% for entry in context.ci_env %}      {{ entry.name }}: {{ entry.value }}
{% endfor %}{% endif %}    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.8.11
          cache: false
          install_args: >-
            aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:gitleaks/gitleaks
            aqua:google/osv-scanner aqua:astral-sh/ruff aqua:koalaman/shellcheck
            aqua:ast-grep/ast-grep{% if context.backend %} aqua:EmbarkStudios/cargo-deny{% endif %}
{% if context.backend %}      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend -> target
{% endif %}{% if context.backend or context.web or context.mobile %}      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
{% endif %}{% if context.web %}      - name: Install Playwright browsers
{% if "PLAYWRIGHT_BROWSERS_PATH" not in context.ci_env_names %}        env:
          PLAYWRIGHT_BROWSERS_PATH: web/node_modules/.cache/playwright-browsers
{% endif %}        working-directory: web
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec playwright install --with-deps chromium webkit
{% endif %}{% if context.mobile %}      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
{% endif %}      - name: Select migration comparison base
        if: {% raw %}${{ hashFiles('backend/migrations/*.sql') != '' }}{% endraw %}
        env:
          EVENT_NAME: {% raw %}${{ github.event_name }}{% endraw %}
          PULL_REQUEST_BASE: {% raw %}${{ github.event.pull_request.base.sha }}{% endraw %}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "BAUKIT_BASE_REVISION=$PULL_REQUEST_BASE" >> "$GITHUB_ENV"
          else
            echo "BAUKIT_BASE_REVISION=$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)" >> "$GITHUB_ENV"
          fi
      - run: sh scripts/quality-gate.sh
{% if context.backend %}      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: {% raw %}${{ always() }}{% endraw %}
        with:
          name: backend-coverage
          path: |
            backend/target/llvm-cov/html
            backend/target/llvm-cov/lcov.info
          if-no-files-found: warn
          retention-days: 7
{% endif %}{% if context.web %}      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: {% raw %}${{ failure() }}{% endraw %}
        with:
          name: playwright-failure
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: warn
          retention-days: 7
{% endif -%}
{% else %}{% if context.backend %}  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend -> target
      - run: cargo fmt --manifest-path backend/Cargo.toml --all --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml -- --include-ignored
{% if context.worker %}      # Includes the generated worker's Docker PostgreSQL outbox test.
{% endif %}
      - run: cargo test --manifest-path backend/Cargo.toml -p {{ context.app_name }}-bin --test openapi_drift
{% if context.mcp %}      - run: cargo test --manifest-path backend/Cargo.toml -p {{ context.app_name }}-mcp --test tool_drift
{% endif %}
  backend-msrv:
    name: Backend minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read the floor from the manifest so it is stated once. A literal here
      # would drift silently the first time Cargo.toml is bumped.
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          set -euo pipefail
          version="$(python3 -c '
          import re, sys
          text = open("backend/Cargo.toml").read()
          match = re.search(r"^\s*rust-version\s*=\s*\"([^\"]+)\"", text, re.MULTILINE)
          if match is None:
              sys.exit("backend/Cargo.toml declares no rust-version")
          print(match.group(1))
          ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Minimum supported Rust version: $version"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: {% raw %}${{ steps.msrv.outputs.version }}{% endraw %}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend -> target
          key: {% raw %}msrv-${{ steps.msrv.outputs.version }}{% endraw %}
      - run: cargo check --manifest-path backend/Cargo.toml --workspace --all-targets --locked

  api-drift:
    name: OpenAPI specification and consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend -> target
{% if context.web or context.mobile %}      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
{% endif %}      # Regenerate in place and diff, so a failure prints the specification
      # delta rather than only an exit code.
      - name: Verify the committed specification matches the code
        run: |
          set -euo pipefail
          committed="$(mktemp)"
          trap 'rm -f "$committed"' EXIT
          cp backend/openapi.json "$committed"
          sh scripts/openapi.sh
          diff -u "$committed" backend/openapi.json
{% if context.web or context.mobile %}      # Every consumer that is committed is regenerated and compared. A product
      # that has not generated its client yet has nothing to drift from.
      - name: Regenerate and verify the committed TypeScript consumers
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch generated/openapi.d.ts >/dev/null 2>&1; then
            echo "generated/openapi.d.ts is not committed; run scripts/openapi-client.sh and commit it."
            exit 0
          fi
          sh scripts/openapi-client.sh
          git diff --exit-code -- generated/openapi.d.ts
{% endif %}
  docker-build:
    name: Production backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only. Publishing belongs to the release workflow, not to CI.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          build-args: BACKEND_CONTEXT=backend
          push: false
          cache-from: type=gha,scope=backend-production
          cache-to: type=gha,mode=max,scope=backend-production

{% endif %}{% if context.web %}  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm lint
      - run: corepack pnpm test

  web-coverage:
    name: Web coverage thresholds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile
      # Thresholds live in web/vitest.config.ts, so a local run fails the same way.
      - run: corepack pnpm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: {% raw %}${{ always() }}{% endraw %}
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: warn
          retention-days: 7

  e2e-web:
    name: Browser QA ({% raw %}${{ matrix.browser }}{% endraw %})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=desktop-chromium --project=mobile-chrome
          - browser: webkit
            projects: --project=webkit-desktop --project=mobile-safari
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
      E2E_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile
      - name: Install Playwright browsers and system dependencies
        run: corepack pnpm exec playwright install --with-deps {% raw %}${{ matrix.browser }}{% endraw %}
      - name: Build the app the browser gate serves
        run: corepack pnpm build
      # The specs stub every API path from e2e/qa.config.ts, so this gate needs
      # no backend, database, or identity provider.
      - name: Run the qa specs
        run: corepack pnpm exec playwright test --config e2e/playwright.config.ts {% raw %}${{ matrix.projects }}{% endraw %}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: {% raw %}${{ failure() }}{% endraw %}
        with:
          name: playwright-failure-{% raw %}${{ matrix.browser }}{% endraw %}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: warn
          retention-days: 7

{% endif %}{% if context.mobile %}  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec tsc --noEmit
      - run: corepack pnpm lint
      - run: corepack pnpm test
{% if context.auth_enabled and not context.auth_oidc and not context.quality_strict %}      - name: Check that production bundles carry no local sign-in
        run: corepack pnpm run check:bundle
{% endif %}{% if context.pwa and not context.web %}      - name: Export and verify the mobile PWA
        run: |
          corepack pnpm exec expo install --check
          corepack pnpm exec expo export --platform web --max-workers 4
          corepack pnpm run build:sw
          corepack pnpm run build:sw:check
{% endif %}
  mobile-coverage:
    name: Mobile coverage thresholds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec expo install --check
      # Thresholds live in mobile/jest.config.cjs, so a local run fails the same way.
      - run: corepack pnpm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: {% raw %}${{ always() }}{% endraw %}
        with:
          name: mobile-coverage
          path: mobile/coverage
          if-no-files-found: warn
          retention-days: 7

{% endif %}  observability-lint:
    name: Observability metric names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The linter and the metric vocabulary it enforces live in Baukit. A
      # product lists its own metric names in the allowlist described in
      # docs/observability-lint.md.
      - name: Check for a product metric allowlist
        id: allowlist
        run: |
          set -euo pipefail
          if [ -f deploy/observability/product-metrics.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No deploy/observability/product-metrics.txt; this product declares no dashboards to lint."
            echo "See docs/observability-lint.md to wire one."
          fi
      - name: Fetch the matching Baukit observability contract
        if: {% raw %}${{ steps.allowlist.outputs.present == 'true' }}{% endraw %}
        run: |
          set -euo pipefail
          git clone --branch v{{ context.template_version }} --depth 1 \
            https://github.com/PatrickKoss/baukit.git .baukit
      - name: Lint dashboards against Baukit and product metric names
        if: {% raw %}${{ steps.allowlist.outputs.present == 'true' }}{% endraw %}
        run: |
          python3 .baukit/deploy/observability/lint/check-metric-names.py \
            --observability-root deploy/observability \
            --allowlist deploy/observability/product-metrics.txt
{% endif -%}

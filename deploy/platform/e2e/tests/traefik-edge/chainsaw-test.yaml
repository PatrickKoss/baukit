# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: traefik-edge
spec:
  description: >-
    The Traefik edge refuses TLS 1.1, serves TLS 1.2 and 1.3, redirects plain HTTP to HTTPS, adds the
    security headers on websecure and logs requests without their query string. A route without its
    own secret on a `*.localhost` host gets the TLSStore default certificate, and an SNI no
    certificate covers is refused.
  namespaceTemplate:
    metadata:
      labels:
        baukit.dev/ingress-backend: "true"
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.37
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
  timeouts:
    exec: 3m
  steps:
    - name: deploy-echo-backend
      try:
        - script:
            content: |
              set -eu
              dir=$(mktemp -d)
              trap 'rm -rf "$dir"' EXIT
              openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=edge.baukit.test \
                -addext subjectAltName=DNS:edge.baukit.test -keyout "$dir/tls.key" -out "$dir/tls.crt" 2>/dev/null
              kubectl -n "$NAMESPACE" create secret tls edge-cert --cert "$dir/tls.crt" --key "$dir/tls.key"
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: whoami
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: whoami
                template:
                  metadata:
                    labels:
                      app: whoami
                  spec:
                    automountServiceAccountToken: false
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65534
                      runAsGroup: 65534
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: whoami
                        image: docker.io/traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
                        args: ["--port", "8080"]
                        ports:
                          - containerPort: 8080
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            cpu: 100m
                            memory: 32Mi
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
        - apply:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: whoami
              spec:
                selector:
                  app: whoami
                ports:
                  - port: 80
                    targetPort: 8080
        - apply:
            resource:
              apiVersion: traefik.io/v1alpha1
              kind: IngressRoute
              metadata:
                name: whoami
              spec:
                entryPoints: [websecure]
                routes:
                  - kind: Rule
                    match: Host(`edge.baukit.test`)
                    services:
                      - name: whoami
                        port: 80
                tls:
                  secretName: edge-cert
        - apply:
            resource:
              apiVersion: traefik.io/v1alpha1
              kind: IngressRoute
              metadata:
                name: whoami-default-cert
              spec:
                entryPoints: [websecure]
                routes:
                  - kind: Rule
                    match: Host(`edge.localhost`)
                    services:
                      - name: whoami
                        port: 80
                tls: {}
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: whoami
              status:
                readyReplicas: 1
    - name: edge-behaviour
      try:
        - script:
            timeout: 3m
            content: |
              set -eu
              dir=$(mktemp -d)
              kubectl -n traefik port-forward svc/traefik :80 :443 >"$dir/pf.log" 2>&1 &
              pf=$!
              trap 'kill "$pf" 2>/dev/null; rm -rf "$dir"' EXIT
              # kubectl prints one IPv4 line per port in argument order and names the container port, not 80 or 443.
              forwarded() { sed -n 's/^Forwarding from 127\.0\.0\.1:\([0-9]*\) .*/\1/p' "$dir/pf.log" | sed -n "$1p"; }
              deadline=$(($(date +%s) + 30))
              until http_port=$(forwarded 1) && https_port=$(forwarded 2) && [ -n "$http_port" ] && [ -n "$https_port" ]; do
                [ "$(date +%s)" -lt "$deadline" ] || { echo 'port-forward to traefik never started' >&2; cat "$dir/pf.log" >&2; exit 1; }
                sleep 1
              done
              host=edge.baukit.test
              resolve="--resolve $host:$https_port:127.0.0.1 --resolve $host:$http_port:127.0.0.1"
              deadline=$(($(date +%s) + 120))
              # Both routes must serve whoami before the checks: right after the IngressRoutes appear Traefik answers 404 or 503.
              until curl -ksSf -o /dev/null $resolve "https://$host:$https_port/" &&
                curl -ksSf -o /dev/null --resolve "edge.localhost:$https_port:127.0.0.1" "https://edge.localhost:$https_port/"; do
                [ "$(date +%s)" -lt "$deadline" ] || { echo 'edge never served whoami' >&2; cat "$dir/pf.log" >&2; exit 1; }
                sleep 2
              done

              tls() {
                openssl s_client -connect "127.0.0.1:$https_port" -servername "$host" "$@" </dev/null >"$dir/tls.out" 2>&1
              }
              if tls -tls1_1 -cipher 'DEFAULT:@SECLEVEL=0'; then
                echo 'TLS 1.1 handshake succeeded' >&2; exit 1
              fi
              grep -q 'alert protocol version' "$dir/tls.out" || { echo 'TLS 1.1 was not refused by the server' >&2; cat "$dir/tls.out" >&2; exit 1; }
              tls -tls1_2 || { echo 'TLS 1.2 handshake failed' >&2; cat "$dir/tls.out" >&2; exit 1; }
              tls -tls1_3 || { echo 'TLS 1.3 handshake failed' >&2; cat "$dir/tls.out" >&2; exit 1; }
              echo 'TLS 1.1 refused, TLS 1.2 and 1.3 accepted'

              code=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' $resolve "http://$host:$http_port/x")
              case "$code" in
                "301 https://$host"*|"308 https://$host"*) echo "plain http: $code" ;;
                *) echo "plain http did not redirect to https: $code" >&2; exit 1 ;;
              esac

              curl -ksS -D "$dir/headers" -o /dev/null $resolve "https://$host:$https_port/x?token=secret"
              for header in \
                'strict-transport-security: max-age=31536000; includeSubDomains' \
                'x-content-type-options: nosniff' \
                'x-frame-options: DENY' \
                'referrer-policy: strict-origin-when-cross-origin'; do
                tr -d '\r' <"$dir/headers" | grep -qix "$header" || { echo "missing header: $header" >&2; cat "$dir/headers" >&2; exit 1; }
              done
              echo 'security headers present'

              deadline=$(($(date +%s) + 60))
              while :; do
                kubectl -n traefik logs deploy/traefik --since=5m >"$dir/traefik.log"
                line=$(grep '"RequestHost":"edge.baukit.test"' "$dir/traefik.log" | grep '"RequestPath":"/x' | grep '"RequestMethod":"GET"' | grep -v '"DownstreamStatus":30' | tail -n 1 || true)
                [ -z "$line" ] || break
                [ "$(date +%s)" -lt "$deadline" ] || { echo 'no access log line for GET /x' >&2; exit 1; }
                sleep 2
              done
              case "$line" in
                *token=secret*|*'"RequestPath":"/x?'*) echo "access log keeps the query string: $line" >&2; exit 1 ;;
              esac
              echo "access log: $line"

              local_host=edge.localhost
              code=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --resolve "$local_host:$http_port:127.0.0.1" "http://$local_host:$http_port/")
              case "$code" in
                "301 https://$local_host"*|"308 https://$local_host"*) echo "plain http on $local_host: $code" ;;
                *) echo "plain http on $local_host did not redirect to https: $code" >&2; exit 1 ;;
              esac
              openssl s_client -connect "127.0.0.1:$https_port" -servername "$local_host" -tls1_2 -showcerts </dev/null >"$dir/local.out" 2>&1 ||
                { echo "TLS 1.2 handshake for $local_host failed" >&2; cat "$dir/local.out" >&2; exit 1; }
              san=$(openssl x509 -in "$dir/local.out" -noout -ext subjectAltName)
              printf '%s\n' "$san" | grep -q 'DNS:\*\.localhost' || { echo "default certificate does not cover $local_host: $san" >&2; exit 1; }
              echo "default certificate for $local_host: $(printf '%s' "$san" | tail -n 1 | tr -d ' ')"
              curl -ksSf -o /dev/null --resolve "$local_host:$https_port:127.0.0.1" "https://$local_host:$https_port/" ||
                { echo "https on $local_host failed" >&2; exit 1; }

              if openssl s_client -connect "127.0.0.1:$https_port" -servername other.example -tls1_2 </dev/null >"$dir/strict.out" 2>&1; then
                echo 'handshake for other.example succeeded despite sniStrict' >&2; exit 1
              fi
              grep -q 'alert' "$dir/strict.out" || { echo 'other.example was not refused by the server' >&2; cat "$dir/strict.out" >&2; exit 1; }
              echo 'SNI other.example refused'

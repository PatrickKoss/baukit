apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-restore-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-restore-test
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-restore-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-restore-test
subjects:
  - kind: ServiceAccount
    name: postgres-restore-test
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-restore-test
  labels:
    app.kubernetes.io/name: postgres-restore-test
    app.kubernetes.io/part-of: baukit-platform
spec:
  # The overlay must review the schedule and explicitly set suspend: false.
  schedule: "0 3 1 * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2400
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-restore-test
            app.kubernetes.io/part-of: baukit-platform
        spec:
          serviceAccountName: postgres-restore-test
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restore-test
              image: rancher/k3s:v1.36.3-k3s1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  restore_cluster="postgres-cluster-restore-test"
                  cleanup() {
                    kubectl -n "${POD_NAMESPACE}" delete cluster "${restore_cluster}" \
                      --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT

                  kubectl -n "${POD_NAMESPACE}" delete cluster "${restore_cluster}" \
                    --ignore-not-found=true --wait=true --timeout=5m

                  kubectl apply -f - <<EOF
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: ${restore_cluster}
                    namespace: ${POD_NAMESPACE}
                  spec:
                    instances: 1
                    bootstrap:
                      recovery:
                        source: source
                    externalClusters:
                      - name: source
                        plugin:
                          name: barman-cloud.cloudnative-pg.io
                          parameters:
                            barmanObjectName: postgres-backups
                            serverName: postgres-cluster
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
                    storage:
                      size: 10Gi
                  EOF

                  kubectl -n "${POD_NAMESPACE}" wait cluster/"${restore_cluster}" \
                    --for=condition=Ready --timeout=30m

                  now="$(date +%s)"
                  printf '%s\n' \
                    '# TYPE baukit_restore_test_last_success_timestamp_seconds gauge' \
                    "baukit_restore_test_last_success_timestamp_seconds{cluster=\"postgres-cluster\"} ${now}" | \
                    wget -q -O /dev/null \
                      --header="Content-Type: text/plain; version=0.0.4" \
                      --post-file=- \
                      "http://restore-test-pushgateway:9091/metrics/job/baukit_restore_test"
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true

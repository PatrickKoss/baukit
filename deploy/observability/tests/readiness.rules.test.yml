rule_files:
  - ../alerts/baukit.rules.yml
evaluation_interval: 1m
tests:
  - name: a failing scrape fires BaukitServiceScrapeDown after 2m
    interval: 1m
    input_series:
      - series: 'up{product="fixture",service="fixture-api",environment="test",namespace="fixture",instance="10.0.0.1:9000",job="fixture-api"}'
        values: '0x10'
      - series: 'build_info{product="fixture",service="fixture-api",environment="test",namespace="fixture",instance="10.0.0.1:9000",job="fixture-api",version="1.0.0"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: BaukitServiceScrapeDown
        exp_alerts: []
      - eval_time: 5m
        alertname: BaukitServiceScrapeDown
        exp_alerts:
          - exp_labels:
              product: fixture
              service: fixture-api
              environment: test
              namespace: fixture
              instance: 10.0.0.1:9000
              job: fixture-api
              severity: critical
            exp_annotations:
              summary: Baukit service scrape is failing
              description: 'Prometheus cannot scrape the service target 10.0.0.1:9000 of fixture-api in fixture.'
              runbook_url: RUNBOOK_BASE_URL/service-scrape-down

  - name: a healthy target with build_info keeps every readiness alert quiet
    interval: 1m
    input_series:
      - series: 'up{product="fixture",service="fixture-api",environment="test",namespace="fixture",instance="10.0.0.1:9000",job="fixture-api"}'
        values: '1x20'
      - series: 'build_info{product="fixture",service="fixture-api",environment="test",namespace="fixture",instance="10.0.0.1:9000",job="fixture-api",version="1.0.0"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BaukitServiceScrapeDown
        exp_alerts: []
      - eval_time: 20m
        alertname: BaukitServiceTargetsAbsent
        exp_alerts: []
      - eval_time: 20m
        alertname: BaukitBuildInfoAbsent
        exp_alerts: []

  - name: targets without a service label fire BaukitServiceTargetsAbsent after 5m
    interval: 1m
    input_series:
      - series: 'up{instance="10.0.0.2:9100",job="node-exporter"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: BaukitServiceTargetsAbsent
        exp_alerts: []
      - eval_time: 10m
        alertname: BaukitServiceTargetsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: No Baukit service targets are discoverable
              description: 'Prometheus has no service-labeled targets, so every other Baukit alert has no data.'
              runbook_url: RUNBOOK_BASE_URL/service-targets-absent

  - name: a healthy target without build_info fires BaukitBuildInfoAbsent after 10m
    interval: 1m
    input_series:
      - series: 'up{product="fixture",service="fixture-api",environment="test",namespace="fixture",instance="10.0.0.1:9000",job="fixture-api"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: BaukitBuildInfoAbsent
        exp_alerts: []
      - eval_time: 15m
        alertname: BaukitBuildInfoAbsent
        exp_alerts:
          - exp_labels:
              product: fixture
              service: fixture-api
              environment: test
              namespace: fixture
              instance: 10.0.0.1:9000
              job: fixture-api
              severity: warning
            exp_annotations:
              summary: Build metadata is absent
              description: 'A healthy scrape target is not exposing build_info: 10.0.0.1:9000 of fixture-api in fixture.'
              runbook_url: RUNBOOK_BASE_URL/build-info-absent

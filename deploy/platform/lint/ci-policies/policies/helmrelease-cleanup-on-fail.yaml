apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: helmrelease-cleanup-on-fail
  annotations:
    policies.kyverno.io/title: HelmRelease cleanup on failed upgrade
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: [v2]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  validations:
    - expression: object.spec.?upgrade.?cleanupOnFail.orValue(false) == true
      messageExpression: >-
        "HelmRelease " + object.metadata.name + " must set spec.upgrade.cleanupOnFail: true, so a " +
        "failed upgrade deletes the new resources it created."

[package]
name = "baukit-runtime"
description = "Process lifecycle and service composition primitives for Baukit applications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
axum.workspace = true
baukit-core.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["server-auto", "service", "tokio"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
baukit-telemetry = { path = "../baukit-telemetry" }
tokio = { workspace = true, features = ["test-util"] }

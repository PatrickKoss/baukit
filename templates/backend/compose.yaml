services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: {{ context.app_crate }}
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "{{ context.postgres_host_port }}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d {{ context.app_crate }}"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

{% if context.auth_oidc %}  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.0}
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "{{ context.keycloak_host_port }}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/{{ context.app_name }}-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - keycloak-data:/opt/keycloak/data

{% endif %}{% if context.auth_enabled %}  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:{{ context.redis_host_port }}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

{% endif %}

{% if context.mcp %}  backend:
    profiles: [backend]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
      args:
        BACKEND_CONTEXT: backend
        LIMITS_FILE: limits.json
    env_file:
      - path: .env
        required: false
    environment:
      {{ context.app_env }}__DATABASE__URL: postgres://postgres:postgres@postgres:5432/{{ context.app_crate }}
      {{ context.app_env }}__RATE_LIMIT__REDIS_URL: redis://redis:6379/
      {{ context.app_env }}__HTTP__BIND_ADDRESS: 0.0.0.0
      {{ context.app_env }}__OPS__BIND_ADDRESS: 0.0.0.0
{% if context.auth_oidc %}      {{ context.app_env }}__AUTH__JWKS_URI: ${ {{- context.app_env -}} __AUTH__JWKS_URI:-http://keycloak:8080/realms/{{ context.app_name }}/protocol/openid-connect/certs}
      {{ context.app_env }}__AUTH__IDENTITY_ADMIN_BASE_URL: ${ {{- context.app_env -}} __AUTH__IDENTITY_ADMIN_BASE_URL:-http://keycloak:8080}
      {{ context.app_env }}__MCP__ISSUER: ${ {{- context.app_env -}} __MCP__ISSUER:-http://localhost:{{ context.keycloak_host_port }}/realms/{{ context.app_name }}}
      {{ context.app_env }}__MCP__JWKS_URI: ${ {{- context.app_env -}} __MCP__JWKS_URI:-http://keycloak:8080/realms/{{ context.app_name }}/protocol/openid-connect/certs}
{% endif %}      {{ context.app_env }}__MCP__ENABLED: ${ {{- context.app_env -}} __MCP__ENABLED:-false}
      {{ context.app_env }}__MCP__RESOURCE_URL: ${ {{- context.app_env -}} __MCP__RESOURCE_URL:-http://localhost:{{ context.api_host_port }}/mcp}
      {{ context.app_env }}__MCP__ALLOWED_HOSTS: '["localhost:{{ context.api_host_port }}"]'
    ports:
      - "{{ context.api_host_port }}:8080"
      - "127.0.0.1:{{ context.ops_host_port }}:9090"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
{% if context.auth_oidc %}      keycloak:
        condition: service_healthy
{% endif %}
{% endif %}volumes:
  postgres-data:
{% if context.auth_oidc %}  keycloak-data:
{% endif %}

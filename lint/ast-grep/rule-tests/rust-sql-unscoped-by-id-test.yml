id: rust-sql-unscoped-by-id
valid:
  - |
    const Q: &str = "SELECT * FROM notes WHERE id = $1 AND owner_id = $2";
  - |
    const Q: &str = "SELECT * FROM notes WHERE id = $10";
invalid:
  - |
    const Q: &str = "SELECT * FROM notes WHERE id = $1";
  - |
    const Q: &str = "DELETE FROM notes WHERE id = $1 RETURNING id";
  - |
    const Q: &str = r#"
        UPDATE notes SET body = $2
        WHERE id = $1
    "#;

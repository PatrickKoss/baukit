# Replace the values, then encrypt in place for the tenant's age recipient:
#   sops --config deploy/gitops/.sops.yaml --encrypt --in-place deploy/gitops/production/runtime-secret.enc.yaml
# scripts/gitops-pins.py check refuses to release while a .enc.yaml file is unencrypted.
apiVersion: v1
kind: Secret
metadata:
  name: {{ context.app_name }}-runtime
type: Opaque
stringData:
  {{ context.app_env }}__DATABASE__URL: REPLACE_ME
{% if context.auth_enabled %}  {{ context.app_env }}__AUTH__ERASURE_HASH_KEY: REPLACE_ME
{% endif -%}

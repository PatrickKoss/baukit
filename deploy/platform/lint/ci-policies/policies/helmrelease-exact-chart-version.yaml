apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: helmrelease-exact-chart-version
  annotations:
    policies.kyverno.io/title: HelmRelease exact chart version
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: [v2]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  matchConditions:
    - name: helm-repository-chart
      expression: object.spec.?chart.?spec.?sourceRef.?kind.orValue("") == "HelmRepository"
  validations:
    - expression: >-
        object.spec.chart.spec.?version.orValue("")
        .matches('^v?[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$')
      messageExpression: >-
        "HelmRelease " + object.metadata.name + " must pin spec.chart.spec.version to one exact chart " +
        "version, not '" + object.spec.chart.spec.?version.orValue("") + "'. Ranges, wildcards and an " +
        "empty version let Flux upgrade the chart on its own."

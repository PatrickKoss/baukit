# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/configuration-chainsaw-v1alpha2.json
# require-psa-labels denies a Namespace without Pod Security labels, so chainsaw's own carry them.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: platform-e2e
spec:
  namespace:
    template:
      metadata:
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: v1.37
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
  # Namespace deletion waits for pod termination and finalizers; under gate load that outlasts the 30s default.
  timeouts:
    cleanup: 2m

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: traefik
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    versionOverride: "v3.7.19"
    image:
      digest: "sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf"
      tag: "v3.7.19"
    deployment:
      kind: Deployment
      replicas: 1
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    priorityClassName: platform-critical
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    hostNetwork: false
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    service:
      enabled: true
      spec:
        type: LoadBalancer
    api:
      dashboard: false
      insecure: false
      debug: false
    ingressRoute:
      dashboard:
        enabled: false
      healthcheck:
        enabled: false
    ports:
      traefik:
        expose:
          default: false
      web:
        expose:
          default: true
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
          middlewares:
            - traefik-default-rate-limit@kubernetescrd
            - traefik-default-connection-limit@kubernetescrd
      websecure:
        expose:
          default: true
        http:
          middlewares:
            - traefik-default-rate-limit@kubernetescrd
            - traefik-default-connection-limit@kubernetescrd
            - traefik-default-security-headers@kubernetescrd
      metrics:
        port: 9100
        expose:
          default: false
    metrics:
      prometheus:
        entryPoint: metrics
        service:
          enabled: true
        disableAPICheck: true
        serviceMonitor:
          enabled: true
          interval: 30s
          scrapeTimeout: 10s
    providers:
      kubernetesCRD:
        allowCrossNamespace: false
        allowExternalNameServices: false
      kubernetesIngress:
        allowExternalNameServices: false
    tlsOptions:
      default:
        minVersion: VersionTLS12
        sniStrict: true
        curvePreferences:
          - X25519
          - CurveP256
          - CurveP384
        cipherSuites:
          - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
          - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop
        queryParameters:
          defaultMode: drop
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: default-rate-limit
        spec:
          rateLimit:
            average: 100
            burst: 200
            period: 1s
            sourceCriterion:
              ipStrategy:
                depth: 0
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: default-connection-limit
        spec:
          inFlightReq:
            amount: 100
            sourceCriterion:
              ipStrategy:
                depth: 0
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: default-security-headers
        spec:
          headers:
            stsSeconds: 31536000
            stsIncludeSubdomains: true
            contentTypeNosniff: true
            frameDeny: true
            referrerPolicy: strict-origin-when-cross-origin

[package]
name = "baukit-auth"
description = "OIDC, Clerk, and WorkOS token verification, personal access tokens, and Axum principal extraction for Baukit services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
sqlx-postgres = ["dep:sqlx", "dep:jiff-sqlx"]
# Hidden hooks for the fuzz targets. Not a public API.
fuzzing = []
browser-session = [
  "sqlx-postgres",
  "dep:baukit-credential-vault",
  "dep:psl",
  "dep:url",
]

[dependencies]
axum.workspace = true
base64.workspace = true
baukit-credential-vault = { workspace = true, optional = true }
baukit-egress.workspace = true
baukit-resilience = { workspace = true, features = ["startup"] }
baukit-http.workspace = true
baukit-openapi.workspace = true
jiff.workspace = true
metrics.workspace = true
jiff-sqlx = { workspace = true, optional = true }
psl = { version = "2.1.244", optional = true }
reqwest.workspace = true
aws-lc-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["derive"], optional = true }
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = { workspace = true, optional = true }
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest = "1.12.0"
baukit-auth = { path = ".", features = ["browser-session"] }
baukit-config = { path = "../baukit-config" }
baukit-core = { path = "../baukit-core" }
baukit-resilience = { path = "../baukit-resilience", features = ["test-support", "startup"] }
baukit-ratelimit = { path = "../baukit-ratelimit", features = ["browser-session"] }
baukit-test = { path = "../baukit-test", features = ["sqlx-postgres"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber.workspace = true
metrics-util.workspace = true

[package]
name = "baukit-core"
description = "Dependency-light shared vocabulary for Baukit services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
media-grants = ["dep:base64", "dep:ring", "dep:zeroize"]
pagination = ["dep:base64", "dep:ring", "dep:uuid"]
webhook-signature = ["dep:base64", "dep:ring"]

[dependencies]
base64 = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
baukit-core = { path = ".", features = ["media-grants", "webhook-signature"] }

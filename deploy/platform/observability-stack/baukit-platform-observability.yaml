apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: baukit-platform-observability
  namespace: flux-system
spec:
  releaseName: baukit-platform-observability
  targetNamespace: observability
  storageNamespace: observability
  interval: 30m
  timeout: 5m
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
  chart:
    spec:
      chart: ./deploy/observability-platform
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: baukit
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    runbookBaseUrl: https://github.com/PatrickKoss/baukit/blob/main/docs/runbooks/platform

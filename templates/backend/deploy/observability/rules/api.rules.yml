groups:
  - name: {{ context.app_name }}-api
    rules:
      - alert: ApiHighErrorRatio
        expr: |
          (
            sum by (environment) (rate(http_requests_total{product="{{ context.app_name }}", status=~"5.."}[5m]))
            /
            sum by (environment) (rate(http_requests_total{product="{{ context.app_name }}"}[5m]))
          ) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: More than 5% of {{ context.app_name }} API requests fail with 5xx.

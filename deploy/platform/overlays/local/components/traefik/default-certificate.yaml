apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-default-tls
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: baukit-platform
spec:
  secretName: local-default-tls
  commonName: localhost
  dnsNames:
    - localhost
    - "*.localhost"
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: local-self-signed

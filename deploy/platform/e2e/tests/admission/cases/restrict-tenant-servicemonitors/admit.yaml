apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: admission-own-namespace
  namespace: e2e-tenant
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: echo
  endpoints:
    - port: metrics
      honorLabels: false
      relabelings:
        - action: replace
          targetLabel: product
          replacement: e2e-echo

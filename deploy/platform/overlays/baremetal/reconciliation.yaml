apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: baremetal-postgres
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: baremetal-cnpg
    - name: baremetal-observability
  interval: 10m
  retryInterval: 30s
  timeout: 20m
  path: ./deploy/platform/overlays/baremetal/components/postgres
  prune: true
  wait: true
  # kstatus counts a CNPG Cluster without conditions as current; wait for Ready instead.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  sourceRef:
    kind: GitRepository
    name: baukit
---

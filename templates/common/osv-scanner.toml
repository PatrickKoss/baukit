# Add an [[IgnoredVulns]] entry only for an advisory without a fix, with an ignoreUntil date at most
# 90 days out and a reason that names the dependency path.
{% if context.backend %}
[[IgnoredVulns]]
id = "RUSTSEC-2026-0440"
ignoreUntil = 2027-02-05
reason = "No fix available: astral-tokio-tar is unmaintained with no patched release; reached through testcontainers in baukit-test, a backend dev-dependency. Mirrors baukit's ignore."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-02-15
reason = "No fix available: chrono is unmaintained (RustSec informational, all versions). Baukit uses jiff; chrono stays in backend/Cargo.lock as serde_with's optional dependency through testcontainers, and the MCP flavor compiles it through rmcp (schemars chrono04). Mirrors baukit's ignore."
{% endif %}{% if context.mobile %}
[[IgnoredVulns]]
id = "GHSA-qr28-fpjm-wq7f"
ignoreUntil = 2027-02-05
reason = "No compatible fix: expo-router requires query-string 7.1.3, which calls require('decode-uri-component') as a function; the fixed 0.5.x is ESM-only with a default export, so an override breaks URL parsing."

[[IgnoredVulns]]
id = "GHSA-vcc3-ghjq-m6fr"
ignoreUntil = 2027-02-05
reason = "No compatible fix: expo-router requires query-string 7.1.3, which calls require('decode-uri-component') as a function; the fixed 0.5.x is ESM-only with a default export, so an override breaks URL parsing."
{% endif %}{% if context.mobile or context.web %}
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-02-15
reason = "No fix available: every picomatch release through 4.0.7 (the latest) is affected. Reached only through build and test tooling (vite, vitest, jest, metro, @expo/cli); glob patterns come from repo config, not user input. Mirrors baukit's ignore."
{% endif -%}

apiVersion: v1
kind: Pod
metadata:
  name: admission-unpinned-product-image
  namespace: e2e-tenant
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: ghcr.io/patrickkoss/baukit-unsigned-fixture:0.0.0
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  - source:
      kind: ConfigMap
      name: baukit-cluster-network
      fieldPath: data.nodeCIDR
    targets:
      - select:
          kind: NetworkPolicy
          labelSelector: baukit.dev/node-cidr-peer=egress
        fieldPaths:
          - spec.egress.0.to.0.ipBlock.cidr
      - select:
          kind: NetworkPolicy
          labelSelector: baukit.dev/node-cidr-peer=ingress
        fieldPaths:
          - spec.ingress.0.from.0.ipBlock.cidr

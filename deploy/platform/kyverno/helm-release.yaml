apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "3.10.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: warn
  test:
    enable: true
  values:
    config:
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - flux-system
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
    admissionController:
      replicas: 1
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: 1
      serviceMonitor:
        enabled: true
      initContainer:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
      container:
        extraArgs:
          webhookTimeout: "5"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
    backgroundController:
      replicas: 1
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: 1
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    cleanupController:
      replicas: 1
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: 1
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    reportsController:
      replicas: 1
      podDisruptionBudget:
        enabled: true
        minAvailable: null
        maxUnavailable: 1
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

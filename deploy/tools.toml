# Pinned validator tools for deploy/. scripts/install-deploy-tools.sh installs them into .tools/bin.
#
# Each tool key is the installed binary name. `url` and `member` are templates with {version}, {os}
# and {arch}; `os_names` and `arch_names` map the platform parts to the names upstream uses. `member`
# is the path inside a tar.gz; a tool without `member` downloads a bare binary. Every sha256 comes from
# the upstream checksum file of that release, not from hashing a local download.
#
# yamllint has no standalone release build, so it installs from PyPI wheels with
# `pip --require-hashes --only-binary :all:`. The hashes are the PyPI wheel digests; PyYAML lists one
# wheel per CPython 3.11 to 3.14 on each platform (tomllib already needs 3.11).

schema = 1
platforms = ["linux-amd64", "linux-arm64", "darwin-arm64"]

[tools.kubeconform]
version = "0.8.0"
url = "https://github.com/yannh/kubeconform/releases/download/v{version}/kubeconform-{os}-{arch}.tar.gz"
member = "kubeconform"
version_args = ["-v"]
sha256 = { linux-amd64 = "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883", linux-arm64 = "1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87", darwin-arm64 = "f84f4dfbebf4a6b0b230385fa065a39ea35e02608c2b50d025dcf64775a69d67" }

[tools.kustomize]
version = "5.8.3"
url = "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv{version}/kustomize_v{version}_{os}_{arch}.tar.gz"
member = "kustomize"
version_args = ["version"]
sha256 = { linux-amd64 = "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61", linux-arm64 = "9867b76482cfc6d25b546abc1d2b5a32bd137505aba640649b4b378f64f6d68f", darwin-arm64 = "4cbb08e209d8fff47cd60bfb6407daaf5ee699f9b9295849a1065024fac2d1ef" }

[tools.helm]

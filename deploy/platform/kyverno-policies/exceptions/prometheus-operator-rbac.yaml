apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: prometheus-operator-rbac
  namespace: kyverno
  labels:
    app.kubernetes.io/part-of: baukit-platform
  annotations:
    baukit.dev/reason: >-
      prometheus-operator creates and deletes the StatefulSets, ConfigMaps and Secrets of the Prometheus and Alertmanager it runs and owns every monitoring.coreos.com kind, so the chart grants all verbs on those resources.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: restrict-wildcard-rbac
  matchConditions:
    - name: workload
      expression: >-
        object.kind == "ClusterRole" && object.metadata.name == "kube-prometheus-stack-operator"

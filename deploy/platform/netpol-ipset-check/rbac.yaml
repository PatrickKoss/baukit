apiVersion: v1
kind: ServiceAccount
metadata:
  name: netpol-ipset-check
  namespace: observability-agents
  labels:
    app.kubernetes.io/part-of: baukit-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: baukit-netpol-ipset-check
  labels:
    app.kubernetes.io/part-of: baukit-platform
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: baukit-netpol-ipset-check
  labels:
    app.kubernetes.io/part-of: baukit-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: baukit-netpol-ipset-check
subjects:
  - kind: ServiceAccount
    name: netpol-ipset-check
    namespace: observability-agents

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../traefik
  - ../../cluster-network
components:
  - ../../../../components/network-policy/node-cidr
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: traefik
    patch: |-
      - op: replace
        path: /spec/values/deployment/replicas
        value: 2

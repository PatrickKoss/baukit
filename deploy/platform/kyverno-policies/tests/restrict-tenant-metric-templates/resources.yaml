  query: |
    sum(rate(http_requests_total{product="leitbild"}[{{ interval }}]))
---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: one-unfiltered
  namespace: shop
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  query: |
    sum(rate(errors_total{namespace="{{ namespace }}"}[1m])) / sum(rate(http_requests_total{product="leitbild"}[1m]))
---

id: rust-sql-format
valid:
  - |
    fn f() { let q = format!("SELECT * FROM {TABLE} WHERE id = $1"); }
  - |
    fn f() { let q = format!("SELECT {} FROM {}", COLUMNS, TABLE); }
  - |
    fn f() { let s = format!("selected {count} items"); }
  - |
    fn f() { let s = format!("hello {name}"); }
  - |
    fn f() { let e = format!("create output directory {}", dir.display()); }
  - |
    fn f() { let e = format!("Update failed for {id}"); }
  - |
    fn f() { let s = format!("{TABLE}.id = $1"); }
  - |
    fn f() { let s = format!("a AND b {FIELD}"); }
invalid:
  - |
    fn f() { let p = format!("lower({col}) = $1"); }
  - |
    fn f() { let p = format!("{predicate} AND owner_id = $2"); }
  - |
    fn f() { let p = format!(" ORDER BY {column} DESC LIMIT 10"); }
  - |
    fn f() { let p = format!("COALESCE({}, 0) > 3", field_name); }
  - |
    fn f() { let q = format!("CREATE TABLE IF NOT EXISTS {name} (id int)"); }
  - |
    fn f() { let q = format!("SELECT * FROM users WHERE name = '{name}'"); }
  - |
    fn f() { let q = format!("delete from {} where id = {}", TABLE, id); }
  - |
    fn f() { let q = format!(r#"INSERT INTO t VALUES ({})"#, value.to_string()); }

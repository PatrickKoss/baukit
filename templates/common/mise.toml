# Repository lint tools. CI installs the same versions with jdx/mise-action; run `mise install` locally.
[tools]
rust = { version = "1.99.0", components = "clippy,rustfmt" }
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:google/osv-scanner" = "2.7.0"
"aqua:astral-sh/ruff" = "0.17.4"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:ast-grep/ast-grep" = "0.51.1"
{% if context.backend %}"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
{% endif -%}

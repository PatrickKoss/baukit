target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PL"]

[lint.per-file-ignores]
# unittest suites narrow importlib specs with assert and use fake API keys as inputs.
"**/test_*.py" = ["S101", "S105"]
# urlopen targets are http://localhost endpoints of the smoke stack; the password belongs
# to the generated Keycloak realm's local "test" user.
"scripts/mcp-remote-smoke.py" = ["S106", "S310"]
# urlopen targets are built from the https API_BASE constant.
"scripts/generate-jingle.py" = ["S310"]
# Test helper that drives the Docker Keycloak login form; every URL comes from that
# container's discovery document or its redirect responses.
"rust/crates/baukit-erasure/tests/support/keycloak_login.py" = ["S310"]

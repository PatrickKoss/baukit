[package]
name = "baukit-cli"
version = "0.10.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "baukit"
path = "src/main.rs"

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.18"
include_dir = "0.7.4"
minijinja = "2.24.0"
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[dev-dependencies]
sha2 = "0.11.0"
tempfile = "3.27.0"


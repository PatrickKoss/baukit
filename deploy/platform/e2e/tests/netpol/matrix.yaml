# Expected NetworkPolicy verdicts for the probe runner (N5). Each row starts a short-lived probe pod in
# from.namespace with from.labels and opens a TCP connection to the destination:
#   service: <name>.<namespace>   the Service's cluster DNS name and port
#   pod: {namespace, labels}       the first Ready pod matching the labels, by pod IP
#   host: <ip> | node              a literal address; "node" is the IP of the node the probe runs on
# Namespaces starting with netpol- are created by the runner and carry the tenant component labels, so
# Kyverno generates the tenant defaults (default deny, DNS egress). netpol-tenant keeps only those.
# netpol-tenant-open adds a NetworkPolicy that allows all egress, so its rows test the destination's
# ingress rules. netpol-tenant-pg is netpol-tenant-open plus baukit.dev/postgres-client=true.
# Probe pods in platform namespaces borrow the pod labels of the workload whose policy they exercise.
# Every allow rule in the N3 per-base policies has at least one row here.
- from: {namespace: netpol-tenant-open, labels: {}}
  to: {service: postgres-cluster-rw.postgres, port: 5432}
  expect: deny
- from: {namespace: netpol-tenant-open, labels: {baukit.dev/postgres-client: "true"}}
  to: {service: postgres-cluster-rw.postgres, port: 5432}
  expect: deny
- from: {namespace: netpol-tenant-pg, labels: {}}
  to: {service: postgres-cluster-rw.postgres, port: 5432}
  expect: deny
- from: {namespace: netpol-tenant-pg, labels: {baukit.dev/postgres-client: "true"}}
  to: {service: postgres-cluster-rw.postgres, port: 5432}
  expect: allow
- from: {namespace: netpol-tenant-open, labels: {}}
  to: {service: loki-gateway.observability, port: 80}
  expect: deny
- from: {namespace: netpol-tenant-open, labels: {}}
  to: {service: restore-test-pushgateway.postgres, port: 9091}
  expect: deny
- from: {namespace: netpol-tenant, labels: {}}
  to: {host: 10.43.0.1, port: 443}
  expect: deny
- from: {namespace: netpol-tenant, labels: {}}
  to: {host: node, port: 6443}
  expect: deny
- from: {namespace: netpol-tenant, labels: {}}
  to: {host: 169.254.169.254, port: 80}
  expect: deny
- from: {namespace: netpol-tenant-open, labels: {}}
  to: {service: kube-prometheus-stack-prometheus.observability, port: 9090}
  expect: deny
- from: {namespace: netpol-tenant-open, labels: {}}
  to: {service: kube-prometheus-stack-alertmanager.observability, port: 9093}
  expect: deny
- from: {namespace: netpol-tenant-open, labels: {}}
  to: {service: tempo.observability, port: 3200}
  expect: deny
- from: {namespace: netpol-tenant-open, labels: {}}
  to: {service: rustfs.postgres, port: 9000}
  expect: deny
- from: {namespace: netpol-tenant-open, labels: {}}
  to: {service: tempo.observability, port: 4317}
  expect: allow
- from: {namespace: netpol-tenant-open, labels: {}}
  to: {service: tempo.observability, port: 4318}
  expect: allow


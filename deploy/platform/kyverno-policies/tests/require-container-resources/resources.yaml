apiVersion: v1
kind: Pod
metadata:
  name: bounded
  namespace: apps
spec:
  initContainers:
    - name: init
      image: ghcr.io/example/init:1.0.0
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
  containers:
    - name: app
      image: ghcr.io/example/app:1.0.0
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: unbounded-init
  namespace: apps
spec:
  initContainers:
    - name: init
      image: ghcr.io/example/init:1.0.0
      resources:
        requests: {cpu: 10m, memory: 16Mi}
  containers:
    - name: app
      image: ghcr.io/example/app:1.0.0
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: no-resources
  namespace: apps
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.0.0

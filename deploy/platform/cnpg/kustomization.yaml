apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - plugin-barman-cloud-v0.16.0.yaml
  - network-policy.yaml
namespace: cnpg-system
components:
  - ../components/network-policy/default-deny
  - ../components/network-policy/dns-egress
  - ../components/network-policy/apiserver-egress
  - ../components/network-policy/prometheus-scrape
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: barman-cloud
      namespace: cnpg-system
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
  - target:
      kind: NetworkPolicy
      name: allow-prometheus-scrape
    patch: |-
      - op: replace
        path: /spec/podSelector
        value:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      - op: replace
        path: /spec/ingress/0/ports
        value:
          - protocol: TCP
            port: 8080

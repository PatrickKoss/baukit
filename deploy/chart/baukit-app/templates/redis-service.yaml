{{- if .Values.redis.enabled }}
{{- $replicas := int .Values.redis.replicas }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "baukit-app.redisName" . }}
  labels:
    {{- include "baukit-app.processLabels" (dict "root" . "process" "redis") | nindent 4 }}
    baukit.dev/endpoint: redis
spec:
  type: ClusterIP
  selector:
    {{- include "baukit-app.processSelectorLabels" (dict "root" . "process" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- if gt $replicas 1 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "baukit-app.redisName" . }}-headless
  labels:
    {{- include "baukit-app.processLabels" (dict "root" . "process" "redis") | nindent 4 }}
    baukit.dev/endpoint: redis-peer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "baukit-app.processSelectorLabels" (dict "root" . "process" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
    - name: sentinel
      port: 26379
      targetPort: sentinel
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "baukit-app.redisName" . }}-sentinel
  labels:
    {{- include "baukit-app.processLabels" (dict "root" . "process" "redis") | nindent 4 }}
    baukit.dev/endpoint: redis-sentinel
spec:
  type: ClusterIP
  selector:
    {{- include "baukit-app.processSelectorLabels" (dict "root" . "process" "redis") | nindent 4 }}
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
      protocol: TCP
{{- end }}
{{- end }}

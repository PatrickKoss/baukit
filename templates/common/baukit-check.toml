# Settings for `baukit check`. Limits may only go down.

[file_size]
rust-max-lines = 1000
ts-max-lines = 500

# Files over the limit. Entries only shrink: split a file and drop its entry.
[file_size.allowlist]

# Suppression budget. Counts may only go down; `baukit check suppressions --update` lowers them.
[suppressions.max]
rust-allow = 0
rust-expect = 0
eslint-disable = 0
ast-grep-ignore = 0
ts-expect-error = 0
ts-ignore = 0
prettier-ignore = 0
noqa = 0
type-ignore = 0
nosec = 0
shellcheck-disable = 0
nolint = 0
{% if context.backend %}
# Dashboards and rules may only reference metrics the backend emits or the baukit catalog defines.
[observability]
dashboards = ["deploy/observability/dashboards"]
rules = ["deploy/observability/rules"]
sources = ["backend/crates"]
metric-prefix = "{{ context.app_crate }}_"
{% endif -%}

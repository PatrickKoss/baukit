id: rust-secret-debug
valid:
  - |
    #[derive(Debug)]
    struct User { name: String, token_count: u32 }
  - |
    #[derive(Clone)]
    struct Creds { password: String }
  - |
    #[derive(Debug)]
    struct Creds { api_key: SecretString }
  - |
    #[derive(Debug)]
    struct Oauth { token_url: String, api_key_env: String, refresh_token_nonce: Vec<u8> }
  - |
    #[derive(Debug)]
    struct Cache { cache_key: String, credentials_path: String, code: String }
invalid:
  - |
    #[derive(Debug, Clone)]
    struct Creds { password: String }
  - |
    #[derive(Clone, Debug)]
    #[serde(rename_all = "camelCase")]
    pub struct Session { pub refresh_token: Option<String> }
  - |
    #[derive(Debug)]
    enum Auth { Bearer { access_token: String } }
  - |
    #[derive(Debug)]
    struct Key<'a> { private_key: &'a str }
  - |
    #[derive(Debug)]
    struct Signer<'a> { hmac_key: &'a [u8] }
  - |
    #[derive(Debug)]
    struct Pkce { code_verifier: String }
  - |
    #[derive(Debug)]
    struct Tokens { refresh_token: Option<Zeroizing<String>> }
  - |
    #[derive(Debug)]
    struct Vault { encryption_key: [u8; 32] }

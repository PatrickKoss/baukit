[package]
name = "baukit-erasure"
description = "Transactional profile erasure with durable identity account deletion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["keycloak", "api-providers"]
api-providers = ["dep:reqwest", "dep:url"]
keycloak = ["dep:reqwest", "dep:url"]

[dependencies]
axum.workspace = true
baukit-config.workspace = true
baukit-http.workspace = true
baukit-jobs.workspace = true
chrono.workspace = true
reqwest = { workspace = true, optional = true, features = ["form"] }
aws-lc-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
baukit-runtime = { path = "../baukit-runtime" }
baukit-test = { path = "../baukit-test" }
testcontainers.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
wiremock = "0.6.5"

apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-image-registries-tenants
policies:
  - ../../policies/restrict-image-registries-tenants.yaml
resources:
  - resources.yaml
clusterResources:
  - cluster-resources.yaml
results:
  - isValidatingPolicy: true
    policy: restrict-image-registries-tenants
    kind: Pod
    resources: [tenant-allowed]
    result: pass
  - isValidatingPolicy: true
    policy: restrict-image-registries-tenants
    kind: Pod
    resources: [tenant-foreign]
    result: fail
  - isValidatingPolicy: true
    policy: restrict-image-registries-tenants
    kind: Pod
    resources: [foreign]
    result: skip

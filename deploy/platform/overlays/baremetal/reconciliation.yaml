# kured is absent on purpose: the host playbook drains, reboots and uncordons one node at a time.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: baremetal-baseline
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  retryInterval: 30s
  timeout: 5m
  path: ./deploy/platform/cluster-baseline
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: baukit
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: baremetal-kyverno
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: baremetal-baseline
  interval: 10m
  retryInterval: 30s
  timeout: 15m
  path: ./deploy/platform/overlays/baremetal/components/kyverno
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: baukit
---

[package]
name = "baukit-verus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Verus twins of the HLC, token-bucket and pull-cursor kernels with unbounded proofs."

[workspace]

[dependencies]
vstd = "=0.0.0-2026-11-22-0344"

[package.metadata.verus]
verify = true

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
too_many_lines = "warn"
allow_attributes_without_reason = "warn"
missing_panics_doc = "warn"
return_self_not_must_use = "warn"
unused_async = "warn"
needless_pass_by_value = "warn"
manual_let_else = "warn"
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"
print_stdout = "warn"
print_stderr = "warn"

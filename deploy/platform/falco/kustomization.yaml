apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: falco
resources:
  - namespace.yaml
  - oci-repository.yaml
  - helm-release.yaml
  - network-policy.yaml
components:
  - ../components/network-policy/default-deny
  - ../components/network-policy/dns-egress
  - ../components/network-policy/prometheus-scrape
patches:
  - target:
      kind: NetworkPolicy
      name: allow-prometheus-scrape
    patch: |-
      - op: replace
        path: /spec/ingress/0/ports
        value:
          - protocol: TCP
            port: 8765
          - protocol: TCP
            port: 2801
configMapGenerator:
  - name: falco-baukit-rules
    files:
      - rules/baukit.rules.yaml
generatorOptions:
  # Falco watches rules.d and reloads in place, so the ConfigMap keeps a stable name.
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: baukit-platform

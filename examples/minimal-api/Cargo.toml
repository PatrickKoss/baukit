[package]
name = "minimal-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
too_many_lines = "warn"
allow_attributes_without_reason = "warn"
missing_panics_doc = "warn"
return_self_not_must_use = "warn"
unused_async = "warn"
needless_pass_by_value = "warn"
manual_let_else = "warn"
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"
print_stdout = "warn"
print_stderr = "warn"

[dependencies]
axum = "0.8.9"
baukit-config = { path = "../../rust/crates/baukit-config" }
baukit-http = { path = "../../rust/crates/baukit-http" }
baukit-openapi = { path = "../../rust/crates/baukit-openapi" }
baukit-ops = { path = "../../rust/crates/baukit-ops" }
baukit-runtime = { path = "../../rust/crates/baukit-runtime" }
baukit-telemetry = { path = "../../rust/crates/baukit-telemetry" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
utoipa = "6.0.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

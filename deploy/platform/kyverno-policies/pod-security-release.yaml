apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m
  dependsOn:
    - name: kyverno
  chart:
    spec:
      chart: kyverno-policies
      version: "3.10.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno-policies
        namespace: kyverno
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: warn
  values:
    podSecurityStandard: restricted
    podSecurityVersion: v1.34
    validationFailureAction: Audit
    failurePolicy: Ignore
    kyvernoVersion: "1.20.0"

[quality]
# Emulator block 5780 to 5787 for native-android, outside every product block.
android_emulator_port = 5780
android_emulators = 2
# native-android compiles Gradle and boots both emulators: on 2 or 3 cores it took
# 1477 to 2029 s and hit a SystemUI ANR, on 10 cores 947 s.
emulator_steps = ["native-android", "expo-sqlite", "expo-notifications"]
emulator_cores = 8
shared = ["deploy/**", "fixtures/**", "rust/deny.toml", "rust/Cargo.toml", "renovate*.json"]

[quality.gate_budget_minutes]
full = 30
affected = 15

# gate.py refuses to start below the highest floor of the planned steps. The 0.26.2 gate
# failed at 91% disk: a full gate grows a worktree by about 19 GB, and platform-e2e's k3d
# kubelet evicts pods below about 50 GiB free, so it needs that plus the build, cluster and
# images. The fixture and Testcontainers steps build products and pull images. `--step` runs
# skip the check because hosted CI runners have less space and run one step each.
[quality.disk]
floor_gb = 30

[quality.disk.step_floor_gb]
platform-e2e = 120
rust-tests = 60
fixture-1 = 60
fixture-2 = 60
affected-fixture = 60
mcp-fixture = 60

[quality.affected]
"README.md" = []
"CLAUDE.md" = []
"AGENTS.md" = []
"docs/**" = []
".gitleaks.toml" = []
"osv-scanner.toml" = []
"ruff.toml" = []
"zizmor.yml" = []
"rust/crates/**" = ["rust", "fixtures", "mcp-fixture", "fuzz"]
"rust/fuzz/**" = ["fuzz"]
"scripts/fuzz.sh" = ["fuzz"]
"cli/**" = ["cli", "fixtures", "mcp-fixture", "native-android"]
"templates/**" = ["cli", "fixtures", "mcp-fixture", "native-android"]
"agent-skills/**" = ["cli", "fixtures"]
"lint/**" = ["cli"]
"baukit-check.toml" = ["cli"]
"typescript/**" = ["ts", "fixtures", "mcp-fixture", "android"]
"examples/minimal-api/**" = ["examples-test"]
"examples/expo-sqlite-conformance/**" = ["expo-sqlite"]
"examples/expo-notifications-conformance/**" = ["expo-notifications"]
"templates/**/Dockerfile*" = ["platform-images"]
"examples/**/Dockerfile*" = ["platform-images"]
"scripts/platform-images.sh" = ["platform-images"]

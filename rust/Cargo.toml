[workspace]
resolver = "2"
members = [
  "crates/baukit-auth",
  "crates/baukit-core",
  "crates/baukit-credential-vault",
  "crates/baukit-egress",
  "crates/baukit-events",
  "crates/baukit-erasure",
  "crates/baukit-runtime",
  "crates/baukit-config",
  "crates/baukit-http",
  "crates/baukit-integrations",
  "crates/baukit-jobs",
  "crates/baukit-mcp",
  "crates/baukit-ops",
  "crates/baukit-telemetry",
  "crates/baukit-openapi",
  "crates/baukit-push",
  "crates/baukit-ratelimit",
  "crates/baukit-sync",
  "crates/baukit-suite",
  "crates/baukit-test",
]

[workspace.package]
version = "0.10.1"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/PatrickKoss/baukit"
homepage = "https://github.com/PatrickKoss/baukit"
license = "MIT"
authors = ["Patrick Koss"]
keywords = ["baukit", "foundation", "axum", "telemetry"]
categories = ["web-programming", "development-tools"]

[workspace.dependencies]
aws-lc-rs = "1.18.1"
axum = "0.8.9"
base64 = "0.23.1"
baukit-auth = { version = "=0.10.1", path = "crates/baukit-auth" }
baukit-config = { version = "=0.10.1", path = "crates/baukit-config" }
baukit-core = { version = "=0.10.1", path = "crates/baukit-core" }
baukit-credential-vault = { version = "=0.10.1", path = "crates/baukit-credential-vault" }
baukit-egress = { version = "=0.10.1", path = "crates/baukit-egress" }
baukit-erasure = { version = "=0.10.1", path = "crates/baukit-erasure" }
baukit-events = { version = "=0.10.1", path = "crates/baukit-events" }
baukit-http = { version = "=0.10.1", path = "crates/baukit-http" }
baukit-integrations = { version = "=0.10.1", path = "crates/baukit-integrations" }
baukit-mcp = { version = "=0.10.1", path = "crates/baukit-mcp" }
baukit-jobs = { version = "=0.10.1", path = "crates/baukit-jobs" }
baukit-openapi = { version = "=0.10.1", path = "crates/baukit-openapi" }
baukit-push = { version = "=0.10.1", path = "crates/baukit-push" }
baukit-ratelimit = { version = "=0.10.1", path = "crates/baukit-ratelimit" }
baukit-ops = { version = "=0.10.1", path = "crates/baukit-ops" }
baukit-runtime = { version = "=0.10.1", path = "crates/baukit-runtime" }
baukit-suite = { version = "=0.10.1", path = "crates/baukit-suite" }
baukit-sync = { version = "=0.10.1", path = "crates/baukit-sync" }
baukit-telemetry = { version = "=0.10.1", path = "crates/baukit-telemetry" }
baukit-test = { version = "=0.10.1", path = "crates/baukit-test" }
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.27"
dotenvy = "0.15.7"
http = "1.5.0"
jsonschema = { version = "0.58.5", default-features = false }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
metrics-util = "0.20.4"
opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = "0.33.0"
pem = "4.0.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
redis = { version = "1.7.1", default-features = false, features = ["connection-manager", "sentinel", "tokio-comp"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_html_form = "0.4.1"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "json", "uuid"] }
subtle = "2.6.1"
tempfile = "3.27.0"
testcontainers = { version = "0.28.0", default-features = false, features = ["aws-lc-rs"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "time"] }
uuid = { version = "1.27.0", features = ["v4", "v7", "serde"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

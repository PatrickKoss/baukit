apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../cnpg
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: cloudnative-pg
    patch: |-
      - op: replace
        path: /spec/values/config/maxConcurrentReconciles
        value: 2
      - op: replace
        path: /spec/values/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/values/resources/requests/memory
        value: 64Mi
      - op: replace
        path: /spec/values/resources/limits/cpu
        value: 150m
      - op: replace
        path: /spec/values/resources/limits/memory
        value: 192Mi


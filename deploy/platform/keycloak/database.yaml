apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: keycloak-owner
  namespace: postgres
  labels:
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: identity
spec:
  cluster:
    name: postgres-cluster
  name: keycloak_owner
  login: true
  superuser: false
  createdb: false
  createrole: false
  # KC_DB_POOL_MAX_SIZE 10 plus 2 for an operator session.
  connectionLimit: 12
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: keycloak-db-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  namespace: postgres
  labels:
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: identity
spec:
  cluster:
    name: postgres-cluster
  name: keycloak
  owner: keycloak_owner
  databaseReclaimPolicy: retain

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tests-enabled
  namespace: demo
spec:
  interval: "30m"
  timeout: "5m"
  chart:
    spec:
      chart: kyverno
      version: "41.6.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
  driftDetection:
    mode: warn
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  test:
    enable: true
---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 30m
  timeout: 5m
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
  chartRef:
    kind: OCIRepository
    name: tempo
    namespace: observability
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: warn
  values:
    priorityClassName: platform-standard
    replicas: 1
    tempo:
      tag: "2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38"
      reportingEnabled: false
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      memBallastSizeMbs: 128
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 750m
          memory: 1Gi
      # Traces retention budget (§8.5): the single source of truth.
      retention: 168h
      # Sized to the 10Gi PVC; see the README storage section.
      ingester:
        max_block_bytes: 268435456
      extraArgs:
        compactor.compaction.compaction.max-block-bytes: "1073741824"
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 10Gi
    serviceMonitor:
      enabled: true

# Routes every alert to the e2e webhook sink so tests can assert delivery.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  values:
    alertmanager:
      config:
        route:
          group_by:
            - alertname
          group_wait: 5s
          group_interval: 10s
          repeat_interval: 1m
          receiver: e2e-sink
          routes: []
        receivers:
          - name: e2e-sink
            webhook_configs:
              - url: http://alert-sink.e2e-receiver.svc.cluster.local:8080/alerts
                send_resolved: false

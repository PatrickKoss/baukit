services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: {{ context.app_crate }}
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d {{ context.app_crate }}"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

{% if context.auth_oidc %}  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm --hostname=http://localhost:8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/{{ context.app_name }}-realm.json:ro

{% endif %}

volumes:
  postgres-data:

# Lists in ../../kustomization.yaml `components` to move this environment to its own CNPG Cluster.
# Create backup-credentials.enc.yaml first, see deploy/gitops/README.md.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - postgres.yaml
  - backup-credentials.enc.yaml
patches:
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: {{ context.app_name }}
      spec:
        values:
          backing:
            postgres:
              mode: dedicated

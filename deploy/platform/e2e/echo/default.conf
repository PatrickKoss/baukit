server {
    listen 8080;
    location / {
        default_type text/plain;
        return 200 "baukit e2e echo\n";
    }
}

server {
    listen 9090;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /readyz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /metrics {
        default_type text/plain;
        return 200 "baukit_e2e_echo_up{namespace=\"spoofed\"} 1\n";
    }
}

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ context.app_name }}
spec:
  values:
    deploymentEnvironment: testing
    podLabels:
      baukit.dev/environment: testing
{% if context.auth_enabled %}    api:
      env:
        - name: {{ context.app_env }}__AUTH__ISSUER
          value: {{ context.gitops.identity_url }}/realms/{{ context.gitops.realm }}
{% if context.auth_oidc %}        - name: {{ context.app_env }}__AUTH__AUDIENCE
          value: {{ context.app_name }}-testing
{% endif %}{% endif %}{% if context.mcp %}    mcp:
      resourceUrl: https://{{ context.app_name }}-testing.{{ context.gitops.domain }}/mcp
      issuer: {{ context.gitops.identity_url }}/realms/{{ context.gitops.realm }}
      allowedHosts: [{{ context.app_name }}-testing.{{ context.gitops.domain }}]
{% endif -%}

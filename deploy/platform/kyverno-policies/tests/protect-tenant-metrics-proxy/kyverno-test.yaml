apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-tenant-metrics-proxy
policies:
  - ../../policies/protect-tenant-metrics-proxy.yaml
resources:
  - resources.yaml
clusterResources:
  - cluster-resources.yaml
userinfo: user-info.yaml
results:
  - isValidatingPolicy: true
    policy: protect-tenant-metrics-proxy
    kind: Deployment
    resources: [tenant-metrics-proxy, impostor]
    result: fail
  - isValidatingPolicy: true
    policy: protect-tenant-metrics-proxy
    kind: CronJob
    resources: [impostor-cron]
    result: fail
  - isValidatingPolicy: true
    policy: protect-tenant-metrics-proxy
    kind: Pod
    resources: [impostor-pod]
    result: fail
  - isValidatingPolicy: true
    policy: protect-tenant-metrics-proxy
    kind: NetworkPolicy
    resources: [tenant-metrics-proxy]
    result: fail
  - isValidatingPolicy: true
    policy: protect-tenant-metrics-proxy
    kind: Deployment
    resources: [api]
    result: pass
  - isValidatingPolicy: true
    policy: protect-tenant-metrics-proxy
    kind: NetworkPolicy
    resources: [allow-flagger-to-proxy]
    result: pass
  - isValidatingPolicy: true
    policy: protect-tenant-metrics-proxy
    kind: Deployment
    resources: [tenant-metrics-proxy-platform]
    result: skip

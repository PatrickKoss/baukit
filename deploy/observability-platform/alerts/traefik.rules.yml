groups:
  # Edge availability SLI per Traefik service. It counts the 502 and 503 answers Traefik sends when no
  # app pod answers, which the app's own http_requests_total cannot see.
  - name: baukit-traefik-edge-recording
    interval: 30s
    rules:
      - record: baukit:traefik_service_requests_5xx:ratio5m
        expr: |
          sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
          / sum by (service) (rate(traefik_service_requests_total[5m]))
      - record: baukit:traefik_service_requests_5xx:ratio1h
        expr: |
          sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[1h]))
          / sum by (service) (rate(traefik_service_requests_total[1h]))
      - record: baukit:traefik_service_requests:increase1h
        expr: |
          sum by (service) (increase(traefik_service_requests_total[1h]))
  - name: baukit-traefik
    rules:
      - alert: BaukitTraefikServiceHighErrorRatio
        expr: |
          (
            sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
            / sum by (service) (rate(traefik_service_requests_total[5m]))
          ) > 0.05
          and sum by (service) (rate(traefik_service_requests_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: traefik
        annotations:
          summary: Traefik service {{ $labels.service }} answers over 5% of requests with 5xx
          description: >-
            {{ $value | humanizePercentage }} of the requests Traefik routed to {{ $labels.service }}
            returned 5xx for 10 minutes.
          runbook_url: RUNBOOK_BASE_URL/traefik-service-high-error-ratio
      # 99.9% edge availability, the same budget as the app pack's fast burn pair.
      - alert: BaukitTraefikServiceErrorBudgetBurnFast
        expr: |
          baukit:traefik_service_requests_5xx:ratio5m / 0.001 > 14.4
          and on (service)
          baukit:traefik_service_requests_5xx:ratio1h / 0.001 > 14.4
          and on (service)
          baukit:traefik_service_requests:increase1h >= 100
        for: 2m
        labels:
          severity: critical
          component: traefik
        annotations:
          summary: Traefik service {{ $labels.service }} burns its edge error budget fast
          description: >-
            More than 1.44% of the requests Traefik routed to {{ $labels.service }} returned 5xx
            in both the 5m and the 1h window. This includes the 502 and 503 answers Traefik sends
            when no pod behind the service answers.
          runbook_url: RUNBOOK_BASE_URL/traefik-service-error-budget-burn-fast
      - alert: BaukitTraefikTlsCertExpiring
        expr: |
          (max by (cn) (traefik_tls_certs_not_after) - time()) < 7 * 86400
        for: 10m
        labels:
          severity: critical
          component: traefik
        annotations:
          summary: The TLS certificate Traefik serves for {{ $labels.cn }} expires in under 7 days
          description: >-
            Traefik serves a certificate for {{ $labels.cn }} that expires in
            {{ $value | humanizeDuration }}. The renewed Secret has not reached Traefik.
          runbook_url: RUNBOOK_BASE_URL/traefik-tls-cert-expiring

services:
  postgres:
    ports: !override
      - "127.0.0.1:${BAUKIT_QA_POSTGRES_PORT:-15432}:5432"
  redis:
    image: redis:8.10.0-alpine
    ports:
      - "127.0.0.1:${BAUKIT_QA_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
{% if context.auth_oidc %}  keycloak:
    ports: !override
      - "127.0.0.1:${BAUKIT_QA_KEYCLOAK_PORT:-18081}:8080"
{% endif %}

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: posthog
  namespace: posthog
spec:
  interval: 30m
  timeout: 20m
  chart:
    spec:
      chart: posthog
      version: "30.46.0"
      sourceRef:
        kind: HelmRepository
        name: posthog
        namespace: posthog
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    cloud: local
    env:
      - name: AWS_REGION
        value: us-east-1
      - name: AWS_DEFAULT_REGION
        value: us-east-1
    siteUrl: http://posthog.invalid
    image:
      repository: posthog/posthog
      tag: release-1.43.0
      sha: sha256:74441a9fa04a5af78bf76a5af909f88592033c03ce6f1e14f343cd53d0266827
      pullPolicy: IfNotPresent
    posthogSecretKey:
      existingSecret: posthog-secrets
      existingSecretKey: posthog-secret
    ingress:
      enabled: false
      nginx:
        enabled: false
    cert-manager:
      enabled: false
    web:
      replicacount: 1
      secureCookies: false
      internalMetrics:
        capture: false
      resources:
        requests: {cpu: 10m, memory: 448Mi}
        limits: {cpu: 500m, memory: 768Mi}
    events:
      replicacount: 1
      resources:
        requests: {cpu: 10m, memory: 448Mi}
        limits: {cpu: 400m, memory: 640Mi}
    worker:
      enabled: false
    plugins:
      enabled: true
      replicacount: 1
      env:
        - name: WORKER_CONCURRENCY
          value: "1"
        - name: TASKS_PER_WORKER
          value: "2"
        - name: DISABLE_MMDB
          value: "true"
      resources:
        requests: {cpu: 20m, memory: 288Mi}
        limits: {cpu: 500m, memory: 640Mi}
    recordings:
      enabled: false
    decide:
      enabled: false
    toolbox:
      enabled: false
    temporalPyWorker:
      enabled: false
    pgbouncer:
      enabled: false
    pgbouncerRead:
      enabled: false
    postgresql:
      enabled: false
    externalPostgresql:
      postgresqlHost: posthog-postgresql
      postgresqlPort: 5432
      postgresqlDatabase: posthog
      postgresqlUsername: posthog
      existingSecret: posthog-secrets
      existingSecretPasswordKey: postgresql-password
    redis:
      enabled: false
    externalRedis:
      host: posthog-redis
      port: 6379
    kafka:
      enabled: false
    externalKafka:
      brokers: [posthog-kafka:9092]
      tls: false
    zookeeper:
      enabled: false
    clickhouse:
      enabled: false
    externalClickhouse:
      host: posthog-clickhouse-0.posthog-clickhouse
      cluster: posthog
      database: posthog
      user: posthog
      existingSecret: posthog-secrets
      existingSecretPasswordKey: clickhouse-password
      secure: false
      verify: false
    externalObjectStorage:
      endpoint: http://rustfs.postgres.svc.cluster.local:9000
      bucket: posthog
      region: us-east-1
      existingSecret: posthog-object-storage
    grafana:
      enabled: false
    loki:
      enabled: false
    promtail:
      enabled: false
    prometheus:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    prometheus-kafka-exporter:
      enabled: false
    prometheus-postgres-exporter:
      enabled: false
    prometheus-redis-exporter:
      enabled: false
    prometheus-statsd-exporter:
      enabled: false
    busybox:
      image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      pullPolicy: IfNotPresent
    hooks:
      migrate:
        resources:
          requests: {cpu: 25m, memory: 192Mi}
          limits: {cpu: 750m, memory: 1Gi}
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: batch
              version: v1
              kind: Job
            patch: |-
              - op: add
                path: /spec/ttlSecondsAfterFinished
                value: 300
              - op: replace
                path: /spec/template/spec/initContainers/0/command/2
                value: |-
                  until nc -vz -w 2 posthog-pgbouncer 6543; do
                    echo "waiting for PostgreSQL compatibility service"
                    sleep 1
                  done

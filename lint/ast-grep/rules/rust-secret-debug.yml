id: rust-secret-debug
language: rust
severity: error
message: Secret-named field in a type that derives Debug. Write a redacting Debug impl or store the value as secrecy::SecretString.
note: A derived Debug prints the raw secret into logs, panics and error chains the moment anyone formats the value with {:?}.
rule:
  any:
    - kind: struct_item
    - kind: enum_item
  follows:
    kind: attribute_item
    regex: 'derive\s*\([^)]*\bDebug\b'
    stopBy:
      not:
        any:
          - kind: attribute_item
          - kind: line_comment
          - kind: block_comment
  has:
    kind: field_declaration
    stopBy: end
    all:
      - has:
          field: name
          regex: '(?i)(secret|token|password|api_?key|private_?key|client_?secret)'
      - not:
          has:
            field: name
            regex: '(?i)(^encrypted_|page_token|_(url|uri|endpoint|env|var|nonce|ids?|type|kind|count|path|file|name|header|hash|prefix|len|at|ttl|expiry|expires_in|secs|seconds|ms|version|field|param|hint|digest|fingerprint)$)'
      - has:
          field: type
          regex: '^(String|std::string::String|Vec<u8>|&(''[a-z_]+\s+)?str|Option<(String|Vec<u8>|&(''[a-z_]+\s+)?str)>)$'

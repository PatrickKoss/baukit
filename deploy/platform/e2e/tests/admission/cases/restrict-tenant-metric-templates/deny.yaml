apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: admission-unfiltered-query
  namespace: e2e-tenant
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  query: sum(rate(http_requests_total{product="e2e-echo"}[{{ interval }}]))

# Two instances on different nodes, so a drain or a node failure promotes the replica. The
# consumer replaces the ObjectStore destinationPath and adds its endpoint, as overlays/local does.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../postgres-cluster
  - ../../cluster-network
components:
  - ../../../../components/network-policy/node-cidr
patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: postgres-cluster
    patch: |-
      - op: replace
        path: /spec/instances
        value: 2
      - op: replace
        path: /spec/enablePDB
        value: true
      - op: add
        path: /spec/affinity
        value:
          enablePodAntiAffinity: true
          podAntiAffinityType: required
          topologyKey: kubernetes.io/hostname

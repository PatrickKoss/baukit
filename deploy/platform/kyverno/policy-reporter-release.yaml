apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: kyverno
spec:
  interval: 30m
  dependsOn:
    - name: kyverno
  chart:
    spec:
      chart: policy-reporter
      version: "3.11.2"
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: kyverno
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    metrics:
      enabled: true
    monitoring:
      enabled: true
      grafana:
        dashboards:
          enabled: false
    ui:
      enabled: false
    plugin:
      kyverno:
        enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

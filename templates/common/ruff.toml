target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PL"]

[lint.per-file-ignores]
# unittest suites narrow importlib specs with assert, use fake credentials as inputs, run the
# scripts under test as subprocesses, assert literal exit codes and statuses, and embed shell
# fixtures and expected command lines that ruff format cannot wrap.
"**/test_*.py" = ["E501", "S101", "S105", "S603", "S607", "PLR2004"]
"**/*.test.py" = ["E501", "S101", "S105", "S603", "S607", "PLR2004"]
# The Keycloak helpers open the local development issuer, its discovery document and the
# redirects Keycloak returns; every URL comes from the developer's command line or that server.
"**/scripts/pkce-login.py" = ["S310"]
"**/scripts/reconcile_keycloak.py" = ["S310"]

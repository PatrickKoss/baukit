{{- if and .Values.seed.enabled (eq .Values.deploymentEnvironment "production") (not .Values.seed.allowProduction) }}
{{- fail "seed.enabled in production requires the explicit seed.allowProduction=true override" }}
{{- end }}
{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "baukit-app.fullname" . }}-seed
  labels:
    {{- include "baukit-app.processLabels" (dict "root" . "process" "seed") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.seed.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.seed.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "baukit-app.processLabels" (dict "root" . "process" "seed") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seed
          image: {{ include "baukit-app.image" .Values.seed.image | quote }}
          imagePullPolicy: {{ .Values.seed.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.seed.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.seed.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "baukit-app.env" (dict "root" . "process" "seed") | nindent 12 }}
            {{- with .Values.seed.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.config.existingSecretRefs }}
          envFrom:
            {{- include "baukit-app.envFrom" $ | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.seed.resources | nindent 12 }}
          {{- with .Values.seed.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.seed.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

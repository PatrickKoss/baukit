{{- end }}
{{- end }}
{{- if .Values.seed.enabled }}
{{- with .Values.seed.networkPolicy.additionalEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "baukit-app.fullname" $ }}-seed-egress
  labels:
    {{- include "baukit-app.processLabels" (dict "root" $ "process" "seed") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "baukit-app.processSelectorLabels" (dict "root" $ "process" "seed") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}

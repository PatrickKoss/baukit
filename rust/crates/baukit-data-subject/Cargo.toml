[package]
name = "baukit-data-subject"
description = "Data subject contract, identifier normalization, and signed DSSE receipts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["server"]
server = ["dep:axum", "dep:baukit-auth", "dep:baukit-config", "dep:baukit-erasure", "dep:baukit-http", "dep:baukit-jobs", "dep:sqlx"]

[dependencies]
aws-lc-rs.workspace = true
axum = { workspace = true, optional = true }
baukit-auth = { workspace = true, optional = true }
baukit-config = { workspace = true, optional = true }
baukit-erasure = { workspace = true, optional = true }
baukit-http = { workspace = true, optional = true }
baukit-jobs = { workspace = true, optional = true }
base64.workspace = true
chrono.workspace = true
pem.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
baukit-runtime = { path = "../baukit-runtime" }
baukit-test = { path = "../baukit-test", features = ["data-subject"] }
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

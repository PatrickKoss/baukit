apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: "1.39.3"
      sourceRef:
        kind: HelmRepository
        name: hetzner
        namespace: kube-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    image:
      tag: "v1.39.3@sha256:9d739ba54a13f1de79d6dbb93cbda5a2ed4a5bdb9bf2936e2687e24fa9ccfaf7"
    kind: Deployment
    replicaCount: 1
    networking:
      enabled: false
    env:
      HCLOUD_LOAD_BALANCERS_ENABLED:
        value: "false"
    monitoring:
      enabled: true
      podMonitor:
        enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 128Mi

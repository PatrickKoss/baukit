# The echo app with the chart's default networkPolicy.ingressController. Keep that key out of this file.
fullnameOverride: echo
product: e2e-ingress
deploymentEnvironment: local
api:
  image:
    repository: localhost/baukit-e2e/echo
    tag: local
    pullPolicy: Never
  command:
    - nginx
    - -g
    - daemon off;
migration:
  enabled: false
networkPolicy:
  dns:
    k3sCompatible: true
ingress:
  enabled: true
  hosts:
    - host: echo-ingress.localhost
      paths:
        - path: /
          pathType: Prefix

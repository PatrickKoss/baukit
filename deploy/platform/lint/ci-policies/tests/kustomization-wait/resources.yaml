apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: waits
  namespace: flux-system
spec:
  interval: "10m"
  path: "./deploy"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: demo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: no-wait
  namespace: flux-system
spec:
  interval: "10m"
  path: "./deploy"
  prune: true
  sourceRef:
    kind: GitRepository
    name: demo

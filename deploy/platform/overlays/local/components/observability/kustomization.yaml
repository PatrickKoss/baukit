apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../observability-stack
  - ../../cluster-network
  - network-policy.yaml
  - alert-sink
components:
  - ../../../../components/network-policy/node-cidr
patches:
  - path: resources.yaml
  - path: wsl-clock.yaml

  - path: loki-storage.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: alertmanager-routing
    namespace: observability
    files:
      - alertmanager.yaml

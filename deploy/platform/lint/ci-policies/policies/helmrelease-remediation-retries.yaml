apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: helmrelease-remediation-retries
  annotations:
    policies.kyverno.io/title: HelmRelease remediation retries
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: [v2]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  validations:
    - expression: object.spec.?install.?remediation.?retries.orValue(0) > 0
      messageExpression: >-
        "HelmRelease " + object.metadata.name + " must set spec.install.remediation.retries, so a " +
        "failed install is retried instead of left failed."
    - expression: object.spec.?upgrade.?remediation.?retries.orValue(0) > 0
      messageExpression: >-
        "HelmRelease " + object.metadata.name + " must set spec.upgrade.remediation.retries, so a " +
        "failed upgrade is rolled back and retried."

# Generators for the cross-language vectors in fixtures/**/generated-v1.json, run by
# scripts/regenerate-vectors.py. Each entry names its output and the command (run from the repo
# root) that rewrites it. Every generated-v1.json must have exactly one entry.
#
# [[generator]]
# output = "fixtures/hlc/generated-v1.json"
# command = ["cargo", "run", "--manifest-path", "rust/Cargo.toml", "-p", "baukit-sync", "--example", "hlc_vectors"]
schema = 1

[[generator]]
output = "fixtures/events/generated-v1.json"
command = ["env", "BAUKIT_UPDATE_FIXTURES=1", "cargo", "test", "--locked", "--manifest-path", "rust/Cargo.toml", "-p", "baukit-events", "--test", "generated"]

[[generator]]
output = "fixtures/export-csv/generated-v1.json"
command = ["cargo", "run", "--locked", "--manifest-path", "rust/Cargo.toml", "-p", "baukit-core", "--example", "differential_vectors"]

# differential_vectors writes both files; the registry wants one entry per output.
[[generator]]
output = "fixtures/limits/generated-v1.json"
command = ["cargo", "run", "--locked", "--manifest-path", "rust/Cargo.toml", "-p", "baukit-core", "--example", "differential_vectors"]

[[generator]]
output = "fixtures/suite/generated-v1.json"
command = ["cargo", "run", "--locked", "--manifest-path", "rust/Cargo.toml", "-p", "baukit-suite", "--features", "platform", "--example", "gen_suite_vectors"]

[[generator]]
output = "fixtures/sync/hlc-generated-v1.json"
command = ["cargo", "run", "--locked", "--manifest-path", "rust/Cargo.toml", "-p", "baukit-sync", "--example", "gen_vectors"]

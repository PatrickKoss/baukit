# Replace the value with a registry pull credential, then encrypt in place:
#   sops --config deploy/gitops/.sops.yaml --encrypt --in-place deploy/gitops/testing/ghcr-pull-secret.enc.yaml
apiVersion: v1
kind: Secret
metadata:
  name: {{ context.app_name }}-ghcr
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"REPLACE_ME"}}}'

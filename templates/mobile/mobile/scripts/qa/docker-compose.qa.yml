services:
  postgres:
    ports: !override
      - "127.0.0.1:${BAUKIT_QA_POSTGRES_PORT:-15432}:5432"
  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    ports: !override
      - "127.0.0.1:${BAUKIT_QA_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
{% if context.auth_enabled %}  keycloak:
    environment:
      KC_HOSTNAME: http://localhost:${BAUKIT_QA_KEYCLOAK_PORT:-18081}
    ports: !override
      - "127.0.0.1:${BAUKIT_QA_KEYCLOAK_PORT:-18081}:8080"
{% endif -%}

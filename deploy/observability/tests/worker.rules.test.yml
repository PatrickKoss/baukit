rule_files:
  - ../recording-rules/baukit-red.rules.yml
  - ../alerts/baukit.rules.yml
evaluation_interval: 1m
group_eval_order:
  - baukit-worker
  - baukit-worker-alerts
tests:
  - interval: 1m
    input_series:
      - series: 'worker_job_runs_total{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job="scrape-worker",job_kind="healthy",outcome="success"}'
        values: '0+12000x20'
      - series: 'worker_job_runs_total{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job="scrape-worker",job_kind="failing",outcome="failure"}'
        values: '0+120x20'
      - series: 'worker_job_runs_total{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job="scrape-worker",job_kind="failing",outcome="retry"}'
        values: '0+120x20'
    promql_expr_test:
      - expr: baukit:worker_job_runs:rate5m
        eval_time: 20m
        exp_samples:
          - labels: 'baukit:worker_job_runs:rate5m{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job_kind="healthy",outcome="success"}'
            value: 200
          - labels: 'baukit:worker_job_runs:rate5m{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job_kind="failing",outcome="failure"}'
            value: 2
          - labels: 'baukit:worker_job_runs:rate5m{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job_kind="failing",outcome="retry"}'
            value: 2
    alert_rule_test:
      - eval_time: 5m
        alertname: BaukitWorkerFailureRateHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: BaukitWorkerFailureRateHigh
        exp_alerts:
          - exp_labels:
              product: fixture
              service: fixture-worker
              environment: test
              namespace: fixture
              job_kind: failing
              severity: warning
            exp_annotations:
              summary: Worker failure rate is high
              description: More than 10% of worker runs are failing for job kind failing in fixture-worker, at more than 3 runs per 5 minutes.
              runbook_url: RUNBOOK_BASE_URL/worker-failure-rate-high
      - eval_time: 5m
        alertname: BaukitWorkerRetryStorm
        exp_alerts: []
      - eval_time: 20m
        alertname: BaukitWorkerRetryStorm
        exp_alerts:
          - exp_labels:
              product: fixture
              service: fixture-worker
              environment: test
              namespace: fixture
              job_kind: failing
              severity: warning
            exp_annotations:
              summary: Worker retries are elevated
              description: Worker retry throughput exceeds one retry per second for job kind failing in fixture-worker.
              runbook_url: RUNBOOK_BASE_URL/worker-retry-storm
  - interval: 1m
    input_series:
      - series: 'worker_job_runs_total{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job="scrape-worker",job_kind="data-subject.export",outcome="failure"}'
        values: '0x5 1x20'
      - series: 'worker_job_runs_total{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job="scrape-worker",job_kind="identity.account.delete",outcome="success"}'
        values: '0+5x25'
      - series: 'worker_job_runs_total{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job="scrape-worker",job_kind="email.send",outcome="failure"}'
        values: '0+5x25'
    alert_rule_test:
      - eval_time: 4m
        alertname: BaukitPrivacyOperationFailed
        exp_alerts: []
      - eval_time: 8m
        alertname: BaukitPrivacyOperationFailed
        exp_alerts:
          - exp_labels:
              product: fixture
              service: fixture-worker
              environment: test
              namespace: fixture
              job_kind: data-subject.export
              severity: warning
            exp_annotations:
              summary: A privacy operation failed
              description: A data-subject.export job in fixture-worker failed for good. The erasure or export it belongs to is now failed and needs a person.
              runbook_url: RUNBOOK_BASE_URL/privacy-operation-failed
      - eval_time: 24m
        alertname: BaukitPrivacyOperationFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      # One failed run every 10 minutes: 100% failures, but below the 0.01 runs/s floor.
      - series: 'worker_job_runs_total{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job="scrape-worker",job_kind="rare",outcome="failure"}'
        values: '0+0.1x40'
      - series: 'worker_queue_depth{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job="scrape-worker",queue="default",status="failed"}'
        values: '2x20 3x20'
      - series: 'worker_queue_depth{product="fixture",service="fixture-worker",environment="test",namespace="fixture",job="scrape-worker",queue="steady",status="failed"}'
        values: '5x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BaukitWorkerFailureRateHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: BaukitWorkerJobsFailed
        exp_alerts: []
      - eval_time: 25m
        alertname: BaukitWorkerJobsFailed
        exp_alerts:
          - exp_labels:
              product: fixture
              service: fixture-worker
              environment: test
              namespace: fixture
              queue: default
              severity: warning
            exp_annotations:
              summary: Worker jobs ended as failed
              description: Queue default of fixture-worker gained failed jobs in the last 15 minutes. Their outbox rows, such as suite peer deliveries, are not retried.
              runbook_url: RUNBOOK_BASE_URL/worker-jobs-failed
      - eval_time: 40m
        alertname: BaukitWorkerJobsFailed
        exp_alerts: []

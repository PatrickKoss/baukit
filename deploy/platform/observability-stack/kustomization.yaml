apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepositories.yaml
  - kube-prometheus-stack.yaml
  - loki.yaml
  - tempo.yaml
  - alloy.yaml
  - baukit-content.yaml
  - network-policy.yaml
components:
  - ../components/network-policy/default-deny
  - ../components/network-policy/dns-egress
  - ../components/network-policy/apiserver-egress
patches:
  - target:
      kind: NetworkPolicy
      name: default-deny|allow-dns-egress|allow-apiserver-egress
    patch: |-
      - op: add
        path: /metadata/namespace
        value: observability

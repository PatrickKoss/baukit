apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-metrics-proxy
  namespace: shop
  labels:
    app.kubernetes.io/name: tenant-metrics-proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-metrics-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-metrics-proxy
    spec:
      containers:
        - name: prom-label-proxy
          image: quay.io/prometheuscommunity/prom-label-proxy:v0.16.2

# $msec grows by one per second, so each counter below has a rate of 1/s for the
# Flagger canary gates without any traffic. This copy answers 500 and counts only 500s.
server {
    listen 8080;
    location / {
        default_type text/plain;
        return 500 "baukit e2e echo fails\n";
    }
}

server {
    listen 9090;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /readyz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /metrics {
        default_type text/plain;
        return 200 "baukit_e2e_echo_up{namespace=\"spoofed\"} 1\nhttp_requests_total{status=\"200\"} 0\nhttp_requests_total{status=\"500\"} $msec\nhttp_request_duration_seconds_bucket{le=\"0.05\"} $msec\nhttp_request_duration_seconds_bucket{le=\"+Inf\"} $msec\n";
    }
}

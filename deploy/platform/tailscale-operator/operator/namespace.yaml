# Privileged because LoadBalancer proxies run tailscaled in kernel mode. containerboot refuses
# TS_DEST_IP under TS_USERSPACE, the operator adds a privileged sysctler init container that writes
# /proc/sys/net/ipv4/ip_forward, and the proxy needs /dev/net/tun and NET_ADMIN.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: tailnet
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tailscale
  labels:
    app.kubernetes.io/part-of: baukit-platform
automountServiceAccountToken: false

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: "1.34.0"
      sourceRef:
        kind: HelmRepository
        name: hetzner
        namespace: kube-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    kind: Deployment
    replicaCount: 1
    networking:
      enabled: false
    monitoring:
      enabled: true
      podMonitor:
        enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 128Mi

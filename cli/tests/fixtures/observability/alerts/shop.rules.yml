groups:
  - name: shop-alerts
    rules:
      - alert: ShopErrors
        expr: "sum(rate(http_requests_total{status='5xx'}[5m])) > 0"
        for: 5m
      - alert: ShopWorkerFailures
        expr: >-
          sum without (exported_job) (rate(worker_job_runs_total{outcome="failed"}[5m])) > 0
      - alert: ShopLatency
        expr: histogram_quantile(0.99, sum by (le) (rate(http_requests_duration_seconds_bucket[5m]))) > 1

apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-restore-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-restore-test
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    resourceNames:
      - postgres-cluster-restore-test
    verbs:
      - delete
      - patch
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - backups
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - pods/exec
    resourceNames:
      - postgres-cluster-restore-test-1
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-restore-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-restore-test
subjects:
  - kind: ServiceAccount
    name: postgres-restore-test
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-restore-test
  labels:
    app.kubernetes.io/name: postgres-restore-test
    app.kubernetes.io/part-of: baukit-platform
spec:
  # The overlay must review the schedule and explicitly set suspend: false.
  schedule: "0 3 1 * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2400
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-restore-test
            app.kubernetes.io/part-of: baukit-platform
        spec:
          serviceAccountName: postgres-restore-test
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: write-sentinel
              image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  token="$(date -u +%Y%m%dT%H%M%SZ)-${POD_NAME}"
                  psql -v ON_ERROR_STOP=1 -v token="${token}" <<'SQL'
                  CREATE TABLE IF NOT EXISTS baukit_restore_sentinel (
                    id integer PRIMARY KEY CHECK (id = 1),
                    token text NOT NULL,
                    written_at timestamptz NOT NULL DEFAULT now()
                  );
                  INSERT INTO baukit_restore_sentinel (id, token) VALUES (1, :'token')
                    ON CONFLICT (id) DO UPDATE SET token = EXCLUDED.token, written_at = now();
                  SQL
                  printf '%s\n' "${token}" > "${SENTINEL_FILE}"
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: SENTINEL_FILE
                  value: /work/sentinel
                - name: PGHOST
                  value: postgres-cluster-rw
                - name: PGDATABASE
                  value: product
                - name: PGSSLMODE
                  value: require
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: product-db-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: product-db-credentials
                      key: password
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: restore-test
              image: rancher/k3s:v1.37.1-k3s1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  restore_cluster="postgres-cluster-restore-test"
                  cleanup() {
                    kubectl -n "${POD_NAMESPACE}" delete cluster "${restore_cluster}" \
                      --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT
                  storage_class=""
                  if [ -n "${RESTORE_STORAGE_CLASS}" ]; then
                    storage_class="storageClass: ${RESTORE_STORAGE_CLASS}"
                  fi
                  sentinel="$(cat "${SENTINEL_FILE}")"
                  if [ -z "${sentinel}" ]; then
                    printf 'no sentinel was written\n' >&2
                    exit 1
                  fi

                  backup="postgres-restore-test-$(date -u +%Y%m%d%H%M%S)"
                  kubectl apply -f - <<EOF
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Backup
                  metadata:
                    name: ${backup}
                    namespace: ${POD_NAMESPACE}
                  spec:
                    method: plugin
                    cluster:
                      name: postgres-cluster
                    pluginConfiguration:
                      name: barman-cloud.cloudnative-pg.io
                  EOF
                  deadline=$(($(date +%s) + BACKUP_TIMEOUT_SECONDS))
                  while :; do
                    phase="$(kubectl -n "${POD_NAMESPACE}" get backup "${backup}" -o jsonpath='{.status.phase}')"
                    case "${phase}" in
                      completed) break ;;
                      failed)
                        printf 'backup %s failed\n' "${backup}" >&2
                        exit 1
                        ;;
                    esac
                    if [ "$(date +%s)" -ge "${deadline}" ]; then
                      printf 'backup %s did not complete, phase %s\n' "${backup}" "${phase:-none}" >&2
                      exit 1
                    fi
                    sleep "${POLL_SECONDS}"
                  done

                  kubectl -n "${POD_NAMESPACE}" delete cluster "${restore_cluster}" \
                    --ignore-not-found=true --wait=true --timeout=5m

                  kubectl apply -f - <<EOF
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: ${restore_cluster}
                    namespace: ${POD_NAMESPACE}
                  spec:
                    instances: 1
                    enablePDB: false
                    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
                    bootstrap:
                      recovery:
                        source: source
                    externalClusters:
                      - name: source
                        plugin:
                          name: barman-cloud.cloudnative-pg.io
                          parameters:
                            barmanObjectName: postgres-backups
                            serverName: postgres-cluster
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
                    storage:
                      size: 10Gi
                      ${storage_class}
                  EOF

                  kubectl -n "${POD_NAMESPACE}" wait cluster/"${restore_cluster}" \
                    --for=condition=Ready --timeout=30m

                  primary="$(kubectl -n "${POD_NAMESPACE}" get cluster "${restore_cluster}" \
                    -o jsonpath='{.status.currentPrimary}')"
                  restored="$(printf '%s\n' "${PGPASSWORD}" |
                    kubectl -n "${POD_NAMESPACE}" exec -i "${primary}" -c postgres -- \
                      sh -ec 'IFS= read -r PGPASSWORD; export PGPASSWORD; exec psql -h 127.0.0.1 -U "$1" -d "$2" -tAX -c "SELECT token FROM baukit_restore_sentinel WHERE id = 1"' \
                      sentinel "${PGUSER}" "${PGDATABASE}")"
                  if [ -z "${restored}" ]; then
                    printf 'sentinel missing in the restored cluster, expected %s\n' "${sentinel}" >&2
                    exit 1
                  fi
                  if [ "${restored}" != "${sentinel}" ]; then
                    printf 'restored sentinel %s does not match %s\n' "${restored}" "${sentinel}" >&2
                    exit 1
                  fi
                  printf 'restored sentinel %s matches\n' "${restored}"

                  now="$(date +%s)"
                  printf '%s\n' \
                    '# TYPE baukit_restore_test_last_success_timestamp_seconds gauge' \
                    "baukit_restore_test_last_success_timestamp_seconds{cluster=\"postgres-cluster\"} ${now}" | \
                    wget -q -O /dev/null \
                      --header="Content-Type: text/plain; version=0.0.4" \
                      --post-file=- \
                      "http://restore-test-pushgateway:9091/metrics/job/baukit_restore_test"
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                # Empty uses the default StorageClass. Set a Delete-policy class
                # so a restore test does not leave a retained volume behind.
                - name: RESTORE_STORAGE_CLASS
                  value: ""
                - name: SENTINEL_FILE
                  value: /work/sentinel
                - name: BACKUP_TIMEOUT_SECONDS
                  value: "1200"
                - name: POLL_SECONDS
                  value: "10"
                - name: PGDATABASE
                  value: product
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: product-db-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: product-db-credentials
                      key: password
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Mi

[package]
name = "baukit-auth"
description = "OIDC, Clerk, and WorkOS token verification, personal access tokens, and Axum principal extraction for Baukit services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
sqlx-postgres = ["dep:sqlx"]
browser-session = [
  "sqlx-postgres",
  "dep:baukit-credential-vault",
  "dep:baukit-egress",
  "dep:psl",
  "dep:url",
]

[dependencies]
axum.workspace = true
base64.workspace = true
baukit-credential-vault = { workspace = true, optional = true }
baukit-egress = { workspace = true, optional = true }
baukit-http.workspace = true
baukit-openapi.workspace = true
chrono.workspace = true
psl = { version = "2.1.244", optional = true }
reqwest.workspace = true
aws-lc-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = { workspace = true, optional = true }
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
baukit-auth = { path = ".", features = ["browser-session"] }
baukit-ratelimit = { path = "../baukit-ratelimit", features = ["browser-session"] }
baukit-test = { path = "../baukit-test", features = ["sqlx-postgres"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber.workspace = true

product: {{ context.app_name }}
deploymentEnvironment: staging

config:
  existingSecretRefs:
    - name: {{ context.app_name }}-runtime
{% if context.worker %}  overrides:
    WORKER__CONCURRENCY: 5
    WORKER__LEASE_DURATION_SECONDS: 900
    WORKER__JOB_TIMEOUT_SECONDS: 600
    WORKER__POLL_INTERVAL_MILLISECONDS: 250
{% endif %}

api:
  image:
    repository: ghcr.io/patrickkoss/{{ context.app_name }}
    tag: latest{% if context.port_offset > 0 or context.service_ports_declared %}
  ports:
    http: {{ context.api_container_port }}
    ops: {{ context.ops_container_port }}
{% endif %}

migration:
  enabled: true
  image:
    repository: ghcr.io/patrickkoss/{{ context.app_name }}-migrate
    tag: latest
  command:
    - /app/migrate

worker:
  enabled: {{ "true" if context.worker else "false" }}
{% if context.worker %}  image:
    repository: ghcr.io/patrickkoss/{{ context.app_name }}-worker
    tag: latest
  command:
    - /app/worker{% if context.port_offset > 0 or context.service_ports_declared %}
  ops:
    port: {{ context.ops_container_port }}
{% endif %}
{% endif %}

{% if context.mcp %}mcp:
  enabled: true
  resourceUrl: https://mcp.example.com/mcp
  issuer: {% if context.auth_oidc %}https://identity.example.com/realms/{{ context.app_name }}{% elif context.auth_clerk %}https://clerk.example.com{% else %}https://example.authkit.app{% endif %}
  allowedHosts: [mcp.example.com]
  allowedOrigins: []

{% endif %}{% if context.auth_oidc and (context.web or context.pwa) %}# The web client signs in through /auth/session (ADR 0006). The runtime Secret
# above may not set CORS origins; browserSession.allowedOrigins owns them.
browserSession:
  enabled: true
  allowedOrigins: [https://app.example.com]
  redirectUris: [https://app.example.com/]
  postLogoutRedirectUri: https://app.example.com/
  publicApiOrigin: https://api.example.com
  credentialKeysSecretRef:
    name: {{ context.app_name }}-browser-session
    key: keys

{% endif %}{% if context.platform %}platform:
  receiverSecretRef:
    name: ""
    key: current
    previousKey: ""

# Hub mode: merge these keys into config.overrides above and enable the Secret.
# config:
#   overrides:
#     PLATFORM__HUB_ISSUER: https://hub.example
#     PLATFORM__JWKS_URL: https://hub.example/keys.json
#     PLATFORM__PRODUCT_ID: {{ context.app_crate }}
#     PLATFORM__SOURCE_APP: identity_hub
#     PLATFORM_HUB__TICKET_URL: https://hub.example/platform/v1/entitlements/tickets
# platform:
#   receiverSecretRef:
#     name: {{ context.app_name }}-platform-receiver
#     key: current
#     previousKey: "" # Set to previous only while rotating.
# migration:
#   env:
#     - name: {{ context.app_env }}__PLATFORM__RECEIVER_SECRET
#       valueFrom:
#         secretKeyRef:
#           name: {{ context.app_name }}-platform-receiver
#           key: current
{% if context.worker %}# worker:
#   env:
#     - name: {{ context.app_env }}__PLATFORM__RECEIVER_SECRET
#       valueFrom:
#         secretKeyRef:
#           name: {{ context.app_name }}-platform-receiver
#           key: current
{% endif %}# Worker and migration commands validate the same hub configuration as the API.
# Put PLATFORM_HUB__SERVICE_TOKEN in the runtime Secret with the product prefix.
# A backend that embeds HubClientConfig as platform_client sets
# PLATFORM_CLIENT__API_URL in config.overrides and reads the hub service token
# from a Secret reference, never a value:
# api:
#   env:
#     - name: {{ context.app_env }}__PLATFORM_CLIENT__TOKEN
#       valueFrom:
#         secretKeyRef:
#           name: {{ context.app_name }}-platform-client
#           key: token

{% endif %}ingress:
  enabled: false{% if context.mcp %}
  hosts:
    - host: mcp.example.com
      paths:
        - path: /v1
          pathType: Prefix{% endif %}

serviceMonitor:
  enabled: false

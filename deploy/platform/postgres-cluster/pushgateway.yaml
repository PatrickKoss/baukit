apiVersion: apps/v1
kind: Deployment
metadata:
  name: restore-test-pushgateway
  labels:
    app.kubernetes.io/name: restore-test-pushgateway
    app.kubernetes.io/part-of: baukit-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: restore-test-pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restore-test-pushgateway
        app.kubernetes.io/part-of: baukit-platform
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.3
          imagePullPolicy: IfNotPresent
          args:
            - --persistence.file=/data/metrics.db
            - --persistence.interval=5m
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: restore-test-pushgateway
  labels:
    app.kubernetes.io/name: restore-test-pushgateway
    app.kubernetes.io/part-of: baukit-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9091"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: restore-test-pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: restore-test-pushgateway
  labels:
    app.kubernetes.io/part-of: baukit-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: restore-test-pushgateway
  endpoints:
    - port: http
      interval: 60s
      scrapeTimeout: 10s
      honorLabels: true


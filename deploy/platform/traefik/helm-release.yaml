apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.2.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deployment:
      kind: DaemonSet
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    hostNetwork: false
    service:
      enabled: true
      spec:
        type: ClusterIP
    api:
      dashboard: false
      insecure: false
      debug: false
    ingressRoute:
      dashboard:
        enabled: false
      healthcheck:
        enabled: false
    ports:
      traefik:
        expose:
          default: false
      web:
        hostPort: 80
        expose:
          default: true
        http:
          middlewares:
            - traefik-default-rate-limit@kubernetescrd
            - traefik-default-connection-limit@kubernetescrd
      websecure:
        hostPort: 443
        expose:
          default: true
        http:
          middlewares:
            - traefik-default-rate-limit@kubernetescrd
            - traefik-default-connection-limit@kubernetescrd
      metrics:
        port: 9100
        expose:
          default: false
    metrics:
      prometheus:
        entryPoint: metrics
        service:
          enabled: true
        disableAPICheck: true
        serviceMonitor:
          enabled: true
          interval: 30s
          scrapeTimeout: 10s
    providers:
      kubernetesCRD:
        allowCrossNamespace: false
        allowExternalNameServices: false
      kubernetesIngress:
        allowExternalNameServices: false
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: default-rate-limit
        spec:
          rateLimit:
            average: 100
            burst: 200
            period: 1s
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: default-connection-limit
        spec:
          inFlightReq:
            amount: 100

apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: own-proxy
  namespace: shop
spec:
  provider:
    type: prometheus
    address: http://tenant-metrics-proxy.shop.svc.cluster.local:8080
  query: sum(up)
---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: leitbild-like
  namespace: shop
spec:
  provider:
    type: prometheus
    address: http://tenant-metrics-proxy.shop.svc.cluster.local:8080
  query: |
    (
      100 *
      (sum(rate(http_requests_total{namespace="{{ namespace }}", product="leitbild", rollout="canary", status=~"5.."}[{{ interval }}])) or on() vector(0))
      /
      clamp_min(sum(rate(http_requests_total{product="leitbild", rollout="canary", namespace="{{ namespace }}"}[{{ interval }}])), 0.001)
    ) or on() vector(0)
---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: platform-prometheus
  namespace: shop
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  query: sum(rate(http_requests_total{namespace="{{ namespace }}"}[1m]))
---

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native-changes:
    name: Detect native gate changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      sqlite: ${{ steps.filter.outputs.sqlite }}
      notifications: ${{ steps.filter.outputs.notifications }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            mobile:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'scripts/android-sdk-setup.sh'
              - 'cli/**'
              - 'templates/common/.github/**'
              - 'templates/mobile/**'
              - 'typescript/pnpm-lock.yaml'
              - 'typescript/packages/analytics-core/**'
              - 'typescript/packages/analytics-posthog-native/**'
              - 'typescript/packages/api-runtime/**'
              - 'typescript/packages/auth-native/**'
              - 'typescript/packages/data-contracts/**'
              - 'typescript/packages/data-contracts-expo-sqlite/**'
              - 'typescript/packages/navigation/**'
              - 'typescript/packages/ui-tokens/**'
            sqlite:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'scripts/android-sdk-setup.sh'
              - 'scripts/expo-android-conformance.sh'
              - 'examples/expo-sqlite-conformance/**'
              - 'typescript/pnpm-lock.yaml'
              - 'typescript/packages/data-contracts/**'
              - 'typescript/packages/data-contracts-expo-sqlite/**'
            notifications:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'scripts/android-sdk-setup.sh'
              - 'scripts/expo-android-conformance.sh'
              - 'examples/expo-notifications-conformance/**'
              - 'fixtures/zoned-time/**'
              - 'fixtures/notifications/**'
              - 'typescript/pnpm-lock.yaml'
              - 'typescript/packages/localization-core/**'
              - 'typescript/packages/notifications-core/**'
              - 'typescript/packages/notifications-expo/**'

  version-coherence:
    name: Release version coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/check-version-coherence.py

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust -> target
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust -> target
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust -> target
      - run: cargo test --manifest-path rust/Cargo.toml

  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --manifest-path rust/Cargo.toml --config rust/deny.toml check advisories licenses

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust -> target
          key: msrv-1.95
      - run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - name: Enable pinned pnpm
        working-directory: typescript
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
          pnpm --version
      - name: Find pnpm store
        id: pnpm-store
        working-directory: typescript
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('typescript/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Check example lockfiles
        run: make example-lockfiles-check
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build, lint, and test TypeScript packages
        working-directory: typescript
        run: |
          pnpm run test:source-maps
          pnpm turbo build lint test
      - name: Test Dexie conformance in Chromium and WebKit
        working-directory: typescript
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/typescript/.playwright-browsers
        run: |
          pnpm --filter @baukit/data-contracts-dexie exec playwright install --with-deps chromium webkit
          pnpm --filter @baukit/data-contracts-dexie run test:browser
          pnpm --filter @baukit/navigation run test:browser

  observability-lint:
    name: Observability metric names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 deploy/observability/lint/check-metric-names.py
      - run: python3 -m unittest discover -s deploy/observability/lint -p 'test_*.py'
      - run: deploy/observability/lint/check-rules.sh

  openapi-compatibility:
    name: OpenAPI compatibility check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - name: Enable pinned pnpm for release train tests
        run: npm install --global corepack@0.36.0
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  media-grants:
    name: Media grant njs verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - run: make media-grants-test media-grants-njs-test

  cli:
    name: Baukit CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli -> target
      - run: cargo fmt --manifest-path cli/Cargo.toml --all --check
      - run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path cli/Cargo.toml

  generated-fixture:
    name: Generated fixture (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: backend
            product_name: fixture
            flags: --backend
            backend: true
            mobile: false
            web: false
            mcp: false
          - flavor: web
            product_name: fixture
            flags: --web
            backend: false
            mobile: false
            web: true
            mcp: false
          - flavor: mobile
            product_name: fixture
            flags: --mobile
            backend: false
            mobile: true
            web: false
            mcp: false
          - flavor: combined
            product_name: fixture
            flags: --backend --mobile --web
            backend: true
            mobile: true
            web: true
            mcp: false
          - flavor: mcp
            product_name: fixture
            flags: --backend --mcp
            backend: true
            mobile: false
            web: false
            mcp: true
          - flavor: auth
            product_name: long-product-name-fixture
            flags: --backend --mobile --web --auth oidc --mcp
            backend: true
            mobile: true
            web: true
            mcp: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7.0.0
        if: matrix.mobile || matrix.web || matrix.mcp
        with:
          node-version-file: typescript/.nvmrc
      - name: Enable pinned pnpm
        if: matrix.mobile || matrix.web || matrix.mcp
        working-directory: typescript
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
          pnpm --version
      - name: Find pnpm store
        if: matrix.mobile || matrix.web || matrix.mcp
        id: pnpm-store
        working-directory: typescript
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        if: matrix.mobile || matrix.web || matrix.mcp
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-generated-${{ matrix.flavor }}-${{ hashFiles('typescript/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-generated-
            ${{ runner.os }}-pnpm-
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli -> target
          key: generated-fixture-cli
      - name: Build local Baukit TypeScript dependencies
        if: matrix.mobile || matrix.web || matrix.mcp
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @baukit/a11y-core --filter @baukit/analytics-core --filter @baukit/analytics-posthog-native --filter @baukit/api-runtime --filter @baukit/auth-native --filter @baukit/auth-node --filter @baukit/data-contracts --filter @baukit/ui-tokens --filter @baukit/navigation run build
      - name: Build CLI and generate local-path fixture
        run: |
          cargo build --manifest-path cli/Cargo.toml --bin baukit
          cli/target/debug/baukit new ${{ matrix.product_name }} ${{ matrix.flags }} --dir .generated-fixture --baukit-path rust
      - uses: Swatinem/rust-cache@v2.9.2
        if: matrix.backend
        with:
          workspaces: .generated-fixture/${{ matrix.product_name }}/backend -> target
          key: generated-fixture-${{ matrix.flavor }}-backend
      - name: Format generated backend
        if: matrix.backend
        run: cargo fmt --manifest-path .generated-fixture/${{ matrix.product_name }}/backend/Cargo.toml --all --check
      - name: Lint generated backend
        if: matrix.backend
        run: cargo clippy --manifest-path .generated-fixture/${{ matrix.product_name }}/backend/Cargo.toml --all-targets -- -D warnings
      - name: Test generated backend and OpenAPI drift
        if: matrix.backend
        run: |
          cargo test --manifest-path .generated-fixture/${{ matrix.product_name }}/backend/Cargo.toml -- --include-ignored
          cargo test --manifest-path .generated-fixture/${{ matrix.product_name }}/backend/Cargo.toml -p ${{ matrix.product_name }}-bin --test openapi_drift
      - name: Install and verify generated web app
        if: matrix.web
        working-directory: .generated-fixture/${{ matrix.product_name }}/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm lint
          pnpm test
          pnpm run test:coverage
      # Keep the fast source layer here; the path-filtered Android gate below compiles a clean fixture.
      - name: Install and verify generated mobile app without a native build
        if: matrix.mobile
        working-directory: .generated-fixture/${{ matrix.product_name }}/mobile
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm run test:coverage
      - name: Install and verify generated MCP package
        if: matrix.mcp
        working-directory: .generated-fixture/${{ matrix.product_name }}/mcp
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm openapi:check
          pnpm docs:check

  generated-mobile-android-build:
    name: Build generated mobile Android fixture
    needs: native-changes
    if: needs.native-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Enable pinned pnpm
        working-directory: typescript
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
      - name: Find pnpm store
        id: native-pnpm-store
        working-directory: typescript
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.native-pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-native-${{ hashFiles('typescript/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-native-
            ${{ runner.os }}-pnpm-
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli -> target
          key: generated-native-fixture-cli
      - name: Build local mobile dependencies
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @baukit/a11y-core --filter @baukit/analytics-core --filter @baukit/analytics-posthog-native --filter @baukit/api-runtime --filter @baukit/data-contracts --filter @baukit/data-contracts-expo-sqlite --filter @baukit/localization-core --filter @baukit/ui-tokens --filter @baukit/navigation run build
      - name: Generate mobile fixture
        run: |
          cargo build --manifest-path cli/Cargo.toml --bin baukit
          cli/target/debug/baukit new fixture --mobile --dir .generated-native-fixture --baukit-path rust
      - name: Install fixture dependencies
        working-directory: .generated-native-fixture/fixture/mobile
        run: pnpm install --frozen-lockfile
      - name: Clean Expo Android prebuild
        working-directory: .generated-native-fixture/fixture/mobile
        run: |
          set -o pipefail
          CI=1 pnpm exec expo prebuild --clean --platform android 2>&1 | tee native-prebuild.log
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Compile Android debug binary
        working-directory: .generated-native-fixture/fixture/mobile
        run: |
          set -o pipefail
          ./android/gradlew -p android --no-daemon --stacktrace assembleDebug 2>&1 | tee native-assemble.log
      - name: Upload native failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: generated-mobile-android-failure
          if-no-files-found: warn
          retention-days: 7
          path: |
            .generated-native-fixture/fixture/mobile/native-prebuild.log
            .generated-native-fixture/fixture/mobile/native-assemble.log
            .generated-native-fixture/fixture/mobile/.expo/
            .generated-native-fixture/fixture/mobile/android/app/build/reports/
            .generated-native-fixture/fixture/mobile/android/build/reports/

  generated-mobile-android-gate:
    name: Generated mobile Android gate
    needs: [native-changes, generated-mobile-android-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce relevant native build result
        env:
          MOBILE_RELEVANT: ${{ needs.native-changes.outputs.mobile }}
          BUILD_RESULT: ${{ needs.generated-mobile-android-build.result }}
        run: |
          if [[ "$MOBILE_RELEVANT" != "true" ]]; then
            echo "No mobile, config, CLI, or dependency paths changed; gate is not applicable."
          elif [[ "$BUILD_RESULT" == "success" ]]; then
            echo "Generated mobile Android fixture compiled successfully."
          else
            echo "Relevant Android build result was $BUILD_RESULT; skipped or unavailable is not green." >&2
            exit 1
          fi

  expo-sqlite-android-build:
    name: Expo SQLite conformance on Android
    needs: native-changes
    if: needs.native-changes.outputs.sqlite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Find pnpm store
        id: sqlite-pnpm-store
        working-directory: typescript
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.sqlite-pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-sqlite-${{ hashFiles('typescript/pnpm-lock.yaml', 'examples/expo-sqlite-conformance/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-sqlite-
            ${{ runner.os }}-pnpm-
      - name: Prepare Expo SQLite Android project
        run: make expo-sqlite-conformance-prepare
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run real Expo SQLite conformance
        env:
          BAUKIT_ANDROID_PHASE: run
        run: make expo-sqlite-conformance
      - name: Upload conformance failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: expo-sqlite-android-failure
          if-no-files-found: warn
          retention-days: 7
          path: |
            examples/expo-sqlite-conformance/artifacts/
            examples/expo-sqlite-conformance/.expo/
            examples/expo-sqlite-conformance/android/app/build/reports/

  expo-sqlite-android-gate:
    name: Expo SQLite Android gate
    needs: [native-changes, expo-sqlite-android-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce relevant device-conformance result
        env:
          SQLITE_RELEVANT: ${{ needs.native-changes.outputs.sqlite }}
          BUILD_RESULT: ${{ needs.expo-sqlite-android-build.result }}
        run: |
          if [[ "$SQLITE_RELEVANT" != "true" ]]; then
            echo "No SQLite adapter or conformance paths changed; gate is not applicable."
          elif [[ "$BUILD_RESULT" == "success" ]]; then
            echo "Real Expo SQLite conformance passed on Android."
          else
            echo "Relevant SQLite conformance result was $BUILD_RESULT; skipped or unavailable is not green." >&2
            exit 1
          fi

  expo-notifications-android-build:
    name: Expo notifications conformance on Android
    needs: native-changes
    if: needs.native-changes.outputs.notifications == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Find pnpm store
        id: notifications-pnpm-store
        working-directory: typescript
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.notifications-pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-notifications-${{ hashFiles('typescript/pnpm-lock.yaml', 'examples/expo-notifications-conformance/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-notifications-
            ${{ runner.os }}-pnpm-
      - name: Prepare Expo notifications Android project
        run: make expo-notifications-conformance-prepare
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run Hermes vectors and real expo-notifications conformance
        env:
          BAUKIT_ANDROID_PHASE: run
        run: make expo-notifications-conformance
      - name: Upload conformance failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: expo-notifications-android-failure
          if-no-files-found: warn
          retention-days: 7
          path: |
            examples/expo-notifications-conformance/artifacts/
            examples/expo-notifications-conformance/.expo/
            examples/expo-notifications-conformance/android/app/build/reports/

  expo-notifications-android-gate:
    name: Expo notifications Android gate
    needs: [native-changes, expo-notifications-android-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce relevant device-conformance result
        env:
          NOTIFICATIONS_RELEVANT: ${{ needs.native-changes.outputs.notifications }}
          BUILD_RESULT: ${{ needs.expo-notifications-android-build.result }}
        run: |
          if [[ "$NOTIFICATIONS_RELEVANT" != "true" ]]; then
            echo "No notifications, zoned-time, or conformance paths changed; gate is not applicable."
          elif [[ "$BUILD_RESULT" == "success" ]]; then
            echo "Hermes vectors and expo-notifications conformance passed on Android."
          else
            echo "Relevant notifications conformance result was $BUILD_RESULT; skipped or unavailable is not green." >&2
            exit 1
          fi

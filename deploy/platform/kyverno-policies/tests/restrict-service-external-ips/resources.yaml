apiVersion: v1
kind: Service
metadata:
  name: plain
  namespace: shop
spec:
  type: ClusterIP
  selector:
    app: shop
  ports:
    - name: http
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: external
  namespace: shop
spec:
  type: ClusterIP
  selector:
    app: shop
  ports:
    - name: http
      port: 80
  externalIPs:
    - 203.0.113.10

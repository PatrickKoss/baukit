apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  priorityClassName: platform-critical
  # A single instance cannot move during a drain. Its default primary PDB would
  # block every node drain, so it is off until the overlay runs 2+ instances.
  enablePDB: false
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgresql
    major: 18
  enableSuperuserAccess: false
  postgresql:
    # Sized in README.md "Connection budget".
    parameters:
      max_connections: "150"
    # A member of baukit_tenants may connect only to the database named like a role it belongs to.
    pg_hba:
      - host samerole +baukit_tenants all scram-sha-256
      - host all +baukit_tenants all reject
  bootstrap:
    initdb:
      database: product
      owner: product_owner
      secret:
        name: product-db-credentials
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 10Gi


apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: flux-tenant-service-account
  labels:
    app.kubernetes.io/part-of: baukit-platform
  annotations:
    policies.kyverno.io/title: Flux tenant service account
    policies.kyverno.io/severity: high
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [kustomizations]
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: [v2]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
    namespaceSelector:
      matchLabels:
        baukit.dev/tenant: "true"
  variables:
    - name: namespace
      expression: object.metadata.?namespace.orValue("")
    - name: sourceRefs
      expression: >-
        [object.spec.?sourceRef, object.spec.?chart.?spec.?sourceRef, object.spec.?chartRef]
        .filter(r, r.hasValue()).map(r, r.value())
    - name: foreignSources
      expression: >-
        variables.sourceRefs.filter(r, r.?namespace.orValue(variables.namespace) != variables.namespace)
        .map(r, r.kind + "/" + r.namespace + "/" + r.name)
  validations:
    - expression: object.spec.?serviceAccountName.orValue("") != ""
      messageExpression: >-
        object.kind + " objects in tenant namespaces must set spec.serviceAccountName to the tenant's " +
        "reconciler service account, so Flux applies them with tenant permissions."
    - expression: size(variables.foreignSources) == 0
      messageExpression: >-
        "Sources " + variables.foreignSources.join(", ") + " live in another namespace. " +
        "Tenants reference sources in their own namespace only."

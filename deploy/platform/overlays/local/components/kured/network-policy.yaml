apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kured-to-alert-sink
  namespace: kured
  labels:
    app.kubernetes.io/part-of: baukit-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kured
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alert-sink
      ports:
        - protocol: TCP
          port: 8080

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kured
spec:
  interval: 30m
  chart:
    spec:
      chart: kured
      version: "6.1.0"
      sourceRef:
        kind: HelmRepository
        name: kured
        namespace: kured
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    configuration:
      period: 1h
      rebootDays:
        - su
      startTime: "03:00"
      endTime: "05:00"
      timeZone: Etc/UTC
      forceReboot: false
      drainTimeout: 30m
      lockTtl: 2h
      metricsHost: 0.0.0.0
      metricsPort: 8080
      notifyUrl: ""
      slackHookUrl: ""
    metrics:
      create: true
      interval: 60s
    service:
      create: true
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

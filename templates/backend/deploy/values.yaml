product: {{ context.app_name }}
deploymentEnvironment: staging

config:
  existingSecretRefs:
    - name: {{ context.app_name }}-runtime
{% if context.worker %}  overrides:
    WORKER__CONCURRENCY: 5
    WORKER__LEASE_DURATION_SECONDS: 900
    WORKER__JOB_TIMEOUT_SECONDS: 600
    WORKER__POLL_INTERVAL_MILLISECONDS: 250
{% endif %}

api:
  image:
    repository: ghcr.io/patrickkoss/{{ context.app_name }}
    tag: latest{% if context.port_offset > 0 or context.service_ports_declared %}
  ports:
    http: {{ context.api_container_port }}
    ops: {{ context.ops_container_port }}
{% endif %}

migration:
  enabled: true
  image:
    repository: ghcr.io/patrickkoss/{{ context.app_name }}-migrate
    tag: latest
  command:
    - /app/migrate

worker:
  enabled: {{ "true" if context.worker else "false" }}
{% if context.worker %}  image:
    repository: ghcr.io/patrickkoss/{{ context.app_name }}-worker
    tag: latest
  command:
    - /app/worker{% if context.port_offset > 0 or context.service_ports_declared %}
  ops:
    port: {{ context.ops_container_port }}
{% endif %}
{% endif %}

{% if context.mcp %}mcp:
  enabled: true
  resourceUrl: https://mcp.example.com/mcp
  issuer: {% if context.auth_oidc %}https://identity.example.com/realms/{{ context.app_name }}{% elif context.auth_clerk %}https://clerk.example.com{% else %}https://example.authkit.app{% endif %}
  allowedHosts: [mcp.example.com]
  allowedOrigins: []

{% endif %}{% if context.platform %}platform:
  receiverSecretRef:
    name: {{ context.app_name }}-platform-receiver
    key: current
    previousKey: previous

{% endif %}ingress:
  enabled: false{% if context.mcp %}
  hosts:
    - host: mcp.example.com
      paths:
        - path: /v1
          pathType: Prefix{% endif %}

serviceMonitor:
  enabled: false

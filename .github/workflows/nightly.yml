name: Nightly verification

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_HTTP_TIMEOUT: 120s

jobs:
  kani-full:
    name: Every Kani harness
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.100.0"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.8.11
          cache: true
          install_args: cargo:kani-verifier
      - run: scripts/ci-gate.sh --step kani-full

  fuzz-targets:
    name: List fuzz targets
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          targets=$(python3 -c 'import json, pathlib; print(json.dumps(sorted(p.stem for p in pathlib.Path("rust/fuzz/fuzz_targets").glob("*.rs"))))')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz-nightly:
    name: Fuzz ${{ matrix.target }} (30 min)
    needs: fuzz-targets
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    env:
      BAUKIT_FUZZ_CORPUS_DIR: ${{ github.workspace }}/.fuzz-corpus
      BAUKIT_FUZZ_TARGET: ${{ matrix.target }}
      BAUKIT_FUZZ_SECONDS: 1800
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.100.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust/fuzz -> target
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-fuzz@0.13.2
      # Each run saves its grown corpus under a new key and restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - run: scripts/ci-gate.sh --step fuzz-nightly
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: rust/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  report-crash:
    name: Open an issue for fuzz crashes
    needs: fuzz-nightly
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write # files the crash issue
    steps:
      - name: Open or update the crash issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly fuzzing found a crash"
          body="Run: $RUN_URL. Crash inputs are in the fuzz-crash-<target> artifacts of that run."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

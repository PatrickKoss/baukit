apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: observability
  labels:
    app.kubernetes.io/name: alert-sink
    app.kubernetes.io/part-of: baukit-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-sink
        app.kubernetes.io/part-of: baukit-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sink
          image: python:3.13.18-alpine3.24@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -u
            - /app/sink.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: alert-sink
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: observability
  labels:
    app.kubernetes.io/name: alert-sink
    app.kubernetes.io/part-of: baukit-platform
spec:
  selector:
    app.kubernetes.io/name: alert-sink
  ports:
    - name: http
      port: 8080
      targetPort: http

# TLS comes from the platform wildcard in Traefik's default TLSStore, so the route names no secret.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ context.app_name }}-headers
  labels:
    app.kubernetes.io/part-of: {{ context.app_name }}
    baukit.dev/product: {{ context.app_name }}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
---
# Retries only when Traefik cannot reach an API pod; it stops once a pod answers, whatever the status.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ context.app_name }}-retry
  labels:
    app.kubernetes.io/part-of: {{ context.app_name }}
    baukit.dev/product: {{ context.app_name }}
spec:
  retry:
    attempts: 2
    initialInterval: 100ms
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ context.app_name }}
  labels:
    app.kubernetes.io/part-of: {{ context.app_name }}
    baukit.dev/product: {{ context.app_name }}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`{{ context.app_name }}.invalid`)
      middlewares:
        - name: {{ context.app_name }}-headers
        - name: {{ context.app_name }}-retry
      services:
        - kind: Service
          name: {{ context.app_name }}
          port: 80
  tls:
    domains:
      - main: {{ context.gitops.domain }}
        sans:
          - "*.{{ context.gitops.domain }}"

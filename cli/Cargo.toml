[package]
name = "baukit-cli"
version = "0.3.2"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "baukit"
path = "src/main.rs"

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.54", features = ["derive"] }
include_dir = "=0.7.4"
minijinja = "=2.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.9.11"

[dev-dependencies]
sha2 = "=0.10.9"
tempfile = "=3.23.0"


apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: baukit-worker-queue-age
  namespace: flagger-system
  labels:
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: progressive-delivery
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
  query: |
    max(worker_queue_oldest_age_seconds{
      product="{{ variables.product }}",
      service="{{ variables.product }}-worker",
      environment="{{ variables.environment }}"
    }) or on() vector(0)


# Tenant namespaces bind ClusterRole admin to their flux-reconciler. Kubernetes aggregates these
# rules into admin, edit and view, so tenants manage the traefik objects baukit-app products ship.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: baukit-tenant-traefik-edit
  labels:
    app.kubernetes.io/part-of: baukit-platform
    app.kubernetes.io/component: flux-tenant
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: [traefik.io]
    resources:
      - ingressroutes
      - middlewares
      - traefikservices
    verbs: [create, delete, deletecollection, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: baukit-tenant-traefik-view
  labels:
    app.kubernetes.io/part-of: baukit-platform
    app.kubernetes.io/component: flux-tenant
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [traefik.io]
    resources:
      - ingressroutes
      - middlewares
      - traefikservices
    verbs: [get, list, watch]
---
# restrict-tenant-traefik-routes compares HostSNI against every IngressRouteTCP. Only the Kyverno
# controllers read them; tenants get no IngressRouteTCP access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: baukit-kyverno-traefik-tcp-view
  labels:
    app.kubernetes.io/part-of: baukit-platform
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: [traefik.io]
    resources:
      - ingressroutetcps
    verbs: [get, list, watch]

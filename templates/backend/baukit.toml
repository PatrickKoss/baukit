schema_version = 1
template_version = "{{ context.template_version }}"

[app]
name = "{{ context.app_name }}"

[quality]
profile = "{{ "strict" if context.quality_strict else "standard" }}"
backend_coverage_lines = 70
critical_paths = []
webkit_repeats = 3
full_stack_e2e = false

[capabilities]
backend = true
worker = {{ context.worker }}
mobile = false
web = false
pwa = false
{% if context.auth_oidc %}auth = "oidc"
{% endif %}

[dependencies.baukit]
{{ context.baukit_manifest }}

[openapi]
schema = "backend/openapi.json"
consumers = ["generated/openapi.d.ts"]

# TLC for the models gate step. v1.7.4 is the last stable release; v1.8.0 is a pre-release whose jar is
# re-uploaded in place. One platform-independent jar, so every platform has the same digest.
# It installs as .tools/bin/tla2tools (still a jar) and runs with `java -cp`.
[tools.tla2tools]
version = "1.7.4"
url = "https://github.com/tlaplus/tlaplus/releases/download/v{version}/tla2tools.jar"
sha256 = { linux-amd64 = "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88", linux-arm64 = "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88", darwin-arm64 = "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88" }


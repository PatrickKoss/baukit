apiVersion: cli.kyverno.io/v1alpha1
kind: ClusterResource
metadata:
  name: ingresses
spec:
  resources:
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: existing
        namespace: shop
      spec:
        rules:
          - host: shop.example.test
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: web
                      port:
                        name: http

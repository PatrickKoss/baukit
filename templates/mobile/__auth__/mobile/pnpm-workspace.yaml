allowBuilds:
  core-js: false
{% if context.auth_clerk %}  browser-tabs-lock: false
{% endif %}
  unrs-resolver: true

minimumReleaseAgeExclude:
  - expo@57.0.33
  - expo-auth-session@57.0.17
  - expo-constants@57.0.24
  - expo-linking@57.0.14
  - expo-router@57.0.31
  - expo-sqlite@57.0.5

catalog:
  expo-constants: 57.0.24

overrides:
  '@react-native/metro-config': 0.86.3
  expo-constants: 'catalog:'
  glob@13: 14.0.2
  minimatch@10: 11.0.1
  react-dom: 19.2.3
{{ context.baukit_pnpm_overrides }}
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-react-native-a11y>eslint': '10'

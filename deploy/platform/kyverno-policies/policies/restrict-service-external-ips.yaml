apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-service-external-ips
  labels:
    app.kubernetes.io/part-of: baukit-platform
  annotations:
    policies.kyverno.io/title: Restrict Service externalIPs
    policies.kyverno.io/severity: high
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  validations:
    - expression: size(object.spec.?externalIPs.orValue([])) == 0
      message: >-
        Services must not set spec.externalIPs (CVE-2020-8554). Expose traffic through the Traefik
        ingress instead.

{{- $runbookBaseUrl := include "baukit-observability.runbookBaseUrl" . }}
{{- if and .Values.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
{{- $groups := list -}}
{{- range $directory := list "recording-rules" "alerts" }}
{{- range $path, $_ := $.Files.Glob (printf "%s/*.{yml,yaml}" $directory) }}
{{- $groups = concat $groups (required (printf "%s has no rule groups" $path) ($.Files.Get $path | replace "RUNBOOK_BASE_URL" $runbookBaseUrl | fromYaml).groups) -}}
{{- end }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "baukit-observability.fullname" . }}
  labels:
    {{- include "baukit-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.prometheusRule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    {{- $groups | toYaml | nindent 4 }}
{{- end }}

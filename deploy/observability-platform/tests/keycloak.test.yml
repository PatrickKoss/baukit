rule_files:
  - ../alerts/keycloak.rules.yml
evaluation_interval: 1m
tests:
  - name: 10% 5xx fires BaukitKeycloakServerErrors
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{container="keycloak",namespace="keycloak",pod="keycloak-0",outcome="SERVER_ERROR",status="500",uri="/realms/{realm}/protocol/{protocol}/token"}'
        values: '0+6x30'
      - series: 'http_server_requests_seconds_count{container="keycloak",namespace="keycloak",pod="keycloak-0",outcome="SUCCESS",status="200",uri="/realms/{realm}/protocol/{protocol}/token"}'
        values: '0+54x30'
    alert_rule_test:
      - eval_time: 8m
        alertname: BaukitKeycloakServerErrors
        exp_alerts: []
      - eval_time: 20m
        alertname: BaukitKeycloakServerErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              component: keycloak
              namespace: keycloak
              pod: keycloak-0
            exp_annotations:
              summary: Keycloak keycloak/keycloak-0 answers over 5% of requests with 5xx
              description: >-
                10% of the requests Keycloak in
                keycloak/keycloak-0 served returned 5xx for 10 minutes.
              runbook_url: RUNBOOK_BASE_URL/keycloak-server-errors
  - name: 1% 5xx and an idle failing pod stay quiet
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{container="keycloak",namespace="keycloak",pod="keycloak-0",outcome="SERVER_ERROR",status="500",uri="/"}'
        values: '0+1x30'
      - series: 'http_server_requests_seconds_count{container="keycloak",namespace="keycloak",pod="keycloak-0",outcome="SUCCESS",status="200",uri="/"}'
        values: '0+99x30'
      - series: 'http_server_requests_seconds_count{container="keycloak",namespace="keycloak",pod="keycloak-1",outcome="SERVER_ERROR",status="500",uri="/"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: BaukitKeycloakServerErrors
        exp_alerts: []
  - name: 20 failed logins a minute fires BaukitKeycloakLoginFailuresHigh
    interval: 1m
    input_series:
      - series: 'keycloak_user_events_total{container="keycloak",namespace="keycloak",pod="keycloak-0",event="login",error="invalid_user_credentials",realm="product"}'
        values: '0+20x40'
      - series: 'keycloak_user_events_total{container="keycloak",namespace="keycloak",pod="keycloak-0",event="login",error="",realm="product"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: BaukitKeycloakLoginFailuresHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: keycloak
              namespace: keycloak
              realm: product
            exp_annotations:
              summary: Realm product sees over 10 failed logins a minute
              description: >-
                Keycloak in keycloak recorded 20 failed logins a
                minute in realm product for 10 minutes. That is a password-guessing run or
                a client sending stale credentials.
              runbook_url: RUNBOOK_BASE_URL/keycloak-login-failures-high
  - name: a few failed logins and many good ones stay quiet
    interval: 1m
    input_series:
      - series: 'keycloak_user_events_total{container="keycloak",namespace="keycloak",pod="keycloak-0",event="login",error="invalid_user_credentials",realm="product"}'
        values: '0+3x40'
      - series: 'keycloak_user_events_total{container="keycloak",namespace="keycloak",pod="keycloak-0",event="login",error="",realm="product"}'
        values: '0+500x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BaukitKeycloakLoginFailuresHigh
        exp_alerts: []
  - name: requests waiting for a connection fire BaukitKeycloakDatabasePoolExhausted
    interval: 1m
    input_series:
      - series: 'agroal_awaiting_count{container="keycloak",namespace="keycloak",pod="keycloak-0",datasource="default"}'
        values: '3x15'
    alert_rule_test:
      - eval_time: 3m
        alertname: BaukitKeycloakDatabasePoolExhausted
        exp_alerts: []
      - eval_time: 10m
        alertname: BaukitKeycloakDatabasePoolExhausted
        exp_alerts:
          - exp_labels:
              severity: warning
              component: keycloak
              namespace: keycloak
              pod: keycloak-0
            exp_annotations:
              summary: Keycloak keycloak/keycloak-0 waits for database connections
              description: >-
                3 requests in Keycloak keycloak/keycloak-0 have waited
                for a free database connection for 5 minutes. Logins and token refreshes stall.
              runbook_url: RUNBOOK_BASE_URL/keycloak-database-pool-exhausted
  - name: a short wait for a connection stays quiet
    interval: 1m
    input_series:
      - series: 'agroal_awaiting_count{container="keycloak",namespace="keycloak",pod="keycloak-0",datasource="default"}'
        values: '0 0 2 2 0x12'
    alert_rule_test:
      - eval_time: 15m
        alertname: BaukitKeycloakDatabasePoolExhausted
        exp_alerts: []

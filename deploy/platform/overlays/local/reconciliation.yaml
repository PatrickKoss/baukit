apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-baseline
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 5m
  path: ./deploy/platform/cluster-baseline
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: baukit
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-foundation
  namespace: flux-system
spec:
  dependsOn:
    - name: local-baseline
  interval: 10m
  retryInterval: 30s
  timeout: 5m
  path: ./deploy/platform/overlays/local/components/foundation
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: baukit
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-cert-manager

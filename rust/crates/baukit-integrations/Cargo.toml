[package]
name = "baukit-integrations"
description = "Provider-neutral connector contract for cursor-paged imports, verified webhooks, and connection health."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Single-use, browser-bound OAuth state with an in-memory store.
oauth-state = ["dep:aws-lc-rs", "dep:base64", "dep:subtle"]
# PostgreSQL OAuth state store.
postgres = ["oauth-state", "dep:sqlx"]
# Cookie helpers for axum routes.
axum = ["oauth-state", "dep:axum"]

[dependencies]
aws-lc-rs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
baukit-http.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
baukit-jobs = { path = "../baukit-jobs" }
baukit-integrations = { path = ".", features = ["oauth-state", "postgres", "axum"] }
baukit-test = { path = "../baukit-test" }
proptest = "1.12.0"
tokio.workspace = true

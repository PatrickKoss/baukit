apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: falco
resources:
  - namespace.yaml
  - helm-repository.yaml
  - helm-release.yaml
  - network-policy.yaml
configMapGenerator:
  - name: falco-baukit-rules
    files:
      - rules/baukit.rules.yaml
generatorOptions:
  # Falco watches rules.d and reloads in place, so the ConfigMap keeps a stable name.
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: baukit-platform

apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: helmrelease-drift-detection
  annotations:
    policies.kyverno.io/title: HelmRelease drift detection
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: [v2]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  validations:
    - expression: object.spec.?driftDetection.?mode.orValue("") == "enabled"
      messageExpression: >-
        "HelmRelease " + object.metadata.name + " must set spec.driftDetection.mode to enabled, so " +
        "helm-controller reverts manual changes to its objects."

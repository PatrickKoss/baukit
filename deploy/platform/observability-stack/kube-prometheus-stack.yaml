apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  timeout: 12m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.6.5"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: warn
  values:
    crds:
      enabled: true

    # K3s embeds these control-plane components and does not expose the
    # standalone scrape targets expected by kube-prometheus-stack.
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        windows: false
      additionalRuleAnnotations:
        Watchdog:
          runbook_url: https://github.com/PatrickKoss/baukit/blob/main/docs/runbooks/platform/watchdog

    alertmanager:
      enabled: true
      alertmanagerSpec:
        # The overlay provides Secret alertmanager-routing with key alertmanager.yaml, see
        # alertmanager/alertmanager.example.yaml. The operator falls back to a drop-all config when
        # configSecret is missing, so the same Secret is also mounted: without it the pod never
        # starts, Watchdog stops and the external heartbeat fires.
        useExistingSecret: true
        configSecret: alertmanager-routing
        secrets:
          - alertmanager-routing
        replicas: 1
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi

    grafana:
      enabled: true
      replicas: 1
      # The overlay creates this Secret with admin-user and admin-password.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 384Mi
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 96Mi
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          annotations:
            grafana_folder: Kubernetes
          provider:
            foldersFromFilesStructure: true
        datasources:
          enabled: true
          defaultDatasourceEnabled: true
          uid: prometheus
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki-gateway.observability.svc.cluster.local
          editable: false
          jsonData:
            derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id":"([a-f0-9]+)"'
                datasourceUid: tempo
                url: '${__value.raw}'
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo.observability.svc.cluster.local:3200
          editable: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: -5m
              spanEndTimeShift: 5m
              filterByTraceID: true
              filterBySpanID: false
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true

    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      replicas: 1
      # Platform alerts select namespaces by this label through kube_namespace_labels.
      metricLabelsAllowlist:
        - namespaces=[app.kubernetes.io/part-of]
      # Flux object state as gotk_resource_info, after fluxcd/flux2-monitoring-example
      # (kube-state-metrics-config.yaml at 7ab65dc), limited to the kinds the platform uses.
      rbac:
        extraRules:
          - apiGroups:
              - helm.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - source.toolkit.fluxcd.io
            resources:
              - kustomizations
              - helmreleases
              - gitrepositories
              - ocirepositories
              - helmrepositories
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_source_name: [spec, chart, spec, sourceRef, name]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux GitRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux OCIRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 192Mi

    nodeExporter:
      enabled: true
    # Node-exporter needs hostPID, hostNetwork and hostPath, so it runs in the
    # privileged observability-agents namespace.
    prometheus-node-exporter:
      namespaceOverride: observability-agents
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 150m
          memory: 96Mi

    prometheusOperator:
      enabled: true
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 384Mi

    prometheus:
      # Flux controllers, as in fluxcd/flux2-monitoring-example.
      additionalPodMonitors:
        - name: flux-system
          namespaceSelector:
            matchNames:
              - flux-system
          selector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - helm-controller
                  - kustomize-controller
                  - notification-controller
                  - source-controller
          podMetricsEndpoints:
            - port: http-prom
      enabled: true
      prometheusSpec:
        replicas: 1
        shards: 1
        # Metrics retention budget (§8.5): the single source of truth.
        retention: 30d
        # About 85% of the 30Gi PVC, in Prometheus base-2 units. Change both together.
        retentionSize: 25GB
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 30Gi
        ruleSelectorNilUsesHelmValues: false
        # Rules, ServiceMonitors and PodMonitors are read from every namespace
        # labelled app.kubernetes.io/part-of=baukit-platform.
        ruleSelector: {}
        ruleNamespaceSelector:
          matchLabels:
            app.kubernetes.io/part-of: baukit-platform
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector:
          matchLabels:
            app.kubernetes.io/part-of: baukit-platform
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector:
          matchLabels:
            app.kubernetes.io/part-of: baukit-platform

    thanosRuler:
      enabled: false

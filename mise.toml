[tools]
java = "temurin-25.0.4+101.0.LTS"
node = { version = "26.10.0", postinstall = "npm install --global --prefix \"$MISE_TOOL_INSTALL_PATH\" corepack@0.36.0" }
rust = { version = "1.100.0", components = "clippy,rustfmt" }
swift = "6.4.0"
"github:xtool-org/xtool" = { version = "1.20.1", asset_pattern = "xtool-x86_64.AppImage", postinstall = "cd \"$MISE_TOOL_INSTALL_PATH\" && ./xtool.AppImage --appimage-extract >/dev/null && printf '#!/bin/sh\nexec \"$(dirname \"$(readlink -f \"$0\")\")/squashfs-root/AppRun\" \"$@\"\n' > xtool && chmod +x xtool" }
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:google/osv-scanner" = "2.7.0"
"aqua:astral-sh/ruff" = "0.17.4"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:ast-grep/ast-grep" = "0.51.1"
"github:sbdchd/squawk" = { version = "2.74.0", bin = "squawk", rename_exe = "squawk" }
"cargo:cargo-fuzz" = "0.13.2"
"cargo:kani-verifier" = { version = "0.68.0", postinstall = "cargo kani setup" }
# Verus release zip with its own z3; it verifies rust/verus with the pinned rust toolchain above.
"http:verus" = { version = "0.2026.11.22.1ce6a59", bin_path = "verus-x86-linux", platforms = { linux-x64 = { url = "https://github.com/verus-lang/verus/releases/download/release%2F0.2026.11.22.1ce6a59/verus-0.2026.11.22.1ce6a59-x86-linux.zip", checksum = "sha256:c955d5958877f4f907cce80aa996d4239a481984829d82e325938c7bf242b0db" } } }
# tla2tools.jar is pinned in deploy/tools.toml (TLA2TOOLS_JAR).

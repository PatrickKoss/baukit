apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - statefulset.yaml
  - services.yaml
  - network-policy.yaml
  - podmonitor.yaml
configMapGenerator:
  - name: redis-ha-scripts
    namespace: platform-redis
    files:
      - redis-ha.sh
generatorOptions:
  labels:
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: redis

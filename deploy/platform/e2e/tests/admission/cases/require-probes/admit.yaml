apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission-probed
  namespace: e2e-tenant
  labels:
    app.kubernetes.io/name: admission
    app.kubernetes.io/part-of: e2e-admission
    baukit.dev/process: api
spec:
  selector:
    matchLabels:
      app: admission-probed
  template:
    metadata:
      labels:
        app: admission-probed
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: localhost/baukit-e2e/echo:local
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
          livenessProbe:
            httpGet: {path: /live, port: 8080}

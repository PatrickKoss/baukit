apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-baukit-images
  labels:
    app.kubernetes.io/part-of: baukit-platform
  annotations:
    policies.kyverno.io/title: Verify baukit product images
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Product images under ghcr.io/patrickkoss must be referenced by digest and carry a cosign
      signature made with the product signing key. The overlay supplies the public key in
      ConfigMap kyverno/baukit-image-signing-key and the registry pull credential in
      Secret kyverno/baukit-image-verify-registry (plan D6).
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        baukit.dev/tenant: "true"
  matchImageReferences:
    - glob: ghcr.io/patrickkoss/*
  # Read with the controllers' existing access to Secrets in the kyverno namespace. A missing
  # Secret means anonymous pulls, which private GHCR packages refuse.
  credentials:
    secrets:
      - baukit-image-verify-registry
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  variables:
    - name: signingKey
      expression: >-
        resource.Get("v1", "configmaps", "kyverno", "baukit-image-signing-key")
        .?data[?"cosign.pub"].orValue("")
  attestors:
    - name: release
      cosign:
        key:
          expression: variables.signingKey
        # Signatures skip the public Rekor log so private image digests stay private.
        ctlog:
          insecureIgnoreTlog: true
  validations:
    - expression: >-
        (images.containers + images.?initContainers.orValue([]))
        .map(image, verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
      message: >-
        Product images must be pinned as repository:tag@sha256:<digest> and signed with the product
        cosign key. Release the image with the product's release script, which signs it, and deploy
        the digest pin it writes.

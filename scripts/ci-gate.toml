[quality]
# Emulator block 5780 to 5787 for native-android, outside every product block.
android_emulator_port = 5780
android_emulators = 2
# native-android compiles Gradle and boots both emulators: on 2 or 3 cores it took
# 1477 to 2029 s and hit a SystemUI ANR, on 10 cores 947 s.
emulator_steps = ["native-android", "expo-sqlite", "expo-notifications"]
emulator_cores = 8
# deploy/ is mapped per directory in [quality.affected]; only its shared tool pins and
# helpers force the full gate.
shared = [
  "deploy/tools.toml",
  "deploy/lib/**",
  "deploy/smoke/**",
  "fixtures/**",
  "rust/deny.toml",
  "rust/Cargo.toml",
  "renovate*.json",
]

# gate.py skips a step that passed on the same inputs. These steps read data that changes
# without a commit: advisory databases (cargo-deny, osv, trivy in platform-images), the
# git history (secret-scan) and the last release tag (migrations), so they always run.
[quality.cache]
never = ["cargo-deny", "osv", "secret-scan", "platform-images", "migrations"]

# The 0.32.0 gate started fuzz after the other lanes had drained the pool, so it got 1 core
# and ran its 19 targets of 60 s one after another: 2236 s, the slowest lane. With 6 cores
# the targets run in 4 rounds (about 240 s) and the build gets 6 jobs.
[quality.min_cores]
fuzz = 6

[quality.gate_budget_minutes]
full = 30
affected = 15

# gate.py refuses to start below the highest floor of the planned steps. The 0.26.2 gate
# failed at 91% disk: a full gate grows a worktree by about 19 GB, and platform-e2e's k3d
# kubelet evicts pods below about 50 GiB free, so it needs that plus the build, cluster and
# images. The fixture and Testcontainers steps build products and pull images. `--step` runs
# skip the check because hosted CI runners have less space and run one step each.
[quality.disk]
floor_gb = 30

[quality.disk.step_floor_gb]
platform-e2e = 120
rust-tests = 60
fixture-1 = 60
fixture-2 = 60
affected-fixture = 60
mcp-fixture = 60
migrations = 30

[quality.affected]
"README.md" = []
"CLAUDE.md" = []
"AGENTS.md" = []
"docs/**" = ["docs-links"]
"**/*.md" = ["docs-links"]
".gitleaks.toml" = []
"osv-scanner.toml" = []
"ruff.toml" = []
"zizmor.yml" = ["workflows"]
# vectors runs generators in workspace crates; verus/equivalence path-depends on baukit-sync and
# baukit-ratelimit, whose normal dependencies reach most crates.
"rust/crates/**" = ["rust", "fixtures", "mcp-fixture", "fuzz", "kani", "vectors", "verus"]
"rust/crates/*/migrations/**" = ["migrations"]
"rust/migrations.toml" = ["migrations"]
"scripts/check-migrations.py" = ["migrations"]
"scripts/migrations-old-binary.sh" = ["migrations"]
"scripts/list-proofs.py" = ["kani"]
"rust/verus/**" = ["verus"]
"models/**" = ["models"]
# Code each TLA+ model describes; a change there re-checks the models.
"rust/crates/baukit-sync/**" = ["models"]
"rust/crates/baukit-jobs/**" = ["models"]
"rust/crates/baukit-auth/src/browser_session/**" = ["models"]
"rust/crates/baukit-suite/**" = ["models"]
"rust/crates/baukit-erasure/**" = ["models"]
"typescript/packages/data-contracts/**" = ["models"]
"scripts/regenerate-vectors.py" = ["vectors"]
"scripts/vector-generators.toml" = ["vectors"]
"rust/fuzz/**" = ["fuzz"]
"scripts/fuzz.sh" = ["fuzz"]
"cli/**" = ["cli", "fixtures", "mcp-fixture", "native-android"]
"templates/**" = ["cli", "fixtures", "mcp-fixture", "native-android"]
# rust/crates/baukit-openapi/tests/naming.rs include_str!s the template OpenAPI documents.
"templates/backend/**/openapi.json" = ["rust"]
"agent-skills/**" = ["cli", "fixtures"]
# Scripts only the generated-fixture gates run; scripts-tests covers their tests in the fast lane.
"scripts/generated-fixture-gate.sh" = ["fixtures"]
"scripts/check-gitops-fixture.py" = ["fixtures"]
"scripts/check-deploy-values.py" = ["fixtures"]
"scripts/check-production-bundle.test.mjs" = ["fixtures"]
"scripts/check-web-headers.sh" = ["fixtures"]
"scripts/web-session-stack.py" = ["fixtures"]
"scripts/build-fixture-ts-packages.sh" = ["fixtures", "mcp-fixture"]
"scripts/fixture-ts-packages.txt" = ["fixtures", "mcp-fixture"]
# The CLI embeds lint/ (agent rules, Rust lint tables, ast-grep rules) into generated products.
"lint/**" = ["cli", "fixtures", "mcp-fixture", "native-android"]
"baukit-check.toml" = ["cli", "fixtures", "mcp-fixture", "native-android"]
"typescript/**" = ["ts", "fixtures", "mcp-fixture", "android"]
"examples/minimal-api/**" = ["examples-test"]
"examples/expo-sqlite-conformance/**" = ["expo-sqlite"]
"examples/expo-notifications-conformance/**" = ["expo-notifications"]
"templates/**/Dockerfile*" = ["platform-images"]
"examples/**/Dockerfile*" = ["platform-images"]
"scripts/platform-images.sh" = ["platform-images"]
# The fast lane always runs platform-validate, the observability steps and media-grants, so
# these paths add only the lanes that render or run them beyond that.
"deploy/platform/**" = ["platform-e2e", "platform-images"]
"deploy/observability/**" = ["platform-e2e"]
# cli/src/check/observability/promql.rs include_str!s the metric-name linter.
"deploy/observability/lint/**" = ["cli", "fixtures", "mcp-fixture", "native-android"]
"deploy/observability-platform/**" = ["platform-e2e"]
"deploy/chart/**" = ["platform-e2e", "platform-images", "fixtures"]
"deploy/media-grants/**" = []

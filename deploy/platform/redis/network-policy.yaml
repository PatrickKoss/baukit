apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-default-deny
  namespace: platform-redis
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-client-ingress
  namespace: platform-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              baukit.dev/redis-client: "true"
          podSelector:
            matchLabels:
              baukit.dev/redis-client: "true"
      ports:
        - protocol: TCP
          port: 6379

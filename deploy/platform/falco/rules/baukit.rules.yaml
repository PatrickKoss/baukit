# Loaded after /etc/falco/falco_rules.yaml (upstream). Validate with deploy/platform/falco/validate-rules.sh.

- list: baukit_app_processes
  items: [api, worker, migrate, seed]

- list: baukit_serving_processes
  items: [api, worker]

- list: baukit_platform_namespaces
  items:
    - cert-manager
    - cnpg-system
    - falco
    - flagger-system
    - flux-system
    - kube-system
    - kured
    - kyverno
    - observability
    - observability-agents
    - platform-redis
    - postgres
    - posthog
    - traefik

- list: baukit_exec_protected_namespaces
  items: [postgres, kyverno, flux-system]

- macro: baukit_cluster_pod
  condition: (k8s.ns.name exists and k8s.ns.name != "")

# WSL2 and k3d share one kernel with dockerd, other k3d clusters and gate containers. Their processes
# show up as container.id=host or as containers the CRI socket does not know, so they carry no
# k8s.ns.name (FA0 spike, 2026-11-14: dockerd reading /etc/shadow, containerd PTRACE in another
# k3d node, foreign coredns contacting its API server, k3d's docker exec into another node).
# The base watches host processes. A shared-kernel cluster (k3d on WSL2, the e2e cluster) turns the
# filter on with components/falco-shared-kernel, which overrides this macro in falco-overlay-rules.
- macro: baukit_shared_kernel
  condition: (never_true)

- macro: baukit_foreign_host_event
  condition: (baukit_shared_kernel and not baukit_cluster_pod)

# Falco truncates /var/log/apk.log at startup and trips Clear Log Activities (FA0 spike, 2026-11-14).
- macro: baukit_falco_self
  condition: (k8s.ns.name = falco and container.name = falco and fd.name = /var/log/apk.log)

- macro: baukit_known_noise
  condition: (baukit_foreign_host_event or baukit_falco_self)

- rule: Read sensitive file trusted after startup
  condition: and not baukit_known_noise
  override:
    condition: append

- rule: Read sensitive file untrusted
  condition: and not baukit_known_noise
  override:
    condition: append

- rule: PTRACE anti-debug attempt
  condition: and not baukit_known_noise
  override:
    condition: append

# A libFuzzer run on the host attaches to its own children (FA4 soak, 2026-11-15, container.id=host).
- rule: PTRACE attached to process
  condition: and not baukit_known_noise
  override:
    condition: append

- rule: Contact K8S API Server From Container
  condition: and not baukit_known_noise
  override:
    condition: append

- rule: Terminal shell in container
  condition: and not baukit_known_noise
  override:
    condition: append

- rule: Clear Log Activities
  condition: and not baukit_known_noise
  override:
    condition: append

- macro: baukit_app_container
  condition: (container and k8s.pod.label[baukit.dev/process] in (baukit_app_processes))

- macro: baukit_serving_container
  condition: (container and k8s.pod.label[baukit.dev/process] in (baukit_serving_processes))

- macro: baukit_migration_container
  condition: (container and k8s.pod.label[baukit.dev/process] = migrate)

# runc re-executes itself as "<fd> init" inside the container before it starts the exec'd process,
# which the rule sees on its own (FA4 soak, 2026-11-15: one "6 init" event per kubectl exec).
- macro: baukit_runc_init
  condition: (proc.exe = runc and proc.pname = runc and proc.args = init)

# kubectl exec and attach start the process from the runtime, never as PID 1 of the container.
# container_entrypoint also matches a process whose parent Falco never saw, which keeps an exec with a
# lost parent detected.
- macro: baukit_runtime_exec
  condition: (spawned_process and container_entrypoint and proc.vpid != 1 and not baukit_runc_init)

# The CNPG operator starts backups with an exec of "manager backup <name>" in the postgres container,
# and the Barman Cloud plugin sidecar has an exec startup probe "/manager healthcheck unix"
# (FA4 soak, 2026-11-15, first scheduled backup after install).
# After a rules reload Falco loses the parents of running processes, so the children the CNPG
# instance manager keeps spawning look like execs: pg_isready every 10 seconds and the WAL archive
# command (FA4 soak, 2026-11-15).
- macro: baukit_cnpg_instance_manager_child
  condition: >
    (k8s.ns.name = postgres
    and container.image.repository = ghcr.io/cloudnative-pg/postgresql
    and (proc.name = pg_isready
      or (proc.name = sh and proc.cmdline startswith "sh -c -- /controller/manager wal-archive ")
      or (proc.name = barman-cloud-wa and proc.cmdline startswith "barman-cloud-wa /venv/bin/barman-cloud-wal-archive ")))

# kustomize-controller runs git to fetch a remote kustomization base. After a rules reload its children
# look like execs (INT full run, 2026-11-15: git init, remote add, fetch, checkout and submodule update
# for the flux-tenancy remote base).
- macro: baukit_flux_controller_child
  condition: >
    (k8s.ns.name = flux-system
    and container.image.repository = ghcr.io/fluxcd/kustomize-controller
    and proc.name = git)

# The Barman Cloud plugin sidecar runs the barman-cloud scripts for backup retention and WAL archiving.
# Falco shows them as execs with the truncated script name (platform-local Loki, 2026-11-16:
# backup-list and backup-delete on every backup, wal-archive per segment).
- macro: baukit_cnpg_plugin_child
  condition: >
    (k8s.ns.name = postgres
    and container.image.repository = ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar
    and container.name = plugin-barman-cloud
    and ((proc.name = barman-cloud-ba
        and (proc.cmdline startswith "barman-cloud-ba /venv/bin/barman-cloud-backup-list "
          or proc.cmdline startswith "barman-cloud-ba /venv/bin/barman-cloud-backup-delete "))
      or (proc.name = barman-cloud-wa
        and proc.cmdline startswith "barman-cloud-wa /venv/bin/barman-cloud-wal-archive ")))

- macro: baukit_cnpg_runtime_exec
  condition: >
    (baukit_cnpg_instance_manager_child
    or baukit_cnpg_plugin_child
    or (k8s.ns.name = postgres
      and ((container.image.repository = ghcr.io/cloudnative-pg/postgresql and proc.cmdline startswith "manager backup ")
        or (container.image.repository = ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar and proc.cmdline = "manager healthcheck unix"))))

# The Kyverno chart's legacy policy check hook runs kubectl-kyverno as its container entrypoint. When the
# hook starts while Falco itself starts, Falco misses its parent and it looks like an exec (CI run
# 45351167853, kyverno-check-legacy-policies 11 s after the Falco pod started).
- macro: baukit_kyverno_legacy_check
  condition: >
    (k8s.ns.name = kyverno
    and container.image.repository = reg.kyverno.io/kyverno/kyverno-cli
    and proc.cmdline = "kubectl-kyverno check-legacy-policies")

- rule: Baukit shell or package manager in app container
  desc: A shell or package manager started in a baukit app container. The app images run one binary and need neither.
  condition: >
    spawned_process
    and baukit_app_container
    and proc.name in (shell_binaries, package_mgmt_binaries)
  output: Shell or package manager started in a baukit app container | process=%proc.name command=%proc.cmdline parent=%proc.pname user=%user.name baukit_process=%k8s.pod.label[baukit.dev/process] k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name container=%container.name image=%container.image.repository:%container.image.tag
  priority: CRITICAL
  tags: [baukit, baukit_app, container, process, mitre_execution, T1059]

- rule: Baukit unexpected process in api or worker
  desc: A process other than the image entrypoint started in an api or worker container.
  condition: >
    spawned_process
    and baukit_serving_container
    and proc.vpid != 1
  output: Unexpected process in a baukit serving container | process=%proc.name command=%proc.cmdline parent=%proc.pname user=%user.name baukit_process=%k8s.pod.label[baukit.dev/process] k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name container=%container.name image=%container.image.repository:%container.image.tag
  priority: WARNING
  tags: [baukit, baukit_app, container, process, mitre_execution, T1059]

- rule: Baukit migration outbound connection
  desc: A migration job connected to something other than PostgreSQL or DNS.
  condition: >
    evt.type = connect
    and (fd.typechar = 4 or fd.typechar = 6)
    and baukit_migration_container
    and fd.net != "127.0.0.0/8"
    and not fd.rport in (5432, 53)
  output: Baukit migration job opened an unexpected connection | connection=%fd.name rport=%fd.rport process=%proc.name command=%proc.cmdline k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name container=%container.name image=%container.image.repository:%container.image.tag
  priority: CRITICAL
  tags: [baukit, baukit_app, container, network, mitre_exfiltration, T1041]

# The baukit-app chart sets automountServiceAccountToken: false, so an app process has no reason to
# look for a token. Failed opens count too: the attempt is the signal. runc probes the mount point while
# it starts every container (FA live run, 2026-11-14), so runc itself is excluded.
- rule: Baukit service account token access in app container
  desc: A baukit app process tried to open the Kubernetes service account directory.
  condition: >
    evt.type in (open, openat, openat2)
    and baukit_app_container
    and not proc.name startswith runc
    and (fs.path.name startswith /var/run/secrets/kubernetes.io or fs.path.name startswith /run/secrets/kubernetes.io)
  output: Baukit app process tried to read a service account token | path=%fs.path.name result=%evt.res process=%proc.name command=%proc.cmdline k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name container=%container.name image=%container.image.repository:%container.image.tag
  priority: CRITICAL
  tags: [baukit, baukit_app, container, filesystem, mitre_credential_access, T1528]

- rule: Baukit write below etc or usr in app container
  desc: A baukit app process opened a file for writing below /etc or /usr.
  condition: >
    evt.type in (open, openat, openat2)
    and evt.is_open_write = true
    and baukit_app_container
    and (fs.path.name startswith /etc/ or fs.path.name startswith /usr/)
  output: Baukit app process wrote below /etc or /usr | path=%fs.path.name result=%evt.res process=%proc.name command=%proc.cmdline k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name container=%container.name image=%container.image.repository:%container.image.tag
  priority: ERROR
  tags: [baukit, baukit_app, container, filesystem, mitre_persistence, T1543]

- rule: Baukit exec into protected platform namespace
  desc: kubectl exec or attach started a process in postgres, kyverno or flux-system.
  condition: >
    baukit_runtime_exec
    and k8s.ns.name in (baukit_exec_protected_namespaces)
    and not baukit_cnpg_runtime_exec
    and not baukit_flux_controller_child
    and not baukit_kyverno_legacy_check
  output: Process started by kubectl exec or attach in a protected platform namespace | process=%proc.name command=%proc.cmdline user=%user.name terminal=%proc.tty k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name container=%container.name image=%container.image.repository:%container.image.tag
  priority: CRITICAL
  tags: [baukit, baukit_platform, container, process, mitre_execution, T1609]

- rule: Baukit terminal shell in platform namespace
  desc: An interactive shell started in a platform namespace.
  condition: >
    baukit_runtime_exec
    and shell_procs
    and proc.tty != 0
    and k8s.ns.name in (baukit_platform_namespaces)
  output: Terminal shell in a platform namespace | process=%proc.name command=%proc.cmdline user=%user.name terminal=%proc.tty k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name container=%container.name image=%container.image.repository:%container.image.tag
  priority: WARNING
  tags: [baukit, baukit_platform, container, shell, mitre_execution, T1059]

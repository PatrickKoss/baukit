[tools]
java = "temurin-25.0.4+101.0.LTS"
node = { version = "26.10.0", postinstall = "npm install --global --prefix \"$MISE_TOOL_INSTALL_PATH\" corepack@0.36.0" }
rust = { version = "1.99.0", components = "clippy,rustfmt" }
swift = "6.4.0"
"github:xtool-org/xtool" = { version = "1.20.1", asset_pattern = "xtool-x86_64.AppImage", postinstall = "cd \"$MISE_TOOL_INSTALL_PATH\" && ./xtool.AppImage --appimage-extract >/dev/null && printf '#!/bin/sh\nexec \"$(dirname \"$(readlink -f \"$0\")\")/squashfs-root/AppRun\" \"$@\"\n' > xtool && chmod +x xtool" }

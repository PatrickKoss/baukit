[package]
name = "baukit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
aws-lc-rs = "1.18.1"
base64 = "0.23.1"
pem = "4.0.0"
axum = "0.8.9"
baukit-auth = { path = "../crates/baukit-auth", features = ["browser-session", "fuzzing"] }
baukit-core = { path = "../crates/baukit-core", features = ["media-grants", "webhook-signature"] }
baukit-data-subject = { path = "../crates/baukit-data-subject", default-features = false }
baukit-egress = { path = "../crates/baukit-egress" }
baukit-erasure = { path = "../crates/baukit-erasure", features = ["api-providers", "keycloak"] }
baukit-events = { path = "../crates/baukit-events" }
baukit-http = { path = "../crates/baukit-http" }
baukit-integrations = { path = "../crates/baukit-integrations", features = ["oauth-state"] }
baukit-mcp = { path = "../crates/baukit-mcp" }
baukit-push = { path = "../crates/baukit-push" }
baukit-ratelimit = { path = "../crates/baukit-ratelimit" }
baukit-suite = { path = "../crates/baukit-suite", features = ["platform"] }
baukit-sync = { path = "../crates/baukit-sync", default-features = false }
baukit-test = { path = "../crates/baukit-test", default-features = false }
jiff = { version = "1.0.0", features = ["serde"] }
http = "1.5.0"
percent-encoding = "2.3.2"
url = "2.5.8"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
uuid = "1"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
debug = 1

[[bin]]
name = "jwt_verify"
path = "fuzz_targets/jwt_verify.rs"
test = false
doc = false
bench = false


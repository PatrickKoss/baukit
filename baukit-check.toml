# Settings for `baukit check`. Limits may only go down; see lint/README.md.

[file_size]
rust-max-lines = 1000
ts-max-lines = 500

# Files over the limit when the rule landed. Entries only shrink: split a file and drop its entry.
[file_size.allowlist]
"examples/expo-sqlite-conformance/src/conformance.ts" = 1174
"rust/crates/baukit-auth/src/api_token.rs" = 1822
"rust/crates/baukit-suite/src/adapters/http.rs" = 1033
"rust/crates/baukit-test/src/data_subject_conformance.rs" = 1026
"rust/crates/baukit-test/src/jwt.rs" = 1031
"typescript/packages/auth-native/src/index.ts" = 542
"typescript/packages/auth-node/src/device-flow.ts" = 524
"typescript/packages/auth-web/src/silent-token-broker.ts" = 543
"typescript/packages/data-contracts/src/durable-draft.ts" = 502

# Suppression budget. Counts may only go down; `baukit check suppressions --update` lowers them.
[suppressions.max]
rust-allow = 0
rust-expect = 30
eslint-disable = 1
ast-grep-ignore = 0
ts-expect-error = 7
ts-ignore = 0
prettier-ignore = 0
noqa = 4
type-ignore = 2
nosec = 0
shellcheck-disable = 4
nolint = 0

# `baukit check observability`: baukit's own dashboards and rules use only catalog metrics.
[observability]
dashboards = ["deploy/observability/dashboards"]
rules = ["deploy/observability/alerts", "deploy/observability/recording-rules"]

# The platform pack queries third-party metrics only, from its exact allowlist.
[[observability.packs]]
dashboards = ["deploy/observability-platform/dashboards"]
rules = ["deploy/observability-platform/alerts", "deploy/observability-platform/recording-rules"]
metrics = ["deploy/observability-platform/metrics.txt"]
catalog = false

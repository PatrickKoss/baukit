apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.6.5"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: true

    # K3s embeds these control-plane components and does not expose the
    # standalone scrape targets expected by kube-prometheus-stack.
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false

    alertmanager:
      enabled: true
      # The base drops every alert. An overlay replaces this config with its
      # identity-bearing receiver and preserves a deliberate dead-man route.
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by:
            - namespace
            - alertname
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
        receivers:
          - name: "null"
      alertmanagerSpec:
        image:
          sha: 5f6e66c01bd610aef6dd671642a52eee775fd3a89bd8788ebada33efaf373d10
          tag: v0.35.0
        replicas: 1
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi

    grafana:
      image:
        sha: 0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
        tag: "13.3.1"
      enabled: true
      replicas: 1
      # The overlay creates this Secret with admin-user and admin-password.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 384Mi
      sidecar:
        image:
          sha: 52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
          tag: 2.14.3
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 96Mi
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          annotations:
            grafana_folder: Kubernetes
          provider:
            foldersFromFilesStructure: true
        datasources:
          enabled: true
          defaultDatasourceEnabled: true
          uid: prometheus
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki-gateway.observability.svc.cluster.local
          editable: false
          jsonData:
            derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id":"([a-f0-9]+)"'
                datasourceUid: tempo
                url: '${__value.raw}'
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo.observability.svc.cluster.local:3200
          editable: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: -5m
              spanEndTimeShift: 5m
              filterByTraceID: true
              filterBySpanID: false
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true

    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      image:
        sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
        tag: v2.20.0
      replicas: 1
      # Platform alerts select namespaces by this label through kube_namespace_labels.
      metricLabelsAllowlist:
        - namespaces=[app.kubernetes.io/part-of]
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 192Mi

    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      image:
        digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
        distroless: true
        tag: v1.12.1
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 150m
          memory: 96Mi

    prometheusOperator:
      thanosImage:
        sha: b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
        tag: v0.42.4
      image:
        sha: e52bb28fd41c98dd407c7a8cba8bdcfe7eabd7447e250afaf1fe7bb816dedbff
        tag: v0.93.1
      enabled: true
      admissionWebhooks:
        patch:
          image:
            sha: 8009b04f9873f7279b5adee37fdd03b6a9aa7b6751d4f69fde2683010e41cd1f
            tag: 1.11.1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      prometheusConfigReloader:
        image:
          sha: 428f088fe6fe07ab138bda92113664b04848a1dc408e4d3680a60ecdb55d1a65
          tag: v0.93.1
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 384Mi

    prometheus:
      enabled: true
      prometheusSpec:
        image:
          sha: 9764044e09eb2c9e1abdb12d0f0188d4efb7384b0262d3c080f0fc59045c89ba
          tag: v3.16.0-distroless
        replicas: 1
        shards: 1
        # Metrics retention budget (§8.5): the single source of truth.
        retention: 30d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 30Gi
        ruleSelectorNilUsesHelmValues: false
        # Rules, ServiceMonitors and PodMonitors are read from every namespace
        # labelled app.kubernetes.io/part-of=baukit-platform.
        ruleSelector: {}
        ruleNamespaceSelector:
          matchLabels:
            app.kubernetes.io/part-of: baukit-platform
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector:
          matchLabels:
            app.kubernetes.io/part-of: baukit-platform
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector:
          matchLabels:
            app.kubernetes.io/part-of: baukit-platform

    thanosRuler:
      enabled: false

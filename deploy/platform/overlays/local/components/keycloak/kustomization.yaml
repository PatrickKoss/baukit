apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../keycloak
  - keycloak-database.yaml
patches:
  - target:
      group: k8s.keycloak.org
      version: v2beta1
      kind: Keycloak
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/resources/limits/cpu
        value: 600m
      - op: replace
        path: /spec/resources/limits/memory
        value: 896Mi
      - op: add
        path: /spec/http
        value:
          httpEnabled: true
          httpPort: 8080
          serviceHttpPort: 8080
      - op: add
        path: /spec/hostname
        value:
          hostname: http://keycloak-service.keycloak.svc.cluster.local:8080
          strict: true
          backchannelDynamic: true

# The ServiceMonitors and Policy Reporter need the monitoring CRDs. Kyverno and its policies don't wait for them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: e2e-kyverno-monitoring
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: e2e-kyverno-policies
    - name: e2e-observability
  interval: 10m
  retryInterval: 30s
  timeout: 10m
  path: ./deploy/platform/kyverno-monitoring
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: baukit
---
# The MetricTemplate CRD comes from the chart, so the templates apply in e2e-flagger-metrics.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: e2e-flagger
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: e2e-observability
    - name: e2e-traefik
  interval: 10m
  retryInterval: 30s
  timeout: 15m
  path: ./deploy/platform/e2e/overlay/components/flagger
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: baukit
  patches:
    - target:
        group: flagger.app
        version: v1beta1
        kind: MetricTemplate
        labelSelector: baukit.dev/component=progressive-delivery
      patch: |-
        $patch: delete
        apiVersion: flagger.app/v1beta1
        kind: MetricTemplate
        metadata:
          name: ignored
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: e2e-flagger-metrics
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: e2e-flagger
  interval: 10m
  retryInterval: 30s
  timeout: 5m
  path: ./deploy/platform/e2e/overlay/components/flagger
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: baukit
  patches:
    - target:
        version: v1
        kind: Namespace
        name: flagger-system
      patch: |-
        $patch: delete
        apiVersion: v1
        kind: Namespace
        metadata:
          name: flagger-system
    - target:
        group: source.toolkit.fluxcd.io
        version: v1
        kind: HelmRepository
        name: flagger
        namespace: flagger-system
      patch: |-
        $patch: delete
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: HelmRepository
        metadata:
          name: flagger
          namespace: flagger-system
    - target:
        group: helm.toolkit.fluxcd.io
        version: v2
        kind: HelmRelease
        name: flagger
        namespace: flagger-system
      patch: |-
        $patch: delete
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: flagger
          namespace: flagger-system
---

# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: flux-tenancy
spec:
  description: >-
    A tenant namespace built from components/tenant reconciles as its flux-reconciler service account.
    The component's Kustomization writes into the tenant namespace. A Kustomization the tenant writes
    itself with targetNamespace flux-system is forbidden, and a remote base is refused. The reconciler
    manages the Flagger, Traefik and ServiceMonitor kinds baukit-app products ship, and the tenant
    Kyverno guards refuse a ServiceMonitor, MetricTemplate, IngressRoute or forwardAuth that reaches
    out of the namespace or spoofs its namespace label. Flagger's -primary copy of a labelled tenant
    Deployment passes require-baukit-labels. Prometheus writes the tenant's namespace
    label after the tenant's relabelings, and every non-tenant namespace with monitors or rules is
    excluded from that enforcement. A tenant ServiceMonitor in a namespace without the platform label
    is scraped, and a spoofed exporter namespace label is stored as the tenant namespace. Needs the
    controllers installed with components/flux-lockdown and the snapshot server at BAUKIT_E2E_GIT_URL
    (default http://host.k3d.internal:9418/baukit.git).
  timeouts:
    apply: 1m
    exec: 4m
  steps:
    - name: create-tenant-from-component
      try:
        - script:
            content: |
              set -eu
              dir=$(mktemp -d)
              trap 'rm -rf "$dir"' EXIT
              cp -R ../../../components/tenant "$dir/tenant-component"
              git_url=${BAUKIT_E2E_GIT_URL:-http://host.k3d.internal:9418/baukit.git}
              cat >"$dir/kustomization.yaml" <<YAML
              apiVersion: kustomize.config.k8s.io/v1beta1
              kind: Kustomization
              namespace: $NAMESPACE
              resources:
                - tenant.yaml
              components:
                - tenant-component
              YAML
              cat >"$dir/tenant.yaml" <<YAML
              apiVersion: v1
              kind: Namespace
              metadata:
                name: $NAMESPACE
              ---
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: baukit-tenant
                annotations:
                  config.kubernetes.io/local-config: "true"
              data:
                sopsSecretName: sops-age-tenant
                sopsAgeRecipient: age1qyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqs3290gq
              ---
              apiVersion: v1
              kind: Secret
              metadata:
                name: sops-age-tenant
              stringData:
                age.agekey: ""
              ---
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: GitRepository
              metadata:
                name: baukit
              spec:
                interval: 1m
                timeout: 1m
                url: $git_url
                ref:
                  branch: main
              YAML
              for case in own-namespace remote-base; do
                cat >>"$dir/tenant.yaml" <<YAML
              ---
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: $case
              spec:
                interval: 1m
                retryInterval: 15s
                timeout: 1m
                path: ./deploy/platform/e2e/tests/flux-tenancy/payload/$case
                prune: true
                sourceRef:
                  kind: GitRepository
                  name: baukit
              YAML
              done
              kubectl kustomize "$dir" | kubectl apply -f -
              kubectl apply -f - <<YAML
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: into-flux-system
                namespace: $NAMESPACE
              spec:
                interval: 1m
                retryInterval: 15s
                timeout: 1m
                path: ./deploy/platform/e2e/tests/flux-tenancy/payload/flux-system
                prune: true
                serviceAccountName: flux-reconciler
                targetNamespace: flux-system
                sourceRef:
                  kind: GitRepository
                  name: baukit
              YAML
    - name: own-namespace-reconciles
      catch:
        - script:
            content: kubectl -n "$NAMESPACE" get gitrepositories,kustomizations -o yaml
      try:
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" wait kustomization/own-namespace --for=condition=Ready --timeout=3m >/dev/null
              kubectl -n "$NAMESPACE" get configmap flux-tenancy-probe -o jsonpath='{.data.written-by}'
            check:
              ($stdout): tenant
    - name: flux-system-write-is-forbidden
      catch:
        - script:
            content: kubectl -n "$NAMESPACE" get gitrepositories,kustomizations -o yaml
      try:
        - script:
            content: |
              set -eu
              for _ in $(seq 36); do
                message=$(kubectl -n "$NAMESPACE" get kustomization into-flux-system \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}')
                case $message in
                  *forbidden*"system:serviceaccount:$NAMESPACE:flux-reconciler"*) printf forbidden; exit 0 ;;
                esac
                sleep 5
              done
              printf 'unexpected Ready message: %s\n' "$message" >&2
              exit 1
            check:
              ($stdout): forbidden
        - script:
            content: kubectl -n flux-system get configmap flux-tenancy-probe
            check:
              ($error != null): true
    - name: remote-base-is-refused
      catch:
        - script:
            content: kubectl -n "$NAMESPACE" get gitrepositories,kustomizations -o yaml
      try:
        - script:
            content: |
              set -eu
              for _ in $(seq 36); do
                message=$(kubectl -n "$NAMESPACE" get kustomization remote-base \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}')
                case $message in
                  *"kustomize build failed"*"github.com/fluxcd"*"fs-security-constraint"*) printf refused; exit 0 ;;
                esac
                sleep 5
              done
              printf 'unexpected Ready message: %s\n' "$message" >&2
              exit 1
            check:
              ($stdout): refused
    - name: tenant-admin-manages-chart-kinds
      try:
        - script:
            content: |
              set -eu
              as=system:serviceaccount:e2e-tenant:flux-reconciler
              for resource in canaries.flagger.app metrictemplates.flagger.app \
                ingressroutes.traefik.io middlewares.traefik.io traefikservices.traefik.io \
                servicemonitors.monitoring.coreos.com; do
                for verb in get list watch create update patch delete deletecollection; do
                  kubectl auth can-i "$verb" "$resource" -n e2e-tenant --as="$as" >/dev/null ||
                    { printf '%s cannot %s %s\n' "$as" "$verb" "$resource" >&2; exit 1; }
                done
                if kubectl auth can-i create "$resource" -n flux-system --as="$as" >/dev/null; then
                  printf '%s can create %s in flux-system\n' "$as" "$resource" >&2
                  exit 1
                fi
              done
              printf granted
            check:
              ($stdout): granted
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" apply --as="system:serviceaccount:$NAMESPACE:flux-reconciler" -f - >/dev/null <<YAML
              apiVersion: flagger.app/v1beta1
              kind: MetricTemplate
              metadata:
                name: error-rate
              spec:
                provider:
                  type: prometheus
                  address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
                query: sum(rate(http_requests_total{namespace="{{ namespace }}", status=~"5.."}[{{ interval }}]))
              ---
              apiVersion: flagger.app/v1beta1
              kind: Canary
              metadata:
                name: api
              spec:
                provider: traefik
                targetRef:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: api
                service:
                  port: 80
                analysis:
                  interval: 1m
                  threshold: 1
                  stepWeights: [50]
                  metrics:
                    - name: error-rate
                      templateRef:
                        name: error-rate
                      thresholdRange:
                        max: 1
              ---
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: rate-limit
              spec:
                rateLimit:
                  average: 10
                  burst: 20
              ---
              apiVersion: traefik.io/v1alpha1
              kind: TraefikService
              metadata:
                name: api
              spec:
                weighted:
                  services:
                    - name: api
                      port: 80
                      weight: 100
              ---
              apiVersion: traefik.io/v1alpha1
              kind: IngressRoute
              metadata:
                name: api
              spec:
                entryPoints: [websecure]
                routes:
                  - kind: Rule
                    match: Host(\`$NAMESPACE.flux-tenancy.invalid\`)
                    middlewares:
                      - name: rate-limit
                    services:
                      - kind: TraefikService
                        name: api
              ---
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: api
              spec:
                selector:
                  matchLabels:
                    app.kubernetes.io/name: api
                endpoints:
                  - port: metrics
              YAML
              count=$(kubectl -n "$NAMESPACE" get canaries,metrictemplates,ingressroutes,middlewares,traefikservices,servicemonitors \
                -o name | wc -l)
              printf '%d' "$count"
            check:
              ($stdout): "6"
    - name: flagger-primary-passes-tenant-policies
      try:
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" apply --as="system:serviceaccount:$NAMESPACE:flux-reconciler" -f - >/dev/null <<YAML
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: labelled
                labels:
                  app.kubernetes.io/name: labelled
                  app.kubernetes.io/part-of: e2e-flux-tenancy
                  baukit.dev/process: api
              spec:
                selector:
                  matchLabels:
                    baukit.dev/workload: labelled
                template:
                  metadata:
                    labels:
                      baukit.dev/workload: labelled
                  spec:
                    automountServiceAccountToken: false
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 101
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: app
                        image: localhost/baukit-e2e/echo:local
                        imagePullPolicy: Never
                        ports:
                          - name: http
                            containerPort: 8080
                        resources:
                          requests: {cpu: 10m, memory: 16Mi}
                          limits: {cpu: 50m, memory: 32Mi}
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: [ALL]
                        readinessProbe:
                          httpGet: {path: /ready, port: http}
                        livenessProbe:
                          httpGet: {path: /live, port: http}
              ---
              apiVersion: flagger.app/v1beta1
              kind: Canary
              metadata:
                name: labelled
              spec:
                provider: traefik
                targetRef:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: labelled
                service:
                  port: 80
                  targetPort: http
                analysis:
                  interval: 1m
                  threshold: 1
                  stepWeights: [50]
              YAML
              deadline=$(($(date +%s) + 180))
              while ! kubectl -n "$NAMESPACE" get deployment labelled-primary >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  printf 'Flagger created no labelled-primary Deployment\n' >&2
                  kubectl -n flagger-system logs deployment/flagger --since=5m 2>&1 |
                    grep -F "labelled-primary.$NAMESPACE" | tail -n 3 >&2 || true
                  exit 1
                fi
                sleep 5
              done
              kubectl -n "$NAMESPACE" get deployment labelled-primary \
                -o jsonpath='{.metadata.labels.app\.kubernetes\.io/name}/{.metadata.labels.app\.kubernetes\.io/part-of}/{.metadata.labels.baukit\.dev/process}'
            check:
              ($stdout): labelled/e2e-flux-tenancy/api
    - name: tenant-guards-deny-escapes
      try:
        - script:
            content: |
              set -eu
              as="system:serviceaccount:$NAMESPACE:flux-reconciler"
              expect_denied() {
                policy=$1
                if output=$(kubectl -n "$NAMESPACE" apply --dry-run=server --as="$as" -f - 2>&1); then
                  printf '%s admitted:\n%s\n' "$policy" "$output" >&2
                  exit 1
                fi
                case $output in
                  *"$policy"*) ;;
                  *) printf '%s: unexpected error: %s\n' "$policy" "$output" >&2; exit 1 ;;
                esac
              }
              expect_denied restrict-tenant-servicemonitors <<YAML
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: everywhere
              spec:
                namespaceSelector:
                  any: true
                selector: {}
                endpoints:
                  - port: metrics
              YAML
              expect_denied restrict-tenant-metric-templates <<YAML
              apiVersion: flagger.app/v1beta1
              kind: MetricTemplate
              metadata:
                name: elsewhere
              spec:
                provider:
                  type: prometheus
                  address: http://kubernetes.default.svc
                query: vector(0)
              YAML
              expect_denied restrict-tenant-servicemonitors <<YAML
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: honored
              spec:
                selector: {}
                endpoints:
                  - port: metrics
                    honorLabels: true
              YAML
              expect_denied restrict-tenant-servicemonitors <<YAML
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: spoofed-namespace
              spec:
                selector: {}
                endpoints:
                  - port: metrics
                    metricRelabelings:
                      - targetLabel: namespace
                        replacement: flagger-system
              YAML
              expect_denied restrict-tenant-servicemonitors <<YAML
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: mapped-labels
              spec:
                selector: {}
                endpoints:
                  - port: metrics
                    relabelings:
                      - action: labelmap
                        regex: __meta_kubernetes_pod_label_(.+)
              YAML
              expect_denied restrict-tenant-metric-templates <<YAML
              apiVersion: flagger.app/v1beta1
              kind: MetricTemplate
              metadata:
                name: every-namespace
              spec:
                provider:
                  type: prometheus
                query: sum(rate(http_requests_total{product="leitbild"}[1m]))
              YAML
              expect_denied restrict-tenant-traefik-routes <<YAML
              apiVersion: traefik.io/v1alpha1
              kind: IngressRoute
              metadata:
                name: pattern-host
              spec:
                entryPoints: [websecure]
                routes:
                  - kind: Rule
                    match: HostRegexp(\`^.+\\.example\\.test$\`)
                    services:
                      - name: api
                        port: 80
              YAML
              expect_denied restrict-tenant-traefik-routes <<YAML
              apiVersion: traefik.io/v1alpha1
              kind: Middleware
              metadata:
                name: foreign-auth
              spec:
                forwardAuth:
                  address: http://grafana.observability.svc.cluster.local/api
              YAML
              printf denied
            check:
              ($stdout): denied
    - name: namespace-label-is-enforced
      try:
        - script:
            content: |
              set -eu
              excluded=$(kubectl -n observability get prometheus kube-prometheus-stack-prometheus \
                -o jsonpath='{range .spec.excludedFromEnforcement[*]}{.resource}/{.namespace}{"\n"}{end}')
              tenants=$(kubectl get namespaces -l baukit.dev/tenant=true -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
              missing=""
              for resource in servicemonitors podmonitors prometheusrules; do
                for namespace in $(kubectl get "$resource.monitoring.coreos.com" -A \
                  -o jsonpath='{range .items[*]}{.metadata.namespace}{"\n"}{end}' | sort -u); do
                  case $namespace in chainsaw-*) continue ;; esac
                  printf '%s\n' "$tenants" | grep -qx "$namespace" && continue
                  printf '%s\n' "$excluded" | grep -qx "$resource/$namespace" ||
                    missing="$missing $resource/$namespace"
                done
              done
              if [ -n "$missing" ]; then
                printf 'platform monitors outside excludedFromEnforcement:%s\n' "$missing" >&2
                exit 1
              fi
              printf covered
            check:
              ($stdout): covered
        - script:
            content: |
              set -eu
              kubectl -n e2e-tenant apply --as=system:serviceaccount:e2e-tenant:flux-reconciler -f - >/dev/null <<YAML
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: flux-tenancy-enforced
              spec:
                selector:
                  matchLabels:
                    app.kubernetes.io/instance: echo
                    baukit.dev/endpoint: ops
                endpoints:
                  - port: metrics
                    relabelings:
                      - targetLabel: team
                        replacement: e2e
                    metricRelabelings:
                      - action: labeldrop
                        regex: debug_.*
              YAML
              job=serviceMonitor/e2e-tenant/flux-tenancy-enforced/0
              for _ in $(seq 60); do
                config=$(kubectl -n observability get secret prometheus-kube-prometheus-stack-prometheus \
                  -o jsonpath='{.data.prometheus\.yaml\.gz}' | base64 -d | gunzip)
                if printf '%s' "$config" | JOB=$job python3 -c '
              import os, re, sys
              config = sys.stdin.read()
              start = config.find("- job_name: " + os.environ["JOB"] + "\n")
              if start < 0:
                  sys.exit(1)
              end = config.find("\n- job_name: ", start + 1)
              job = config[start : end if end > 0 else len(config)]
              def entries(section):
                  body = job.partition(section + ":\n")[2]
                  lines = []
                  for line in body.split("\n"):
                      if not line.startswith(("  - ", "    ")):
                          break
                      lines.append(line)
                  return re.split(r"\n  - ", "\n" + "\n".join(lines))[1:]
              def enforced_after(section, marker):
                  items = entries(section)
                  first = next((i for i, e in enumerate(items) if marker in e), None)
                  return first is not None and any(
                      "target_label: namespace" in e and "replacement: e2e-tenant" in e
                      for e in items[first + 1 :]
                  )
              ok = enforced_after("relabel_configs", "target_label: team") and enforced_after(
                  "metric_relabel_configs", "debug_"
              )
              sys.exit(0 if ok else 2)
              '; then
                  printf enforced
                  exit 0
                fi
                sleep 2
              done
              printf '%s has no namespace label enforced after its relabelings:\n' "$job" >&2
              printf '%s' "$config" | grep -A60 -- "- job_name: $job" >&2 || true
              exit 1
            check:
              ($stdout): enforced
        - script:
            content: |
              set -eu
              # e2e-tenant carries only the tenant label, like a product namespace. The echo exporter
              # emits baukit_e2e_echo_up{namespace="spoofed"}; the stored series must say e2e-tenant.
              api=/api/v1/namespaces/observability/services/kube-prometheus-stack-prometheus:9090/proxy/api/v1
              pool=serviceMonitor/e2e-tenant/flux-tenancy-enforced/0
              for _ in $(seq 75); do
                targets=$(kubectl get --raw "$api/targets?state=active&scrapePool=$pool" 2>/dev/null || true)
                series=$(kubectl get --raw "$api/query?query=baukit_e2e_echo_up%7Bjob%3D%22echo-ops%22%7D" 2>/dev/null || true)
                if TARGETS=$targets SERIES=$series python3 -c '
              import json, os, sys
              try:
                  targets = json.loads(os.environ["TARGETS"])["data"]["activeTargets"]
                  series = json.loads(os.environ["SERIES"])["data"]["result"]
              except (ValueError, KeyError):
                  sys.exit(1)
              up = any(t["health"] == "up" for t in targets)
              ours = [s["metric"] for s in series if s["metric"].get("team") == "e2e"]
              sys.exit(0 if up and ours and all(m.get("namespace") == "e2e-tenant" for m in ours) else 1)
              '; then
                  printf scraped
                  exit 0
                fi
                sleep 2
              done
              printf 'tenant target not up or namespace not enforced\ntargets: %s\nseries: %s\n' "$targets" "$series" >&2
              exit 1
            check:
              ($stdout): scraped
      finally:
        - script:
            content: kubectl -n e2e-tenant delete servicemonitor flux-tenancy-enforced --ignore-not-found

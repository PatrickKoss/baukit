apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: k3s-coredns
  namespace: kyverno
  labels:
    app.kubernetes.io/part-of: baukit-platform
  annotations:
    baukit.dev/reason: >-
      k3s deploys CoreDNS from its embedded manifests in kube-system; the platform renders no values for it.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-capabilities-strict
    - kind: ValidatingPolicy
      name: require-container-resources
    - kind: ValidatingPolicy
      name: require-run-as-nonroot
    - kind: ValidatingPolicy
      name: restrict-seccomp-strict
  matchConditions:
    - name: workload
      expression: >-
        object.metadata.?namespace.orValue("") == "kube-system" && (
          (object.kind == "Deployment" && object.metadata.name == "coredns") ||
          (object.kind == "ReplicaSet" && object.metadata.?ownerReferences.orValue([])
            .exists(o, o.kind == "Deployment" && o.name == "coredns")) ||
          (object.kind == "Pod" && object.metadata.?ownerReferences.orValue([])
            .exists(o, o.kind == "ReplicaSet" &&
              o.name == "coredns-" + object.metadata.?labels[?"pod-template-hash"].orValue(""))))

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../kured
  - ../../cluster-network
  - network-policy.yaml
components:
  - ../../../../components/network-policy/node-cidr
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: kured
    patch: |-
      - op: replace
        path: /spec/values/configuration/notifyUrl
        value: generic://alert-sink.observability.svc.cluster.local:8080/alerts?template=json&disabletls=yes

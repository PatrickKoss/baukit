# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-postgres
spec:
  description: >-
    The e2e-tenant flux-reconciler creates a dedicated CNPG Cluster with a Barman ObjectStore, an
    ImageCatalog, a ScheduledBackup and the NetworkPolicy of the generated backing/postgres-dedicated
    component. The operator reaches the instance, the instance archives WAL to rustfs, its CNPG app
    Secret carries a uri, and an on-demand backup completes, all under the tenant's Kyverno policies
    and default-deny. On the shared postgres-cluster, a tenant owner from product-database.example.yaml
    reaches its own database and pg_hba rejects it on another tenant's database and on postgres.
  timeouts:
    exec: 25m
  steps:
    - name: shared-database-isolation
      try:
        - script:
            timeout: 8m
            content: |
              set -eu
              ns=e2e-shared-pg
              image="$(kubectl -n postgres get cluster postgres-cluster -o jsonpath='{.status.image}')"
              kubectl apply -f - <<YAML
              apiVersion: v1
              kind: Namespace
              metadata:
                name: $ns
                labels:
                  baukit.dev/tenant: "true"
                  baukit.dev/postgres-client: "true"
                  pod-security.kubernetes.io/enforce: restricted
                  pod-security.kubernetes.io/enforce-version: v1.37
                  pod-security.kubernetes.io/audit: restricted
                  pod-security.kubernetes.io/warn: restricted
              YAML
              for k8s in e2e-iso-a e2e-iso-b; do
                tenant="$(printf %s "$k8s" | tr - _)"
                kubectl -n postgres create secret generic "${k8s}-db" --type=kubernetes.io/basic-auth \
                  --from-literal=username="${tenant}_owner" --from-literal=password="$(openssl rand -hex 18)" \
                  --dry-run=client -o yaml | kubectl apply -f -
                kubectl apply -f - <<YAML
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: ${k8s}-database
                namespace: postgres
              spec:
                cluster: {name: postgres-cluster}
                name: $tenant
                login: false
                databaseRoleReclaimPolicy: delete
              ---
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: ${k8s}-owner
                namespace: postgres
              spec:
                cluster: {name: postgres-cluster}
                name: ${tenant}_owner
                login: true
                inRoles: [baukit_tenants, $tenant]
                databaseRoleReclaimPolicy: delete
                passwordSecret: {name: ${k8s}-db}
              ---
              apiVersion: postgresql.cnpg.io/v1
              kind: Database
              metadata:
                name: $k8s
                namespace: postgres
              spec:
                cluster: {name: postgres-cluster}
                name: $tenant
                owner: ${tenant}_owner
                databaseReclaimPolicy: delete
              YAML
              done
              for object in databaserole/e2e-iso-a-database databaserole/e2e-iso-a-owner database/e2e-iso-a \
                databaserole/e2e-iso-b-database databaserole/e2e-iso-b-owner database/e2e-iso-b; do
                kubectl -n postgres wait "$object" --for=jsonpath='{.status.applied}'=true --timeout=3m
              done
              kubectl -n postgres get secret e2e-iso-a-db -o json |
                python3 -c 'import json,sys; s=json.load(sys.stdin); print(json.dumps({"apiVersion":"v1","kind":"Secret","metadata":{"name":"e2e-iso-a-db"},"type":s["type"],"data":s["data"]}))' |
                kubectl -n "$ns" apply -f -

              kubectl apply -f - <<YAML
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: allow-shared-postgres
                namespace: $ns
              spec:
                podSelector: {}
                policyTypes: [Egress]
                egress:
                  - to:
                      - namespaceSelector:
                          matchLabels:
                            kubernetes.io/metadata.name: postgres
                        podSelector:
                          matchLabels:
                            cnpg.io/cluster: postgres-cluster
                    ports:
                      - {protocol: TCP, port: 5432}
              ---
              apiVersion: v1
              kind: Pod
              metadata:
                name: isolation-probe
                namespace: $ns
                labels:
                  baukit.dev/postgres-client: "true"
              spec:
                restartPolicy: Never
                activeDeadlineSeconds: 300
                automountServiceAccountToken: false
                enableServiceLinks: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 26
                  runAsGroup: 26
                  seccompProfile: {type: RuntimeDefault}
                containers:
                  - name: psql
                    image: $image
                    command: [bash, -ec]
                    args:
                      - |
                        connect() { psql -XtAq -v ON_ERROR_STOP=1 -d "\$1" -c 'select current_database()' 2>&1; }
                        deadline=\$((\$(date +%s) + 180))
                        until out="\$(connect e2e_iso_a)"; do
                          [ "\$(date +%s)" -lt "\$deadline" ] || { printf 'own database refused: %s\n' "\$out"; exit 1; }
                          sleep 3
                        done
                        printf 'own database: %s\n' "\$out"
                        for db in e2e_iso_b postgres; do
                          if out="\$(connect "\$db")"; then printf '%s reachable: %s\n' "\$db" "\$out"; exit 1; fi
                          case "\$out" in
                            *'pg_hba.conf rejects connection'*) printf '%s refused by pg_hba\n' "\$db" ;;
                            *) printf '%s failed for another reason: %s\n' "\$db" "\$out"; exit 1 ;;
                          esac
                        done
                    env:
                      - {name: PGHOST, value: postgres-cluster-rw.postgres}
                      - {name: PGSSLMODE, value: require}
                      - {name: PGCONNECT_TIMEOUT, value: "3"}
                      - name: PGUSER
                        valueFrom: {secretKeyRef: {name: e2e-iso-a-db, key: username}}
                      - name: PGPASSWORD
                        valueFrom: {secretKeyRef: {name: e2e-iso-a-db, key: password}}
                    resources:
                      requests: {cpu: 10m, memory: 32Mi}
                      limits: {cpu: 200m, memory: 128Mi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
              YAML
              deadline=$(($(date +%s) + 300))
              until phase="$(kubectl -n "$ns" get pod isolation-probe -o jsonpath='{.status.phase}')" &&
                { [ "$phase" = Succeeded ] || [ "$phase" = Failed ]; }; do
                [ "$(date +%s)" -lt "$deadline" ] || { kubectl -n "$ns" describe pod isolation-probe >&2; exit 1; }
                sleep 3
              done
              kubectl -n "$ns" logs isolation-probe
              [ "$phase" = Succeeded ]
      catch:
        - script:
            content: |
              kubectl -n e2e-shared-pg get pods,networkpolicy -o wide
              kubectl -n e2e-shared-pg describe pod isolation-probe | tail -30
              kubectl -n postgres get databaserole,database -o wide
      finally:
        - script:
            timeout: 5m
            content: |
              kubectl delete namespace e2e-shared-pg --ignore-not-found --wait=true --timeout=3m
              kubectl -n postgres delete database e2e-iso-a e2e-iso-b --ignore-not-found --wait=true --timeout=2m
              kubectl -n postgres delete databaserole e2e-iso-a-owner e2e-iso-b-owner --ignore-not-found --wait=true --timeout=1m
              kubectl -n postgres delete databaserole e2e-iso-a-database e2e-iso-b-database --ignore-not-found --wait=true --timeout=1m
              kubectl -n postgres delete secret e2e-iso-a-db e2e-iso-b-db --ignore-not-found
    - name: dedicated-cluster-in-tenant
      try:
        - script:
            timeout: 20m
            content: |
              set -eu
              ns=e2e-tenant
              name=e2e-dedicated
              as=system:serviceaccount:$ns:flux-reconciler
              image="$(kubectl -n postgres get cluster postgres-cluster -o jsonpath='{.spec.imageName}')"
              endpoint="$(kubectl -n postgres get objectstore postgres-backups -o jsonpath='{.spec.configuration.endpointURL}')"
              bucket="$(kubectl -n postgres get objectstore postgres-backups -o jsonpath='{.spec.configuration.destinationPath}' |
                sed -E 's#^(s3://[^/]+)/.*#\1#')"
              node_ip="$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')"

              # rustfs is platform-owned; the test admits the tenant instance for its own lifetime.
              kubectl apply -f - <<YAML
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: e2e-tenant-postgres-to-rustfs
                namespace: postgres
              spec:
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: rustfs
                policyTypes: [Ingress]
                ingress:
                  - from:
                      - namespaceSelector:
                          matchLabels:
                            kubernetes.io/metadata.name: $ns
                        podSelector:
                          matchLabels:
                            cnpg.io/cluster: $name
                    ports:
                      - {protocol: TCP, port: 9000}
              YAML

              kubectl -n postgres get secret postgres-backup-credentials -o json |
                python3 -c 'import json,sys; s=json.load(sys.stdin); print(json.dumps({"apiVersion":"v1","kind":"Secret","metadata":{"name":"'"$name"'-backup"},"type":"Opaque","data":s["data"]}))' |
                kubectl -n "$ns" --as="$as" apply -f -

              major="$(kubectl -n postgres get imagecatalog postgresql -o jsonpath='{.spec.images[0].major}')"
              catalog_image="$(kubectl -n postgres get imagecatalog postgresql -o jsonpath='{.spec.images[0].image}')"
              kubectl -n "$ns" --as="$as" apply -f - <<YAML
              apiVersion: postgresql.cnpg.io/v1
              kind: ImageCatalog
              metadata:
                name: $name
              spec:
                images:
                  - major: $major
                    image: $catalog_image
              YAML
              kubectl -n "$ns" --as="$as" get imagecatalog "$name" -o name

              kubectl -n "$ns" --as="$as" apply -f - <<YAML
              apiVersion: barmancloud.cnpg.io/v1
              kind: ObjectStore
              metadata:
                name: $name-backups
              spec:
                instanceSidecarConfiguration:
                  env:
                    - name: AWS_DEFAULT_REGION
                      value: us-east-1
                  resources:
                    requests: {cpu: 25m, memory: 64Mi}
                    limits: {cpu: 200m, memory: 256Mi}
                configuration:
                  destinationPath: $bucket/e2e-tenant-postgres-$(date -u +%Y%m%dT%H%M%SZ)
                  endpointURL: $endpoint
                  s3Credentials:
                    accessKeyId: {name: $name-backup, key: ACCESS_KEY_ID}
                    secretAccessKey: {name: $name-backup, key: ACCESS_SECRET_KEY}
                  wal:
                    compression: gzip
                    archiveAdditionalCommandArgs: ["--addressing-style=path"]
                  data:
                    compression: gzip
                    additionalCommandArgs: ["--addressing-style=path"]
              ---
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: $name
              spec:
                instances: 1
                enablePDB: false
                imageName: $image
                enableSuperuserAccess: false
                inheritedMetadata:
                  labels:
                    app.kubernetes.io/part-of: e2e
                    baukit.dev/product: e2e
                    baukit.dev/process: postgres
                bootstrap:
                  initdb:
                    database: app
                    owner: app
                plugins:
                  - name: barman-cloud.cloudnative-pg.io
                    isWALArchiver: true
                    parameters:
                      barmanObjectName: $name-backups
                resources:
                  requests: {cpu: 50m, memory: 192Mi}
                  limits: {cpu: 300m, memory: 384Mi}
                storage:
                  size: 1Gi
              ---
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: $name
              spec:
                podSelector:
                  matchLabels:
                    cnpg.io/cluster: $name
                policyTypes: [Ingress, Egress]
                ingress:
                  - from:
                      - podSelector:
                          matchLabels:
                            cnpg.io/cluster: $name
                    ports:
                      - {protocol: TCP, port: 5432}
                  - from:
                      - namespaceSelector:
                          matchLabels:
                            kubernetes.io/metadata.name: cnpg-system
                        podSelector:
                          matchLabels:
                            app.kubernetes.io/name: cloudnative-pg
                    ports:
                      - {protocol: TCP, port: 5432}
                      - {protocol: TCP, port: 8000}
                egress:
                  - to:
                      - podSelector:
                          matchLabels:
                            cnpg.io/cluster: $name
                    ports:
                      - {protocol: TCP, port: 5432}
                  - to:
                      - ipBlock:
                          cidr: $node_ip/32
                    ports:
                      - {protocol: TCP, port: 6443}
                  - to:
                      - ipBlock:
                          cidr: 10.43.0.1/32
                    ports:
                      - {protocol: TCP, port: 443}
                  - to:
                      - namespaceSelector:
                          matchLabels:
                            kubernetes.io/metadata.name: postgres
                        podSelector:
                          matchLabels:
                            app.kubernetes.io/name: rustfs
                    ports:
                      - {protocol: TCP, port: 9000}
              YAML

              kubectl -n "$ns" wait cluster/"$name" --for=condition=Ready --timeout=12m
              kubectl -n "$ns" wait cluster/"$name" --for=condition=ContinuousArchiving --timeout=5m
              kubectl -n "$ns" --as="$as" get secret "$name-app" -o jsonpath='{.data.uri}' | base64 -d |
                grep -q "^postgresql://app:.*@$name-rw.$ns:5432/app$"
              printf 'cluster ready, WAL archiving, %s-app carries the uri\n' "$name"

              kubectl -n "$ns" --as="$as" apply -f - <<YAML
              apiVersion: postgresql.cnpg.io/v1
              kind: ScheduledBackup
              metadata:
                name: $name
              spec:
                schedule: "0 0 2 * * *"
                immediate: true
                backupOwnerReference: self
                method: plugin
                cluster:
                  name: $name
                pluginConfiguration:
                  name: barman-cloud.cloudnative-pg.io
              YAML
              deadline=$(($(date +%s) + 600))
              until kubectl -n "$ns" get backup -l cnpg.io/scheduled-backup="$name" \
                -o jsonpath='{.items[*].status.phase}' | grep -qw completed; do
                if kubectl -n "$ns" get backup -l cnpg.io/scheduled-backup="$name" \
                  -o jsonpath='{.items[*].status.phase}' | grep -qw failed || [ "$(date +%s)" -ge "$deadline" ]; then
                  kubectl -n "$ns" get backup -o yaml >&2
                  exit 1
                fi
                sleep 5
              done
              printf 'immediate scheduled backup completed\n'
      catch:
        - script:
            content: |
              kubectl -n e2e-tenant get cluster,pods,jobs -o wide
              kubectl -n e2e-tenant describe cluster e2e-dedicated | tail -40
              kubectl -n e2e-tenant get events --sort-by=.lastTimestamp | tail -40
              kubectl -n e2e-tenant get pods -l cnpg.io/cluster=e2e-dedicated -o name |
                xargs -r -n1 kubectl -n e2e-tenant logs --all-containers --prefix --tail=40
      finally:
        - script:
            timeout: 5m
            content: |
              kubectl -n e2e-tenant delete scheduledbackup e2e-dedicated --ignore-not-found
              kubectl -n e2e-tenant delete backup -l cnpg.io/scheduled-backup=e2e-dedicated --ignore-not-found
              kubectl -n e2e-tenant delete cluster e2e-dedicated --ignore-not-found --wait=true --timeout=4m
              kubectl -n e2e-tenant delete objectstore e2e-dedicated-backups --ignore-not-found
              kubectl -n e2e-tenant delete imagecatalog e2e-dedicated --ignore-not-found
              kubectl -n e2e-tenant delete networkpolicy e2e-dedicated --ignore-not-found
              kubectl -n e2e-tenant delete secret e2e-dedicated-backup --ignore-not-found
              kubectl -n postgres delete networkpolicy e2e-tenant-postgres-to-rustfs --ignore-not-found

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: other-path
  namespace: blog
spec:
  rules:
    - host: shop.example.test
      http:
        paths:
          - path: /blog
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: other-host
  namespace: blog
spec:
  rules:
    - host: blog.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clash
  namespace: blog
spec:
  rules:
    - host: shop.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http

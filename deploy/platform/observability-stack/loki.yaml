apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 30m
  timeout: 5m
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
  chartRef:
    kind: OCIRepository
    name: loki
    namespace: observability
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    deploymentMode: Monolithic
    global:
      priorityClassName: platform-standard

    loki:
      image:
        digest: sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
        tag: "3.7.10"
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
      limits_config:
        # Logs retention budget (§8.5): the single source of truth.
        retention_period: 336h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
        # /var/loki is the singleBinary PVC mount.
        working_directory: /var/loki/compactor
      # The ruler evaluates deploy/observability-platform/loki-rules, which the
      # baukit-platform-observability release ships as a ConfigMap mounted below.
      rulerConfig:
        alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
        rule_path: /var/loki/ruler-scratch
        storage:
          type: local
          local:
            directory: /etc/loki/rules

    singleBinary:
      replicas: 1
      sidecar: false
      # The ConfigMap is required: Loki does not start until the pack has rendered it.
      # "fake" is Loki's tenant when auth_enabled is false.
      extraVolumes:
        - name: platform-loki-rules
          configMap:
            name: baukit-platform-observability-loki-rules
      extraVolumeMounts:
        - name: platform-loki-rules
          mountPath: /etc/loki/rules/fake
          readOnly: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 750m
          memory: 1Gi
      persistence:
        enabled: true
        size: 20Gi
        accessModes:
          - ReadWriteOnce
        whenDeleted: Retain
        whenScaled: Retain

    # Distributed targets stay absent in monolithic mode.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    gateway:
      image:
        digest: sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
        tag: 1.31.7-alpine
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 150m
          memory: 128Mi
      metrics:
        image:
          digest: sha256:a1448056c0081f067ecb48096a81cea9abc418b1405e49eac8a29d2b31302576
          tag: "0.5.2"
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: true

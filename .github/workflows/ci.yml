name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native-changes:
    name: Detect native gate changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      sqlite: ${{ steps.filter.outputs.sqlite }}
      notifications: ${{ steps.filter.outputs.notifications }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            mobile:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'scripts/android-sdk-setup.sh'
              - 'scripts/ci-free-disk.sh'
              - 'scripts/ci-android-ndk.sh'
              - 'scripts/check-gradle-deprecations.py'
              - 'cli/**'
              - 'templates/common/.github/**'
              - 'templates/mobile/**'
              - 'typescript/pnpm-lock.yaml'
              - 'typescript/packages/analytics-core/**'
              - 'typescript/packages/analytics-posthog-native/**'
              - 'typescript/packages/api-runtime/**'
              - 'typescript/packages/auth-native/**'
              - 'typescript/packages/data-contracts/**'
              - 'typescript/packages/data-contracts-expo-sqlite/**'
              - 'typescript/packages/navigation/**'
              - 'typescript/packages/purchases-core/**'
              - 'typescript/packages/purchases-revenuecat/**'
              - 'typescript/packages/ui-tokens/**'
            sqlite:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'scripts/android-sdk-setup.sh'
              - 'scripts/ci-free-disk.sh'
              - 'scripts/ci-android-ndk.sh'
              - 'scripts/check-gradle-deprecations.py'
              - 'scripts/expo-android-conformance.sh'
              - 'examples/expo-sqlite-conformance/**'
              - 'typescript/pnpm-lock.yaml'
              - 'typescript/packages/data-contracts/**'
              - 'typescript/packages/data-contracts-expo-sqlite/**'
            notifications:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'scripts/android-sdk-setup.sh'
              - 'scripts/ci-free-disk.sh'
              - 'scripts/ci-android-ndk.sh'
              - 'scripts/check-gradle-deprecations.py'
              - 'scripts/expo-android-conformance.sh'
              - 'examples/expo-notifications-conformance/**'
              - 'fixtures/zoned-time/**'
              - 'fixtures/notifications/**'
              - 'typescript/pnpm-lock.yaml'
              - 'typescript/packages/localization-core/**'
              - 'typescript/packages/notifications-core/**'
              - 'typescript/packages/notifications-expo/**'

  version-coherence:
    name: Release version coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci-gate.sh --step version-coherence

  supply-chain:
    name: Supply chain and script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.8.11
          cache: false
          install_args: >-
            aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:gitleaks/gitleaks
            aqua:google/osv-scanner aqua:astral-sh/ruff aqua:koalaman/shellcheck
      - run: scripts/ci-gate.sh --step workflow-lint
      - run: scripts/ci-gate.sh --step secret-scan
      - run: scripts/ci-gate.sh --step osv
      - run: scripts/ci-gate.sh --step python-lint
      - run: scripts/ci-gate.sh --step shell-lint

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - run: scripts/ci-gate.sh --step rust-fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - run: scripts/ci-gate.sh --step rust-clippy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - run: scripts/ci-gate.sh --step rust-tests
      - run: scripts/ci-gate.sh --step rust-check
      - run: scripts/ci-gate.sh --step examples-test

  suite-features:
    name: Suite feature boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - run: scripts/ci-gate.sh --step suite-features

  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
      - run: scripts/ci-gate.sh --step cargo-deny

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          key: msrv-1.95
      - run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - name: Enable pinned pnpm
        working-directory: typescript
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
          pnpm --version
      - name: Find pnpm store
        id: pnpm-store
        working-directory: typescript
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('typescript/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Check example lockfiles
        run: scripts/ci-gate.sh --step example-lockfiles
      - name: Install TypeScript dependencies
        run: scripts/ci-gate.sh --step ts-install
      - name: Build, lint, and test TypeScript packages
        env:
          BAUKIT_GATE_WORKERS: 4
        run: scripts/ci-gate.sh --step ts-check
      - name: Check packed npm dependencies
        run: scripts/ci-gate.sh --step package-dependencies
      - name: Test Dexie conformance in Chromium and WebKit
        working-directory: typescript
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/typescript/.playwright-browsers
        run: |
          pnpm --filter @baukit/data-contracts-dexie exec playwright install --with-deps chromium webkit
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          ../scripts/with-loopback-network.sh pnpm --filter @baukit/data-contracts-dexie run test:browser
          ../scripts/with-loopback-network.sh pnpm --filter @baukit/navigation run test:browser

  observability-lint:
    name: Observability metric names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci-gate.sh --step metric-names
      - run: scripts/ci-gate.sh --step observability-tests
      - run: scripts/ci-gate.sh --step observability-rules

  openapi-compatibility:
    name: OpenAPI compatibility check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - name: Enable pinned pnpm for release train tests
        working-directory: typescript
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
      - name: Install TypeScript dependencies for package checks
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Allow unprivileged user namespaces for loopback network tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: scripts/ci-gate.sh --step scripts-tests

  media-grants:
    name: Media grant njs verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - run: scripts/ci-gate.sh --step media-grants

  cli:
    name: Baukit CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli -> target
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.8.11
          cache: false
          install_args: aqua:ast-grep/ast-grep
      - run: scripts/ci-gate.sh --step cli-fmt
      - run: scripts/ci-gate.sh --step cli-clippy
      - run: scripts/ci-gate.sh --step cli-tests
      - run: scripts/ci-gate.sh --step cli-check
      - run: scripts/ci-gate.sh --step baukit-check

  fuzz:
    name: Fuzz targets (60 s each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust/fuzz -> target
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-fuzz@0.13.2
      - run: scripts/ci-gate.sh --step fuzz

  mcp-fixture:
    name: Remote MCP fixture and OAuth smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true
      CARGO_BUILD_JOBS: 6
      VITEST_MAX_WORKERS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - run: npm install --global corepack@0.36.0 && corepack enable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            rust -> target
            cli -> target
      - run: cargo test --manifest-path rust/Cargo.toml -p baukit-mcp -- --include-ignored
      - run: scripts/ci-gate.sh --step mcp-fixture

  generated-fixture:
    name: Generated fixture (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: backend
            product_name: fixture
            flags: --backend
            backend: true
            mobile: false
            web: false
            mcp: false
          - flavor: web
            product_name: fixture
            flags: --web
            backend: false
            mobile: false
            web: true
            mcp: false
          - flavor: mobile
            product_name: fixture
            flags: --mobile
            backend: false
            mobile: true
            web: false
            mcp: false
          - flavor: mobile-pwa
            product_name: fixture
            flags: --mobile --pwa
            backend: false
            mobile: true
            web: false
            mcp: false
          - flavor: mobile-pwa-auth
            product_name: mobile-pwa-auth-fixture
            flags: --backend --mobile --pwa --auth oidc
            backend: true
            mobile: true
            web: false
            mcp: false
          - flavor: combined
            product_name: fixture
            flags: --backend --mobile --web
            backend: true
            mobile: true
            web: true
            mcp: false
          - flavor: mcp
            product_name: fixture
            flags: --backend --mcp --auth oidc
            backend: true
            mobile: false
            web: false
            mcp: true
          - flavor: auth
            product_name: long-product-name-fixture
            flags: --backend --mobile --web --auth oidc --mcp
            backend: true
            mobile: true
            web: true
            mcp: true
          - flavor: clerk
            product_name: clerk-provider-fixture
            flags: --backend --mobile --web --auth clerk --mcp
            backend: true
            mobile: true
            web: true
            mcp: true
          - flavor: workos
            product_name: workos-provider-fixture
            flags: --backend --mobile --web --auth workos --mcp
            backend: true
            mobile: true
            web: true
            mcp: true
          - flavor: platform-standalone
            product_name: platform-standalone-fixture
            flags: --backend --platform --web
            backend: true
            mobile: false
            web: true
            mcp: false
          - flavor: platform
            product_name: platform-fixture
            flags: --backend --platform --worker --web --auth oidc
            backend: true
            mobile: false
            web: true
            mcp: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - name: Enable pinned pnpm
        working-directory: typescript
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
          pnpm --version
      - name: Find pnpm store
        id: pnpm-store
        working-directory: typescript
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-generated-${{ matrix.flavor }}-${{ hashFiles('typescript/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-generated-
            ${{ runner.os }}-pnpm-
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli -> target
          key: generated-fixture-cli
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.8.11
          cache: false
          install_args: >-
            aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:gitleaks/gitleaks
            aqua:google/osv-scanner aqua:astral-sh/ruff aqua:koalaman/shellcheck
      - name: Allow unprivileged user namespaces for loopback network tests
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Generate and verify the fixture
        env:
          BAUKIT_FIXTURE_FLAVORS: ${{ matrix.flavor }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci-gate.sh --step generated-fixture

  affected-fixture:
    name: Affected gate selection fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli -> target
      - run: scripts/ci-gate.sh --step affected-fixture

  generated-mobile-android-build:
    name: Build generated mobile Android fixture (${{ matrix.provider }})
    needs: native-changes
    if: needs.native-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: none
            flags: ''
          - provider: oidc
            flags: --auth oidc
          - provider: clerk
            flags: --auth clerk
          - provider: workos
            flags: --auth workos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk
        run: bash scripts/ci-free-disk.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
      - name: Enable pinned pnpm
        working-directory: typescript
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
      - name: Find pnpm store
        id: native-pnpm-store
        working-directory: typescript
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-native-${{ hashFiles('typescript/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-native-
            ${{ runner.os }}-pnpm-
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli -> target
          key: generated-native-fixture-cli
      - name: Build local mobile dependencies
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @baukit/type-guards --filter @baukit/csp --filter @baukit/a11y-core --filter @baukit/analytics-core --filter @baukit/analytics-posthog-native --filter @baukit/api-runtime --filter @baukit/auth-native --filter @baukit/data-contracts --filter @baukit/data-contracts-expo-sqlite --filter @baukit/localization-core --filter @baukit/ui-tokens --filter @baukit/navigation --filter @baukit/purchases-core --filter @baukit/purchases-revenuecat run build
      - name: Generate mobile fixture
        env:
          FIXTURE_FLAGS: ${{ matrix.flags }}
        run: |
          read -r -a fixture_flags <<< "$FIXTURE_FLAGS"
          cargo build --manifest-path cli/Cargo.toml --bin baukit
          cli/target/debug/baukit new fixture --mobile "${fixture_flags[@]}" --dir .generated-native-fixture --baukit-path rust
      - name: Install fixture dependencies
        working-directory: .generated-native-fixture/fixture/mobile
        run: pnpm install --frozen-lockfile
      - name: Clean Expo Android prebuild
        working-directory: .generated-native-fixture/fixture/mobile
        run: |
          set -o pipefail
          CI=1 pnpm exec expo prebuild --clean --platform android 2>&1 | tee native-prebuild.log
      - name: Find pinned Android NDK
        id: native-ndk
        run: bash scripts/ci-android-ndk.sh version .generated-native-fixture/fixture/mobile >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-ndk.outputs.path }}
          key: ${{ runner.os }}-android-ndk-${{ steps.native-ndk.outputs.version }}
      - name: Install pinned Android NDK
        env:
          NDK_VERSION: ${{ steps.native-ndk.outputs.version }}
        run: bash scripts/ci-android-ndk.sh install "$NDK_VERSION"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Compile Android debug binary
        working-directory: .generated-native-fixture/fixture/mobile
        run: |
          set -o pipefail
          bash scripts/android-java.sh ./android/gradlew -p android --no-daemon --stacktrace --warning-mode all -PreactNativeDevServerIp=127.0.0.1 assembleDebug 2>&1 | tee native-assemble.log
      - name: Check Gradle deprecations from Baukit-owned files
        run: python3 scripts/check-gradle-deprecations.py --project .generated-native-fixture/fixture/mobile .generated-native-fixture/fixture/mobile/native-assemble.log
      - name: Upload native failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-mobile-android-failure-${{ matrix.provider }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            .generated-native-fixture/fixture/mobile/native-prebuild.log
            .generated-native-fixture/fixture/mobile/native-assemble.log
            .generated-native-fixture/fixture/mobile/.expo/
            .generated-native-fixture/fixture/mobile/android/app/build/reports/
            .generated-native-fixture/fixture/mobile/android/build/reports/

  generated-mobile-android-gate:
    name: Generated mobile Android gate
    needs: [native-changes, generated-mobile-android-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce relevant native build result
        env:
          MOBILE_RELEVANT: ${{ needs.native-changes.outputs.mobile }}
          BUILD_RESULT: ${{ needs.generated-mobile-android-build.result }}
        run: |
          if [[ "$MOBILE_RELEVANT" != "true" ]]; then
            echo "No mobile, config, CLI, or dependency paths changed; gate is not applicable."
          elif [[ "$BUILD_RESULT" == "success" ]]; then
            echo "Generated mobile Android fixture compiled successfully."
          else
            echo "Relevant Android build result was $BUILD_RESULT; skipped or unavailable is not green." >&2
            exit 1
          fi

  expo-sqlite-android-build:
    name: Expo SQLite conformance on Android
    needs: native-changes
    if: needs.native-changes.outputs.sqlite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk
        run: bash scripts/ci-free-disk.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: typescript/.nvmrc
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Find pnpm store
        id: sqlite-pnpm-store
        working-directory: typescript
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sqlite-pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-sqlite-${{ hashFiles('typescript/pnpm-lock.yaml', 'examples/expo-sqlite-conformance/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-sqlite-
            ${{ runner.os }}-pnpm-
      - name: Prepare Expo SQLite Android project
        run: make expo-sqlite-conformance-prepare
      - name: Find pinned Android NDK
        id: sqlite-ndk
        run: bash scripts/ci-android-ndk.sh version examples/expo-sqlite-conformance >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sqlite-ndk.outputs.path }}
          key: ${{ runner.os }}-android-ndk-${{ steps.sqlite-ndk.outputs.version }}
      - name: Install pinned Android NDK
        env:
          NDK_VERSION: ${{ steps.sqlite-ndk.outputs.version }}
        run: bash scripts/ci-android-ndk.sh install "$NDK_VERSION"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run real Expo SQLite conformance
        env:
          BAUKIT_ANDROID_PHASE: run
        run: make expo-sqlite-conformance
      - name: Upload conformance failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-sqlite-android-failure
          if-no-files-found: warn
          retention-days: 7
          path: |
            examples/expo-sqlite-conformance/artifacts/
            examples/expo-sqlite-conformance/.expo/
            examples/expo-sqlite-conformance/android/app/build/reports/

  expo-sqlite-android-gate:
    name: Expo SQLite Android gate
    needs: [native-changes, expo-sqlite-android-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce relevant device-conformance result
        env:
          SQLITE_RELEVANT: ${{ needs.native-changes.outputs.sqlite }}
          BUILD_RESULT: ${{ needs.expo-sqlite-android-build.result }}
        run: |
          if [[ "$SQLITE_RELEVANT" != "true" ]]; then
            echo "No SQLite adapter or conformance paths changed; gate is not applicable."
          elif [[ "$BUILD_RESULT" == "success" ]]; then
            echo "Real Expo SQLite conformance passed on Android."
          else
            echo "Relevant SQLite conformance result was $BUILD_RESULT; skipped or unavailable is not green." >&2
            exit 1
          fi


# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backup-restore
spec:
  description: >-
    A sentinel row written as the product owner survives a barman-cloud backup to rustfs, the deletion of
    its Cluster, and a restore into a new Cluster. The postgres-restore-test CronJob then runs the same
    round trip against postgres-cluster and must succeed.
  timeouts:
    exec: 45m
  steps:
    - name: backup-delete-restore
      try:
        - script:
            timeout: 30m
            content: |
              set -eu
              ns=postgres
              source=e2e-backup-source
              restored=e2e-backup-restored
              store=e2e-backup-restore
              image="$(kubectl -n "$ns" get cluster postgres-cluster -o jsonpath='{.spec.imageName}')"
              user="$(kubectl -n "$ns" get secret product-db-credentials -o jsonpath='{.data.username}' | base64 -d)"
              password="$(kubectl -n "$ns" get secret product-db-credentials -o jsonpath='{.data.password}' | base64 -d)"
              endpoint="$(kubectl -n "$ns" get objectstore postgres-backups -o jsonpath='{.spec.configuration.endpointURL}')"
              bucket="$(kubectl -n "$ns" get objectstore postgres-backups -o jsonpath='{.spec.configuration.destinationPath}' |
                sed -E 's#^(s3://[^/]+)/.*#\1#')"
              token="e2e-$(date -u +%Y%m%dT%H%M%SZ)-$$"
              psql_as_owner() {
                printf '%s\n' "$password" |
                  kubectl -n "$ns" exec -i "$1" -c postgres -- sh -ec \
                    'IFS= read -r PGPASSWORD; export PGPASSWORD; exec psql -h 127.0.0.1 -U "$1" -d product -v ON_ERROR_STOP=1 -tAX -c "$2"' \
                    sentinel "$user" "$2"
              }
              primary() { kubectl -n "$ns" get cluster "$1" -o jsonpath='{.status.currentPrimary}'; }
              cluster_manifest() {
                cat <<YAML
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: $1
                namespace: $ns
              spec:
                instances: 1
                enablePDB: false
                imageName: $image
                enableSuperuserAccess: false
                resources:
                  requests: {cpu: 50m, memory: 192Mi}
                  limits: {cpu: 300m, memory: 384Mi}
                storage:
                  size: 1Gi
              YAML
              }

              kubectl apply -f - <<YAML
              apiVersion: barmancloud.cnpg.io/v1
              kind: ObjectStore
              metadata:
                name: $store
                namespace: $ns
              spec:
                instanceSidecarConfiguration:
                  env:
                    - name: AWS_DEFAULT_REGION
                      value: us-east-1
                  resources:
                    requests: {cpu: 25m, memory: 64Mi}
                    limits: {cpu: 200m, memory: 256Mi}
                configuration:
                  destinationPath: $bucket/e2e-backup-restore-$token
                  endpointURL: $endpoint
                  s3Credentials:
                    accessKeyId: {name: postgres-backup-credentials, key: ACCESS_KEY_ID}
                    secretAccessKey: {name: postgres-backup-credentials, key: ACCESS_SECRET_KEY}
                  wal:
                    compression: gzip
                    archiveAdditionalCommandArgs: ["--addressing-style=path"]
                    restoreAdditionalCommandArgs: ["--addressing-style=path"]
                  data:
                    compression: gzip
                    additionalCommandArgs: ["--addressing-style=path"]
              YAML

              { cluster_manifest "$source"; cat <<YAML
                bootstrap:
                  initdb:
                    database: product
                    owner: $user
                    secret:
                      name: product-db-credentials
                plugins:
                  - name: barman-cloud.cloudnative-pg.io
                    isWALArchiver: true
                    parameters:
                      barmanObjectName: $store
              YAML
              } | kubectl apply -f -
              kubectl -n "$ns" wait cluster/"$source" --for=condition=Ready --timeout=15m

              psql_as_owner "$(primary "$source")" \
                "CREATE TABLE baukit_e2e_sentinel (token text NOT NULL, written_at timestamptz NOT NULL DEFAULT now()); INSERT INTO baukit_e2e_sentinel (token) VALUES ('$token')"
              printf 'sentinel written: %s\n' "$token"

              kubectl apply -f - <<YAML
              apiVersion: postgresql.cnpg.io/v1
              kind: Backup
              metadata:
                name: $source
                namespace: $ns
              spec:
                method: plugin
                cluster:
                  name: $source
                pluginConfiguration:
                  name: barman-cloud.cloudnative-pg.io
              YAML
              deadline=$(($(date +%s) + 900))
              until [ "$(kubectl -n "$ns" get backup "$source" -o jsonpath='{.status.phase}')" = completed ]; do
                if [ "$(kubectl -n "$ns" get backup "$source" -o jsonpath='{.status.phase}')" = failed ] ||
                  [ "$(date +%s)" -ge "$deadline" ]; then
                  kubectl -n "$ns" get backup "$source" -o yaml >&2
                  exit 1
                fi
                sleep 5
              done
              printf 'backup completed\n'

              kubectl -n "$ns" delete cluster "$source" --wait=true --timeout=5m
              deadline=$(($(date +%s) + 300))
              while [ -n "$(kubectl -n "$ns" get pvc -l cnpg.io/cluster="$source" -o name)" ]; do
                [ "$(date +%s)" -lt "$deadline" ] || { printf 'PVCs of %s were not deleted\n' "$source" >&2; exit 1; }
                sleep 5
              done
              printf 'source cluster deleted, object store %s kept\n' "$store"

              { cluster_manifest "$restored"; cat <<YAML
                bootstrap:
                  recovery:
                    source: origin
                externalClusters:
                  - name: origin
                    plugin:
                      name: barman-cloud.cloudnative-pg.io
                      parameters:
                        barmanObjectName: $store
                        serverName: $source
              YAML
              } | kubectl apply -f -
              kubectl -n "$ns" wait cluster/"$restored" --for=condition=Ready --timeout=20m

              got="$(psql_as_owner "$(primary "$restored")" "SELECT token FROM baukit_e2e_sentinel")"
              if [ "$got" != "$token" ]; then
                printf 'restored sentinel %s, expected %s\n' "${got:-<missing>}" "$token" >&2
                exit 1
              fi
              printf 'restored sentinel matches: %s\n' "$got"
      finally:
        - script:
            timeout: 5m
            content: |
              kubectl -n postgres delete cluster e2e-backup-source e2e-backup-restored --ignore-not-found --wait=true --timeout=4m
              kubectl -n postgres delete backup e2e-backup-source --ignore-not-found
              kubectl -n postgres delete objectstore e2e-backup-restore --ignore-not-found
    - name: restore-test-cronjob
      try:
        - script:
            timeout: 40m
            content: |
              set -eu
              ns=postgres
              job="restore-test-e2e-$(date +%s)"
              kubectl -n "$ns" create job "$job" --from=cronjob/postgres-restore-test
              deadline=$(($(date +%s) + 2340))
              while :; do
                succeeded="$(kubectl -n "$ns" get job "$job" -o jsonpath='{.status.succeeded}')"
                failed="$(kubectl -n "$ns" get job "$job" -o jsonpath='{.status.failed}')"
                [ "$succeeded" != 1 ] || break
                if [ -n "$failed" ] || [ "$(date +%s)" -ge "$deadline" ]; then
                  kubectl -n "$ns" logs job/"$job" --all-containers >&2 || true
                  kubectl -n "$ns" describe job "$job" >&2 || true
                  exit 1
                fi
                sleep 10
              done
              kubectl -n "$ns" logs job/"$job" -c restore-test | grep 'restored sentinel .* matches'

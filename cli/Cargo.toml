[package]
name = "baukit-cli"
version = "0.25.2"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "baukit"
path = "src/main.rs"

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
too_many_lines = "warn"
allow_attributes_without_reason = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
return_self_not_must_use = "warn"
unused_async = "warn"
needless_pass_by_value = "warn"
manual_let_else = "warn"
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"
print_stdout = "warn"
print_stderr = "warn"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.18"
ignore = "0.4.25"
include_dir = "0.7.4"
minijinja = "2.24.0"
regex = "1.13.1"
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.6"

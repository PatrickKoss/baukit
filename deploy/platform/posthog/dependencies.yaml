    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: analytics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: posthog-zookeeper
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: analytics
  ports:
    - name: client
      port: 2181
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: posthog-zookeeper
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog-zookeeper
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: analytics
spec:
  serviceName: posthog-zookeeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog-zookeeper
      app.kubernetes.io/part-of: baukit-platform
      baukit.dev/component: analytics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog-zookeeper
        app.kubernetes.io/part-of: baukit-platform
        baukit.dev/component: analytics
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zookeeper
          image: zookeeper:3.8.4@sha256:20d3c93ebda093d0c90911493396975e0e04523af225d8053d42bab781f9ca48
          imagePullPolicy: IfNotPresent
          env:
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: ruok
          ports:
            - name: client
              containerPort: 2181
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 5m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: data
              mountPath: /data
            - name: datalog
              mountPath: /datalog
      volumes:
        - name: datalog
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: posthog-kafka
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog-kafka
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: analytics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: posthog-kafka
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: analytics
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: admin
      port: 9644
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: posthog-kafka
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog-kafka
    app.kubernetes.io/part-of: baukit-platform
    baukit.dev/component: analytics
spec:
  serviceName: posthog-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog-kafka
      app.kubernetes.io/part-of: baukit-platform
      baukit.dev/component: analytics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog-kafka
        app.kubernetes.io/part-of: baukit-platform
        baukit.dev/component: analytics
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
          imagePullPolicy: IfNotPresent
          args:
            - redpanda
            - start
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://posthog-kafka.posthog.svc.cluster.local:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=posthog-kafka.posthog.svc.cluster.local:33145
            - --mode=dev-container
            - --smp=1
            - --memory=384M
            - --reserve-memory=0M
            - --overprovisioned
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 160Mi}
            limits: {cpu: 500m, memory: 640Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

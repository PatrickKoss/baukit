apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - oci-repository.yaml
  - helm-release.yaml
  - metric-templates.yaml
  - network-policy.yaml
namespace: flagger-system
components:
  - ../components/network-policy/default-deny
  - ../components/network-policy/dns-egress
  - ../components/network-policy/apiserver-egress
  - ../components/network-policy/prometheus-scrape
patches:
  - target:
      kind: NetworkPolicy
      name: allow-prometheus-scrape
    patch: |-
      - op: replace
        path: /spec/ingress/0/ports
        value:
          - protocol: TCP
            port: 8080
